<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sealed Helper</title>
<meta name="description" content="Reality Fracture sealed: enter your pool, get your best colours and a 40-card deck, see the tricks your opponent could have.">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080B10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sealed">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Block, Motherbase's default theme: flat plates, hairlines do the separating,
   6px corners, Chakra Petch for headings, labels and numbers. */
:root{
  --bg:#080B10; --bg2:#0E141D; --bg3:#131B26; --bg4:#1B2634;
  --line:#1E2A38; --line2:#2B3A4D;
  --ink:#DBE7F0; --ink2:#B8C9D8; --ink3:#7F93A8;
  --brass:#F0B323; --brass-fg:#1A1206; --brass-soft:rgba(240,179,35,.10);
  --danger:#FF6B81; --good:#6EE7A8; --warn:#FFB347; --info:#7EE8FA;
  --mW:#f4ecd6; --mU:#4a8fd6; --mB:#8a7598; --mR:#d4543c; --mG:#4a9d5c; --mC:#a9b4b0;
  --s1:4px; --s2:6px; --s3:8px; --s4:12px; --s5:16px; --s6:22px;
  --t1:11px; --t2:13px; --t3:15px; --t4:19px; --t5:25px;
  --tap:44px; --r:6px; --cap:.08em;
  --disp:'Chakra Petch',system-ui,sans-serif;
  --ui:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.45;min-height:100vh}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;touch-action:manipulation;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}

.top{position:sticky;top:0;z-index:5;background:var(--bg2);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top,0px)) 16px 0}
.toprow{display:flex;align-items:center;gap:var(--s4);max-width:760px;margin:0 auto}
.brand{font-family:var(--disp);font-weight:700;font-size:19px;color:var(--brass);line-height:1;letter-spacing:var(--cap);text-transform:uppercase}
.brand small{display:block;font-weight:500;font-size:10px;letter-spacing:.14em;color:var(--ink3);margin-top:4px}
.spacer{flex:1}
.count{font-family:var(--disp);font-weight:600;font-size:var(--t2);color:var(--ink2);font-variant-numeric:tabular-nums}
.steps{display:flex;gap:2px;max-width:760px;margin:var(--s3) auto 0}
.stepbtn{flex:1;min-height:var(--tap);font-family:var(--disp);font-weight:600;font-size:var(--t2);letter-spacing:var(--cap);text-transform:uppercase;color:var(--ink3);border-bottom:2px solid transparent;text-align:center}
.stepbtn.on{color:var(--brass);border-bottom-color:var(--brass)}

main{max-width:760px;margin:0 auto;padding:var(--s5) 16px calc(90px + env(safe-area-inset-bottom,0px))}
h2{font-family:var(--disp);font-weight:600;font-size:var(--t4);margin:var(--s6) 0 var(--s3)}
h2:first-child{margin-top:0}
h3{font-family:var(--disp);font-size:var(--t1);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin:var(--s5) 0 var(--s2);display:flex;gap:var(--s3);align-items:baseline}
h3 .ct{font-family:var(--disp);color:var(--ink2);letter-spacing:0}
p{margin:0 0 var(--s3)}
.note{color:var(--ink2);font-size:var(--t2)}
.small{font-size:var(--t1);color:var(--ink3)}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:var(--s5)}
.row{display:flex;gap:var(--s3);flex-wrap:wrap;align-items:center}
.warn{color:var(--warn)} .good{color:var(--good)}

.btn{min-height:var(--tap);padding:0 var(--s5);border-radius:var(--r);background:var(--bg3);border:1px solid var(--line);color:var(--ink2);
  font-family:var(--disp);font-weight:600;letter-spacing:var(--cap);text-transform:uppercase;font-size:var(--t2);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--line2);color:var(--ink)}
.btn.primary{border-color:var(--brass);color:var(--brass)}
.btn.fill{background:var(--brass);color:var(--brass-fg);border-color:var(--brass)}
.btn.bad{border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.4;cursor:default}

.search{position:relative}
.search input{width:100%;background:var(--bg3);border:1px solid var(--line2);border-radius:var(--r);padding:10px 12px;min-height:48px;font-size:17px}
.search input:focus{outline:none;border-color:var(--brass)}
.results{margin-top:var(--s2);border:1px solid var(--line2);border-radius:var(--r);background:var(--bg2);overflow:hidden}
.results:empty{display:none}
.res{display:grid;grid-template-columns:1fr auto auto;gap:var(--s3);align-items:center;width:100%;min-height:50px;padding:6px 12px;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.res:hover,.res.first{background:var(--bg3)}
.res .nm{font-weight:500}
.res .have{font-family:var(--disp);font-size:var(--t1);color:var(--brass);letter-spacing:var(--cap);text-transform:uppercase}
.res .plus{font-family:var(--disp);font-weight:700;font-size:20px;color:var(--brass);width:28px;text-align:center}
.nores{padding:12px;color:var(--ink3);font-size:var(--t2)}

.crow{display:grid;grid-template-columns:30px 1fr auto;gap:var(--s3);align-items:center;width:100%;min-height:var(--tap);padding:7px 0;border-bottom:1px solid var(--line)}
.crow .mv{font-family:var(--disp);font-weight:600;font-size:var(--t2);color:var(--ink2);text-align:center;background:var(--bg3);border:1px solid var(--line);border-radius:var(--r);padding:2px 0}
.crow .nm{font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.crow .sub{font-size:var(--t1);color:var(--ink3);line-height:1.35}
.crow .right{display:flex;align-items:center;gap:var(--s3)}
.crow .n{font-family:var(--disp);font-weight:600;color:var(--ink2);min-width:22px;text-align:right}
.crow.dim{opacity:.55}

.sc{display:inline-grid;place-items:center;min-width:34px;height:24px;padding:0 5px;border-radius:4px;font-family:var(--disp);font-weight:700;font-size:12px;border:1px solid var(--line2);color:var(--ink3);font-variant-numeric:tabular-nums}
.sc.s4{background:var(--brass);border-color:var(--brass);color:var(--brass-fg)}
.sc.s3{border-color:var(--brass);color:var(--brass)}
.sc.s2{color:var(--ink2)}
.rar{font-family:var(--disp);font-size:10px;font-weight:700;letter-spacing:.06em;padding:0 5px;border-radius:3px;border:1px solid var(--line2);color:var(--ink3)}
.rar.U{color:#c6d3de;border-color:#5d7285}.rar.R{color:var(--brass);border-color:rgba(240,179,35,.5)}.rar.M{color:#ff8a5c;border-color:rgba(255,138,92,.5)}
.tag{font-family:var(--disp);font-size:10px;font-weight:600;letter-spacing:var(--cap);text-transform:uppercase;padding:0 5px;border-radius:3px;border:1px solid rgba(126,232,250,.4);color:var(--info)}
.tag.rm{border-color:rgba(255,107,129,.45);color:var(--danger)}
.tag.split{border-color:rgba(255,179,71,.45);color:var(--warn)}
.syn{font-family:var(--disp);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.syn.up{color:var(--good)}.syn.down{color:var(--warn)}
.themes{display:flex;flex-direction:column;gap:2px;margin-top:var(--s3);font-size:var(--t2);color:var(--ink2)}
.themes b{font-family:var(--disp);font-weight:600;color:var(--good)}

.cost{display:inline-flex;gap:2px;vertical-align:middle}
.pip{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;font-family:var(--disp);font-weight:700;font-size:10px;color:#10160f;line-height:1}
.pip.W{background:var(--mW)}.pip.U{background:var(--mU)}.pip.B{background:var(--mB)}.pip.R{background:var(--mR)}.pip.G{background:var(--mG)}.pip.C{background:var(--mC)}

.pairs{display:flex;flex-direction:column;gap:var(--s3)}
.pair{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s4);align-items:center;width:100%;padding:var(--s4);border:1px solid var(--line);border-radius:var(--r);background:var(--bg2);text-align:left}
.pair.on{border-color:var(--brass);background:var(--brass-soft)}
.pair .pp{display:flex;gap:3px}
.pair .pp .pip{width:22px;height:22px;font-size:12px}
.pair b{font-family:var(--disp);font-weight:600;display:block}
.pair .sub{font-size:var(--t1);color:var(--ink3)}
.pair .big{font-family:var(--disp);font-weight:700;font-size:22px;color:var(--brass);text-align:right;line-height:1}
.pair .big small{display:block;font-size:10px;font-weight:600;letter-spacing:var(--cap);color:var(--ink3);text-transform:uppercase;margin-top:3px}
.rank{font-family:var(--disp);font-size:10px;letter-spacing:var(--cap);text-transform:uppercase;color:var(--brass);font-weight:600}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2)}
.stat{padding:var(--s3);background:var(--bg3);border:1px solid var(--line);border-radius:var(--r);text-align:center}
.stat .v{font-family:var(--disp);font-size:22px;font-weight:700;color:var(--brass);line-height:1.1}
.stat .l{font-family:var(--disp);font-size:10px;letter-spacing:var(--cap);text-transform:uppercase;color:var(--ink3)}
.stat.off .v{color:var(--warn)}
.hist{display:flex;align-items:flex-end;gap:6px;height:96px;padding-top:16px;margin-top:var(--s4)}
.hist .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.hist .b{width:100%;background:var(--brass);border-radius:3px 3px 0 0;min-height:1px;position:relative}
.hist .b span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-family:var(--disp);font-size:11px;color:var(--ink2)}
.hist .l{font-family:var(--disp);font-size:11px;color:var(--ink3)}
.lands{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);align-items:center}
.lands .li{display:inline-flex;gap:6px;align-items:center;font-weight:500}
.lands .li b{font-family:var(--disp)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stepper button{width:var(--tap);height:var(--tap);font-family:var(--disp);font-size:20px;color:var(--ink2);background:var(--bg3)}
.stepper span{min-width:40px;text-align:center;font-family:var(--disp);font-weight:700;font-size:17px}

.opp{display:flex;gap:var(--s3);flex-wrap:wrap}
.cbtn{width:52px;height:52px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:18px;color:var(--ink3);background:var(--bg3)}
.cbtn.on{color:#10160f;border-color:var(--ink)}
.cbtn.on.W{background:var(--mW)}.cbtn.on.U{background:var(--mU)}.cbtn.on.B{background:var(--mB)}.cbtn.on.R{background:var(--mR)}.cbtn.on.G{background:var(--mG)}
.mana{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mbtn{min-height:48px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg3);font-family:var(--disp);font-weight:700;font-size:18px;color:var(--ink2)}
.mbtn.on{border-color:var(--brass);background:var(--brass);color:var(--brass-fg)}

.rule{padding:var(--s4) 0;border-bottom:1px solid var(--line)}
.rule b{font-family:var(--disp);font-weight:600;font-size:var(--t3);color:var(--brass);display:block;margin-bottom:2px}
.rule p{margin:0;color:var(--ink2)}
.rule p+p{margin-top:6px}
.empty{padding:var(--s6) var(--s5);text-align:center;color:var(--ink2);border:1px dashed var(--line2);border-radius:var(--r)}

/* The card sheet: a bottom sheet on a phone, a centred card on a wide screen,
   same as Motherbase's shared dialogs. */
.veil{position:fixed;inset:0;z-index:50;background:rgba(4,7,11,.72);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;margin:0 auto;width:100%;max-width:560px;max-height:92vh;max-height:92svh;display:flex;flex-direction:column;
  background:var(--bg2);border-top:1px solid var(--line2);border-radius:var(--r) var(--r) 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.sheet{top:50%;bottom:auto;left:50%;right:auto;transform:translate(-50%,-50%);width:min(560px,94vw);border:1px solid var(--line2);border-radius:var(--r)}}
.sheet-head{display:flex;align-items:center;gap:var(--s3);padding:var(--s4) var(--s5) var(--s3)}
.sheet-head h3{margin:0;flex:1;min-width:0;font-size:var(--t1);color:var(--ink3)}
.x{position:relative;width:32px;height:32px;border-radius:50%;background:var(--bg3);color:var(--ink2);font-size:14px;display:grid;place-items:center}
.x::after{content:'';position:absolute;left:50%;top:50%;width:var(--tap);height:var(--tap);transform:translate(-50%,-50%)}
.sheet-body{padding:0 var(--s5);overflow:auto;flex:1;min-height:0}
.sheet-foot{display:flex;gap:var(--s3);padding:var(--s4) var(--s5) var(--s5);border-top:1px solid var(--line);margin-top:var(--s4);flex-wrap:wrap}
.sheet-foot .btn{flex:1}
.cardview{display:grid;grid-template-columns:132px 1fr;gap:var(--s4);align-items:start}
.cardview img{width:132px;border-radius:7px;background:var(--bg3);aspect-ratio:488/680;display:block}
.cardview .nm{font-family:var(--disp);font-weight:700;font-size:var(--t4);line-height:1.15}
.cardview .ty{font-size:var(--t1);color:var(--ink3);margin:4px 0 8px}
.oracle{white-space:pre-line;font-size:var(--t2);color:var(--ink2);margin-top:var(--s4);line-height:1.5}
.verdict{display:flex;gap:var(--s3);align-items:center;margin-top:var(--s2)}
.verdict span:last-child{font-size:var(--t2);color:var(--ink)}
.zoom{display:block;width:100%;max-width:340px;margin:var(--s3) auto 0;border-radius:12px}

.scanrow{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s3)}
.scanner{position:fixed;inset:0;z-index:70;background:#000}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.guide{position:absolute;left:8%;right:8%;top:24%;height:56px;border:2px solid var(--brass);border-radius:var(--r);box-shadow:0 0 0 9999px rgba(0,0,0,.45);transition:border-color .15s}
.guide span{position:absolute;top:-24px;left:0;font-family:var(--disp);font-size:12px;font-weight:600;color:var(--brass);letter-spacing:var(--cap);text-transform:uppercase}
.guide.hit{border-color:var(--good);box-shadow:0 0 0 9999px rgba(0,0,0,.45),inset 0 0 0 3px var(--good)}
.scanbar{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(8,11,16,.94);border-top:1px solid var(--line2)}
#scanmsg{font-size:15px;min-height:44px;margin-bottom:8px}
#scanmsg b{font-family:var(--disp);color:var(--good)}
.scanbtns{display:flex;gap:var(--s3)}
.scanbtns .btn{flex:1}
.found{display:grid;grid-template-columns:28px 1fr auto;gap:var(--s3);align-items:center;width:100%;min-height:var(--tap);padding:6px 0;border-bottom:1px solid var(--line)}
.found .box{width:22px;height:22px;border-radius:4px;border:2px solid var(--line2)}
.found.on .box{background:var(--brass);border-color:var(--brass)}
.found .read{font-size:var(--t1);color:var(--ink3)}
.bar2{height:6px;border-radius:3px;background:var(--bg3);overflow:hidden;margin-top:var(--s3)}
.bar2 i{display:block;height:100%;background:var(--brass);width:0}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;
  display:flex;gap:var(--s4);align-items:center;background:var(--bg4);border:1px solid var(--line2);border-radius:var(--r);padding:4px 4px 4px 14px;
  max-width:calc(100vw - 32px);font-size:var(--t2);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast span{flex:1;min-width:0}
.toast .btn{min-height:40px}
</style>
</head>
<body>
<header class="top">
  <div class="toprow">
    <div class="brand">Sealed<small>Reality Fracture</small></div>
    <div class="spacer"></div>
    <span class="count" id="count"></span>
  </div>
  <nav class="steps">
    <button class="stepbtn" data-act="tab" data-v="pool">Pool</button>
    <button class="stepbtn" data-act="tab" data-v="build">Build</button>
    <button class="stepbtn" data-act="tab" data-v="tricks">Tricks</button>
    <button class="stepbtn" data-act="tab" data-v="rules">Rules</button>
  </nav>
</header>

<main>
  <section id="pool">
    <div class="search">
      <input id="q" type="search" placeholder="Type a card name" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="Card name">
      <div class="results" id="results"></div>
    </div>
    <div class="scanrow">
      <button class="btn primary" data-act="scan">Scan with camera</button>
      <button class="btn" data-act="photo">Photo of a pack</button>
      <input id="photoin" type="file" accept="image/*" hidden>
    </div>
    <div id="poollist"></div>
  </section>
  <section id="build" hidden></section>
  <section id="tricks" hidden></section>
  <section id="rules" hidden></section>
</main>

<div id="scanner" class="scanner" hidden>
  <video id="cam" playsinline muted autoplay></video>
  <div class="guide" id="guide"><span>Card name here</span></div>
  <div class="scanbar">
    <div id="scanmsg" aria-live="polite">Starting the camera…</div>
    <div class="scanbtns"><button class="btn" data-act="scanundo" id="scanundo" hidden>Undo last</button><button class="btn fill" data-act="scanstop">Done</button></div>
  </div>
</div>

<div id="toast" class="toast" hidden><span id="toastmsg"></span><button class="btn" data-act="undo">Undo</button></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

// Bump when fra.json changes, so no phone keeps an old copy from its cache.
const DATA_V = '2026-09-26';
const KEY = 'sealed.fra.v1';
const PAIRS = ['WU','UB','BR','RG','GW','WB','UR','BG','RW','GU'];
const CNAME = {W:'White',U:'Blue',B:'Black',R:'Red',G:'Green'};
const THEME = {
  WU:['Fatehold','Surveil to grow your flyers, then attack.'],
  UB:['Theorix','Fill your graveyard to seven cards and turn on threshold.'],
  BR:['Stingerquill','Burn your opponent directly; creatures reward it.'],
  RG:['Konstrari','Heartwood tokens ramp you into big creatures.'],
  GW:['Vigorbloom','Gain life and turn it into counters and cards.'],
  WB:['','Removal, sacrifices and creatures that come back.'],
  UR:['','Cast noncreature spells; prowess and thopters pay off.'],
  BG:['','Good creatures, removal and graveyard value.'],
  RW:['','Go wide with tokens and counters and attack early.'],
  GU:['','Build up Jace tokens and planeswalkers for cards.'],
};

let CARDS = [], BY = {}, NAMES = [];
let S = load();
let undoFn = null, toastT = null, showAllPairs = false, sheetId = null;

function load() {
  try {
    const v = JSON.parse(localStorage.getItem(KEY));
    // Decks saved before synergy counted (version 1) are rebuilt with it.
    if (v && v.pool) { if (v.ver !== 2) { v.decks = {}; v.ver = 2; } return Object.assign(fresh(), v); }
  } catch (e) {}
  return fresh();
}
function fresh() { return {ver:2, pool:{}, tab:'pool', pair:null, decks:{}, lands:{}, opp:{cols:'', mana:3}}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- mana ---------- */
const pipList = cost => ((cost || '').match(/\{[^}]+\}/g) || []).map(s => s.slice(1, -1));
function mvOf(cost) {
  let v = 0;
  for (const p of pipList(cost)) {
    if (/^\d+$/.test(p)) v += +p;
    else if (p === 'X') continue;
    else if (p.startsWith('2/')) v += 2;
    else v += 1;
  }
  return v;
}
// Each coloured pip as the string of colours that can pay it: 'W', or 'WU' for a hybrid.
function needs(cost) {
  const out = [];
  for (const p of pipList(cost)) {
    if (/^[WUBRG]$/.test(p)) out.push(p);
    else if (/^[WUBRG]\/[WUBRG]$/.test(p)) out.push(p[0] + p[2]);

  if (scan) { scan.on = false; if (scan.stream) scan.stream.getTracks().forEach(t => t.stop()); }
  scan = null;
  $('#cam').srcObject = null;
  $('#scanner').hidden = true;
  document.body.style.overflow = '';
  render();
}

// A photo of several cards laid upright: read every line, keep the ones that are
// clearly a card name, and let him tick what goes in.
let photo = null;
function openPanel(title, body, foot) {
  closeCard();
  const veil = document.createElement('div'); veil.className = 'veil'; veil.dataset.act = 'close';
  const sh = document.createElement('div'); sh.className = 'sheet'; sh.setAttribute('role', 'dialog'); sh.setAttribute('aria-modal', 'true');
  sh.innerHTML = `<div class="sheet-head"><h3>${esc(title)}</h3><button class="x" data-act="close" aria-label="Close">✕</button></div>
    <div class="sheet-body" id="panelbody">${body}</div><div class="sheet-foot" id="panelfoot"${foot ? '' : ' hidden'}>${foot || ''}</div>`;
  document.body.append(veil, sh);
  document.body.style.overflow = 'hidden';
}
async function readPhoto(file) {
  photo = {found: [], busy: true};
  const me = photo;
  openPanel('Photo of a pack', `<p class="note" id="phmsg">Reading the photo…</p><div class="bar2"><i id="phbar"></i></div>`);
  const url = URL.createObjectURL(file);
  const img = new Image();
  try { await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; }); }
  catch (e) { $('#phmsg').textContent = 'That file is not a picture the phone can read.'; return; }
  const k = Math.min(1, 2600 / Math.max(img.naturalWidth, img.naturalHeight));
  const cv = document.createElement('canvas');
  cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
  cv.getContext('2d', {willReadFrequently: true}).drawImage(img, 0, 0, cv.width, cv.height);
  URL.revokeObjectURL(url);
  prepCanvas(cv);
  ocrLog = m => {
    if (photo !== me || !$('#phbar')) return;
    const loading = /load/.test(m.status || '');
    $('#phmsg').textContent = loading ? 'Loading the name reader, first time only…' : 'Reading the card names…';
    if (m.progress != null) $('#phbar').style.width = Math.round(m.progress * 100) + '%';
  };
  try { await loadOCR(); } catch (e) { $('#phmsg').textContent = 'Could not load the name reader. It needs a connection the first time.'; return; }
  await ocr.setParameters({tessedit_pageseg_mode: '11', tessedit_char_whitelist: LETTERS});
  // Two reads: as shot, then colour-flipped, because some frames (the legendary
  // ones in this set) print the name in white on a dark bar. A card found by both
  // reads in the same spot counts once.
  const flipped = document.createElement('canvas');
  flipped.width = cv.width; flipped.height = cv.height;
  const fx = flipped.getContext('2d', {willReadFrequently: true});
  fx.filter = 'invert(1)'; fx.drawImage(cv, 0, 0);
  const passes = [cv, flipped];
  for (let p = 0; p < passes.length; p++) {
    let data;
    try { data = (await ocr.recognize(passes[p])).data; } catch (e) { $('#phmsg') && ($('#phmsg').textContent = 'The reader failed on that photo. Try again with more light.'); return; }
    if (photo !== me) return;
    const lines = data.lines && data.lines.length ? data.lines : data.text.split('\n').map(text => ({text}));
    for (const line of lines) {
      const m = bestMatch(line.text);
      if (!m || m.sim < 0.8 || m.margin < 0.06) continue;
      const b = line.bbox, cx = b ? (b.x0 + b.x1) / 2 : null, cy = b ? (b.y0 + b.y1) / 2 : null;
      const dup = b && me.found.some(f => f.c.id === m.c.id && f.cx != null && Math.abs(f.cx - cx) < 80 && Math.abs(f.cy - cy) < 60);
      if (!dup) me.found.push({c: m.c, read: line.text.trim(), on: true, cx, cy});
    }
    if (p === 0 && $('#phmsg')) $('#phmsg').textContent = 'Second read for white-on-dark names…';
  }
  me.busy = false;
  showPhoto();
}
function showPhoto() {
  if (!$('#panelbody')) return;   // closed while it was reading
  const f = photo.found, n = f.filter(x => x.on).length;
  $('#panelbody').innerHTML = f.length
    ? `<p class="note">Found ${f.length} card${f.length === 1 ? '' : 's'}. Untick any that are wrong; type in any it missed.</p>` +
      f.map((x, i) => `<button class="found${x.on ? ' on' : ''}" data-act="phtoggle" data-i="${i}"><span class="box"></span>
        <span><span class="nm">${esc(x.c.n)}</span> ${costHTML(x.c.m)}<br><span class="read">read as “${esc(x.read.slice(0, 40))}”</span></span>${scHTML(x.c)}</button>`).join('')
    : `<p class="note">No card names found. Lay the cards upright in rows with their names showing, fill the frame, and use good light.</p>`;
  const foot = $('#panelfoot');
  foot.hidden = !f.length;
  foot.innerHTML = `<button class="btn fill" data-act="phadd"${n ? '' : ' disabled'}>Add ${n} to pool</button>`;
}

function closeCard() {
  sheetId = null;
  $('.veil')?.remove(); $('.sheet')?.remove();
  document.body.style.overflow = '';
}

/* ---------- toast ---------- */
function toast(msg, undo) {
  undoFn = undo || null;
  $('#toastmsg').textContent = msg;
  $('#toast').querySelector('button').hidden = !undo;
  $('#toast').hidden = false;
  clearTimeout(toastT);
  toastT = setTimeout(() => { $('#toast').hidden = true; undoFn = null; }, 4000);
}

/* ---------- render ---------- */
function render() {
  const n = poolSize();
  $('#count').textContent = n ? `${n} card${n === 1 ? '' : 's'}` : '';
  document.querySelectorAll('.stepbtn').forEach(b => b.classList.toggle('on', b.dataset.v === S.tab));
  for (const t of ['pool', 'build', 'tricks', 'rules']) $('#' + t).hidden = S.tab !== t;
  if (S.tab === 'pool') { renderResults(); renderPool(); }
  if (S.tab === 'build') renderBuild();
  if (S.tab === 'tricks') renderTricks();
  if (S.tab === 'rules') renderRules();
  if (sheetId) openCard(sheetId);
}

function doAdd(id) {
  addCard(id, 1);
  const c = BY[id];
  toast(`Added ${c.n} · ${have(id)} in pool`, () => { addCard(id, -1); render(); });
  $('#q').value = '';
  render();
  $('#q').focus();
}

// Tapping a search result must not take focus from the box, or the phone's
// keyboard drops after every card.
document.addEventListener('mousedown', e => { if (e.target.closest('.res')) e.preventDefault(); });

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act, id = b.dataset.id, v = b.dataset.v;
  if (act === 'tab') { S.tab = v; save(); closeCard(); render(); window.scrollTo(0, 0); return; }
  if (act === 'add') return doAdd(id);
  if (act === 'card') return openCard(id);
  if (act === 'close') return closeCard();
  if (act === 'zoom') { const z = $('#zoomed'); z.innerHTML = z.innerHTML ? '' : `<img class="zoom" src="${esc(BY[sheetId].img)}" alt="">`; return; }
  if (act === 'inc' || act === 'dec') { addCard(id, act === 'inc' ? 1 : -1); return render(); }
  if (act === 'deckin' || act === 'deckout') {
    const d = deckFor(S.pair);
    d[id] = (d[id] || 0) + (act === 'deckin' ? 1 : -1);
    if (d[id] <= 0) delete d[id];
    save(); return render();
  }
  if (act === 'pair') { S.pair = v; save(); return render(); }
  if (act === 'allpairs') { showAllPairs = !showAllPairs; return render(); }
  if (act === 'rebuild') {
    const old = S.decks[S.pair];
    delete S.decks[S.pair]; delete S.lands[S.pair]; save(); render();
    return toast('Deck rebuilt from the scores', () => { S.decks[S.pair] = old; save(); render(); });
  }
  if (act === 'lands') { S.lands[S.pair] = Math.min(19, Math.max(14, (S.lands[S.pair] || defaultLands(deckFor(S.pair))) + +v)); save(); return render(); }
  if (act === 'oppcol') { S.opp.cols = S.opp.cols.includes(v) ? S.opp.cols.replace(v, '') : S.opp.cols + v; save(); return render(); }
  if (act === 'oppmana') { S.opp.mana = +v; save(); return render(); }
  if (act === 'undo') { const f = undoFn; $('#toast').hidden = true; undoFn = null; if (f) f(); return; }
  if (act === 'scan') { startScan(); return; }
  if (act === 'scanstop') return stopScan();
  if (act === 'scanundo') {
    if (scan && scan.last) {
      addCard(scan.last, -1);
      scanMsg(`Took out <b>${esc(BY[scan.last].n)}</b>. ${have(scan.last)} left in pool.`);
      scan.last = null; scan.block = null; scan.n = Math.max(0, scan.n - 1);
      $('#scanundo').hidden = true;
      render();
    }
    return;
  }
  if (act === 'photo') { $('#photoin').click(); return; }
  if (act === 'phtoggle') { const x = photo && photo.found[+b.dataset.i]; if (x) { x.on = !x.on; showPhoto(); } return; }
  if (act === 'phadd') {
    const list = photo ? photo.found.filter(x => x.on) : [];
    for (const x of list) addCard(x.c.id, 1);
    closeCard(); render();
    return toast(`Added ${list.length} card${list.length === 1 ? '' : 's'} from the photo`, () => { for (const x of list) addCard(x.c.id, -1); render(); });
  }
  if (act === 'clear') {
    const old = S.pool;
    S.pool = {}; S.decks = {}; S.pair = null; save(); render();
    return toast('Pool cleared', () => { S.pool = old; save(); render(); });
  }
});

$('#q').addEventListener('input', renderResults);
$('#photoin').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) readPhoto(f); });
$('#q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); const top = search($('#q').value)[0]; if (top) doAdd(top.id); }
  if (e.key === 'Escape') { $('#q').value = ''; renderResults(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetId) closeCard(); });

fetch('fra.json?v=' + DATA_V).then(r => r.json()).then(list => {
  CARDS = list;
  for (const c of CARDS) {
    c.v = mvOf(c.m);
    tagSynergy(c);
    BY[c.id] = c;
    NAMES.push({c, front: norm(c.n), words: norm(c.full).split(' '), flat: norm(c.full).replace(/ /g, '')});
  }
  render();
}).catch(() => { $('main').innerHTML = '<div class="empty">Could not load the card list. Check the connection and reload.</div>'; });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(() => {});
</script>
