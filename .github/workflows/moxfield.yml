name: Refresh Moxfield decks
on:
  schedule: [{ cron: '30 20 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: bot-push, cancel-in-progress: false }
jobs:
  decks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # The script exits non-zero on any Moxfield problem and leaves that user's last good file in place.
      # One user failing does not stop the others; the job still goes red at the end.
      - run: |
          fail=0
          python build/moxfield_decks.py amoncupa decks/moxfield.json || fail=1
          for u in $(sed 's/#.*//' decks/users.txt); do
            sleep 2
            python build/moxfield_decks.py "$u" "decks/moxfield-$(echo "$u" | tr 'A-Z' 'a-z').json" || fail=1
          done
          git config user.name "combo-bot"
          git config user.email "combo-bot@users.noreply.github.com"
          git add decks/moxfield*.json
          git diff --cached --quiet || (git commit -m "Refresh Moxfield decks" && git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME")
          exit $fail
