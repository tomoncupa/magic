// Everything goes back, the library is shuffled, and a fresh hand comes off
// the top. Tokens cease to exist rather than returning to a deck they were
// never in.
function dealOpeningHand(n){
  n = n || 7;
  state.z.hand.slice()
    .concat(state.z.bf.slice(), state.z.gy.slice(), state.z.ex.slice())
    .forEach(function(iid){
      if(state.cards[iid] && state.cards[iid].tok) delete state.cards[iid];
      else move(iid,'lib');
    });
  state.z.bf = []; state.z.gy = []; state.z.ex = [];
  state.z.lib = shuffle(state.z.lib);
  for(var i=0;i<n && state.z.lib.length;i++) move(state.z.lib[0],'hand');
  state.turn = 1; state.phase = 3;
  seat().landDrop = 0;
  clearPool();
  state.mull = state.mull || 0;
}

// Pick exactly `need` cards to put on the bottom. Used by every mulligan that
// costs cards, so London and the beginner one behave the same way.
function openBottomPicker(need, title, note, done){
  var chosen = {};
  var sh = sheet(title, note);
  var count = el('p','note');
  count.style.marginBottom = 'var(--s3)';
  sh.appendChild(count);

  var list = el('div','cardlist');
  sh.appendChild(list);

  var go = el('button','btn primary');
  go.style.cssText = 'width:100%;justify-content:center;margin-top:var(--s4)';
  sh.appendChild(go);

  function paint(){
    var picked = Object.keys(chosen).filter(function(k){ return chosen[k]; });
    count.textContent = need
      ? 'Choose ' + need + ' to put on the bottom. ' + picked.length + ' of ' + need + ' chosen.'
      : 'Nothing goes to the bottom. Keep this hand.';
    go.textContent = need ? ('Bottom ' + picked.length + ' and keep ' + (state.z.hand.length - picked.length))
                          : ('Keep all ' + state.z.hand.length);
    go.disabled = picked.length !== need;
    list.innerHTML = '';
    state.z.hand.forEach(function(iid){
      var w = cardNode(iid, { zone:'hand',
        onTap: function(){ chosen[iid] = !chosen[iid]; paint(); },
        onHold: function(){ var d = defOf(state.cards[iid]); if(d) openCardInfo(d); } });
      if(chosen[iid]) w.classList.add('sel');
      list.appendChild(w);
    });
  }
  go.onclick = function(){
    Object.keys(chosen).forEach(function(iid){ if(chosen[iid]) move(iid,'lib'); });
    done();
  };
  paint();
}

function doMulligan(){
  state.mull = state.mull || 0;
  var free = lsGet('ktm.freemull','1') === '1';
  var taken = state.mull;
  var sh = sheet('Mulligan',
    taken ? ('You have taken ' + taken + ' mulligan' + (taken===1?'':'s') + ' this game.')
          : 'Holding ' + state.z.hand.length + ' cards.');

  var rows = [
    ['London mulligan', 'Shuffle back, draw seven, then put one card on the bottom for each mulligan you have taken.',
      function(){
        state.mull = (state.mull||0) + 1;
        var toBottom = free ? Math.max(0, state.mull - 1) : state.mull;
        dealOpeningHand(7);
        closeLayer();
        if(!toBottom){
          commit('Mulliganed to seven' + (free ? ', the free one' : ''));
          return;
        }
        openBottomPicker(toBottom, 'Put ' + toBottom + ' on the bottom',
          'Mulligan number ' + state.mull + '.',
          function(){ commit('Mulliganed, ' + toBottom + ' to the bottom'); closeLayer(); });
      }],
    ['Draw ten, keep seven', 'The beginner mulligan. Draw ten cards, choose the seven you want and bottom the other three.',
      function(){
        dealOpeningHand(10);
        closeLayer();
        openBottomPicker(3, 'Choose three to bottom',
          'Keep the seven you want.',
          function(){ state.mull = 0; commit('Drew ten and kept seven'); closeLayer(); });
      }],
    ['Fresh seven', 'Start the hand again with no penalty. Use it when you are goldfishing.',
      function(){
        dealOpeningHand(7);
        state.mull = 0;
        commit('Dealt a fresh seven');
        closeLayer();
      }]
  ];

  rows.forEach(function(r){
    var b = el('button','mullopt');
    b.appendChild(el('div','mo-t', r[0]));
    b.appendChild(el('div','mo-d', r[1]));
    b.onclick = r[2];
    sh.appendChild(b);
  });

  sh.appendChild(el('div','divider'));
  var fm = el('button','chip','Commander free first mulligan');
  fm.setAttribute('aria-pressed', free ? 'true':'false');
  fm.onclick = function(){
    var v = !(lsGet('ktm.freemull','1') === '1');
    lsSet('ktm.freemull', v ? '1':'0');
    fm.setAttribute('aria-pressed', v ? 'true':'false');
  };
  sh.appendChild(fm);
  var fn = el('p','note','With this on, your first mulligan keeps all seven.');
  fn.style.marginTop = 'var(--s2)';
  sh.appendChild(fn);
}

          keep.forEach(function(o){ o.life = 40; o.poison = 0; o.cmdDmg = {}; state.seats.push(o); });
          dealOpeningHand();
          undoStack = [];
          commit('New game, '+deckName);
          closeLayer();
          doMulligan();
        }); }],
    [DECKS.length > 1 ? 'Switch deck' : 'Reload deck', function(){
        closeLayer();
        if(DECKS.length > 1) return openDeckPicker();
        loadBuiltin(builtinId);
      }]
  ]);

  s.appendChild(el('div','divider'));
  var tw = el('div');
  tw.appendChild(el('label',null,'Table code'));
  var trow = el('div','row');
  var code = el('div','tablecode', tableId === 'main' ? 'MAIN' : tableId);
  trow.appendChild(code);
  trow.appendChild(el('div','spacer'));
  var nb = el('button','btn sm','New table');
  nb.onclick = function(){ switchTable(newTableCode(), true); };
  trow.appendChild(nb);
  tw.appendChild(trow);
  var jin = el('input'); jin.type='text'; jin.placeholder='Join a table code from your other device';
  jin.setAttribute('aria-label','Table code to join');
  jin.style.marginTop='6px';
  var jb = el('button','btn sm ghost','Join that table');
  jb.style.cssText='width:100%;justify-content:center;margin-top:6px';
  jb.onclick = function(){
    var v = (jin.value||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(v.length < 4) return;
    switchTable(v, false);
  };
  tw.appendChild(jin); tw.appendChild(jb);
  s.appendChild(tw);
  var tnote = el('p','note');
  tnote.style.marginTop='8px';
  tnote.innerHTML = 'Your iPad and iPhone share a table code. A second person playing on their '
    + 'own devices needs <b>their own code</b>, or you would share one library and one hand.';
  s.appendChild(tnote);

  s.appendChild(el('div','divider'));
  var sy = el('p','note');
  sy.innerHTML = syncMode === 'live'
    ? '<b>Synced.</b> Open this same link on your other device and pick the matching role above, the board and your hand stay in step.'
    : '<b>Local only.</b> This view could not reach shared storage, so the game lives in this browser alone.';
  s.appendChild(sy);
}

var importedCommander = null;

// ---- Scryfall ------------------------------------------------------------
// The card database, live. Names in, real printed data and art out.
var SCRY = 'https://api.scryfall.com';
function scryCard(c){
  var face = (!c.mana_cost && c.card_faces) ? c.card_faces[0] : c;
  var img = (c.image_uris && c.image_uris.normal)
    || (c.card_faces && c.card_faces[0].image_uris && c.card_faces[0].image_uris.normal)
    || null;
  var o = (c.oracle_text || face.oracle_text || '').slice(0,400);
  var d = {
    id: c.id,
    n: c.name,
    t: c.type_line || face.type_line || '',
    m: (c.mana_cost != null ? c.mana_cost : (face.mana_cost || '')),
    cmc: c.cmc || 0,
    ci: c.color_identity || [],
    pm: c.produced_mana || [],
    o: o,
    u: img
  };
  var pw = c.power != null ? c.power : face.power;
  var tg = c.toughness != null ? c.toughness : face.toughness;
  if(pw != null) d.p = String(pw);
  if(tg != null) d.tg = String(tg);
  if(o.indexOf('enters the battlefield tapped') >= 0 || o.indexOf('enters tapped') >= 0) d.ebt = 1;
  return d;
}
// Up to 75 names per request, which is Scryfall's limit.
async function scryLookup(names, onProgress){
  var found = {}, missing = [];
  for(var i=0;i<names.length;i+=70){
    var chunk = names.slice(i,i+70);
    if(onProgress) onProgress(Math.min(i+70,names.length), names.length);
    var res = await fetch(SCRY + '/cards/collection', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ identifiers: chunk.map(function(n){ return { name:n }; }) })
    });
    if(!res.ok) throw new Error('scryfall ' + res.status);
    var j = await res.json();
    (j.not_found || []).forEach(function(nf){ if(nf && nf.name) missing.push(nf.name); });
    (j.data || []).forEach(function(c){ found[c.name.toLowerCase()] = scryCard(c); });
    if(i + 70 < names.length) await new Promise(function(r){ setTimeout(r,120); });
  }
  return { found: found, missing: missing };
}
async function scryOne(name){
  var res = await fetch(SCRY + '/cards/named?fuzzy=' + encodeURIComponent(name));
  if(!res.ok) return null;
  return scryCard(await res.json());
}
var deckChanges = [];   // edits made here, not yet in Moxfield
var physChanges = [];   // taken from Moxfield, not yet done to the real cards

// Signed diff: positive means the new list wants more copies than the old one.
function diffLists(oldList, newList){
  var map = {}, out = [], k;
  (oldList||[]).forEach(function(d){
    k = String(d.n).toLowerCase();
    map[k] = { n:d.n, q: -qOf(d) };
  });
  (newList||[]).forEach(function(d){
    k = String(d.n).toLowerCase();
    if(map[k]) map[k].q += qOf(d);
    else map[k] = { n:d.n, q:qOf(d) };
  });
  for(k in map){ if(map[k].q) out.push(map[k]); }
  out.sort(function(a,b){ return (a.q>0) - (b.q>0) || String(a.n).localeCompare(String(b.n)); });
  return out;
}
function physList(){
  return physChanges.map(function(c){
    return (c.q > 0 ? '+' : '') + c.q + ' ' + c.n;
  }).join('\n');
}
// Renders a signed diff with wording chosen by the caller.
function diffBox(list, addLabel, remLabel){
  var wrap = el('div');
  var rem = list.filter(function(c){ return c.q < 0; });
  var add = list.filter(function(c){ return c.q > 0; });
  if(rem.length){
    wrap.appendChild(el('label',null,remLabel));
    var b1 = el('div','difflist');
    rem.forEach(function(c){ b1.appendChild(el('div','rem', c.q + '  ' + c.n)); });
    wrap.appendChild(b1);
  }
  if(add.length){
    var l2 = el('label',null,addLabel);
    if(rem.length) l2.style.marginTop = '10px';
    wrap.appendChild(l2);
    var b2 = el('div','difflist');
    add.forEach(function(c){ b2.appendChild(el('div','add', '+' + c.q + '  ' + c.n)); });
    wrap.appendChild(b2);
  }
  return wrap;
}

// A sideboard card sits at zero copies, so `q || 1` would silently deal it in.
function qOf(d){ return (d && d.q != null) ? d.q : 1; }
function totalCards(){
  var n = 0;
  for(var i=0;i<defs.length;i++) n += qOf(defs[i]);
  return n;
}
function sideCount(){
  var n = 0;
  for(var i=0;i<defs.length;i++) if(qOf(defs[i]) === 0) n++;
  return n;
}
function findDef(name){
  var k = String(name||'').toLowerCase();
  for(var i=0;i<defs.length;i++){ if(String(defs[i].n).toLowerCase() === k) return defs[i]; }
  return null;
}
// One entry per card, signed. A swap back to where you started cancels out.
function noteChange(name, delta){
  for(var i=0;i<deckChanges.length;i++){
    if(deckChanges[i].n === name){
      deckChanges[i].q += delta;
      if(!deckChanges[i].q) deckChanges.splice(i,1);
      return;
    }
  }
  if(delta) deckChanges.push({ n:name, q:delta });
}
function persistDeck(){
  defsAreBuiltin = false;
  lastDeckStamp = 'k' + Date.now();
  var blob = { cards:defs, name:deckName, commander:importedCommander || null,
               changes:deckChanges, phys:physChanges, stamp:lastDeckStamp };
  try{ lsSet('ktm.defs', JSON.stringify(blob)); }catch(e){}
  if(deckRef) deckRef.set(blob).catch(function(){});
}
function moxfieldList(){
  var out = [], cmd = importedCommander;
  if(cmd) out.push('Commander', '1 ' + cmd, '');
  out.push('Deck');
  var side = [];
  for(var i=0;i<defs.length;i++){
    var d = defs[i], q = qOf(d);
    if(cmd && d.n === cmd) q -= 1;
    if(q > 0) out.push(q + ' ' + d.n);
    else if(!cmd || d.n !== cmd) side.push('1 ' + d.n);
  }
  if(side.length){ out.push('', 'Sideboard'); out = out.concat(side); }
  return out.join('\n');
}
function changeList(){
  var out = [];
  deckChanges.forEach(function(c){
    out.push((c.q > 0 ? '+' : '') + c.q + ' ' + c.n);
  });
  return out.join('\n');
}
function copyText(txt, btn, okLabel){
  var reset = function(){ setTimeout(function(){ btn.textContent = okLabel || 'Copy'; }, 1600); };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(
        function(){ btn.textContent = 'Copied'; reset(); },
        function(){ btn.textContent = 'Select it above instead'; reset(); });
      return;
    }
  }catch(e){}
  btn.textContent = 'Select it above instead'; reset();
}

function openImport(){
  var s = sheet('Import a deck', 'From Moxfield: open your deck \u2192 More \u2192 Export \u2192 Copy, then paste it here.');
  var note = el('p','note');
  note.innerHTML = 'Paste an export from Moxfield, Archidekt, Arena, MTGO, TappedOut, '
    + 'Goldfish, or just a list of card names. Set codes, categories and commander markers '
    + 'are all understood. <b>Every card comes back with its real art and rules text from '
    + 'Scryfall.</b> Re-importing an updated list also tells you which cards to swap in the box.';
  s.appendChild(note);
  s.appendChild(el('div','divider'));

  var ta = el('textarea');
  ta.id = 'importText';
  ta.placeholder = "1 Sol Ring (LTC) 254\n1 Arcane Signet\n10 Forest\n\u2026";
  s.appendChild(ta);

  var status = el('p','note'); status.style.marginTop='8px'; s.appendChild(status);
  var errBox = el('p','err'); errBox.className='err'; s.appendChild(errBox);

  var row = el('div');
  row.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px';
  var b1 = el('button','btn primary','Import with art & card data');
  var b2 = el('button','btn','Import names only');
  row.appendChild(b1); row.appendChild(b2);
  s.appendChild(row);

  // Every deck site exports its own way. This reads all of them: Moxfield,
  // Archidekt, Arena, MTGO, TappedOut, Goldfish, or a plain list of names.
  function parsed(){
    var lines = ta.value.split(/\r?\n/), out = [], seenCmd = null;
    var inCmd = false, inSide = false;
    lines.forEach(function(ln){
      var t = ln.trim();
      if(!t) return;
      if(/^(\/\/|#)/.test(t)) return;                       // comments
      // A section header on its own line.
      if(/^(commander|companion|deck|main ?deck|sideboard|maybeboard|considering|tokens?)\b[:\s]*$/i.test(t)){
        inCmd  = /^(commander|companion)/i.test(t);
        inSide = /^(sideboard|maybeboard|considering)/i.test(t);
        return;
      }
      var line = t, forceSide = false, forceCmd = false;
      // MTGO marks sideboard cards inline.
      if(/^SB:\s*/i.test(line)){ forceSide = true; line = line.replace(/^SB:\s*/i,''); }
      // TappedOut and Archidekt mark the commander inline.
      if(/[*]CMDR[*]/i.test(line)){ forceCmd = true; line = line.replace(/[*]CMDR[*]/ig,''); }
      if(/[*]Commander[*]/i.test(line)){ forceCmd = true; line = line.replace(/[*]Commander[*]/ig,''); }

      var m = line.match(/^(\d+)\s*[xX]?\s+(.+)$/) || line.match(/^[xX]?(\d+)\s+(.+)$/);
      var qty, name;
      if(m){ qty = parseInt(m[1],10); name = m[2]; }
      else  { qty = 1; name = line; }

      name = name
        .replace(/[[][^\]]*[\]]/g, '')                       // Archidekt [Category]
        .replace(/[(][A-Za-z0-9]{2,6}[)]\s*[\w\-\u2013]*/g, '')  // (SET) 123
        .replace(/[<][^>]*[>]/g, '')                          // <foil> markers
        .replace(/[*][^*]*[*]/g, '')                          // leftover *tags*
        .replace(/\s*[|].*$/, '')                             // trailing pipes
        .replace(/\s{2,}/g, ' ')
        .trim();
      // A double-faced card is listed by its front face here.
      if(name.indexOf('//') > 0) name = name.split('//')[0].trim();
      if(!name) return;
      if(/^(deck|sideboard|commander|maybeboard)$/i.test(name)) return;

      qty = Math.max(1, Math.min(99, qty || 1));
      var side = inSide || forceSide;
      if((inCmd || forceCmd) && !seenCmd) seenCmd = name;
      out.push({ n:name, q: side ? 0 : qty, side: side ? 1 : 0 });
    });
    return { cards: out, commander: seenCmd };
  }

  function finish(list, commander, name){
    // What changed between the list we were holding and the one Moxfield just gave us.
    // Skip it against the built-in sample: that diff is 200 lines of noise.
    if(!defsAreBuiltin && defs && defs.length){
      var d = diffLists(defs, list);
      if(d.length) physChanges = d;
    }
    defs = list; defsAreBuiltin = false;
    deckName = name || 'Imported deck';
    importedCommander = commander;
    lastDeckStamp = 'k'+Date.now();
    // Keep a local copy too: without it a reload with no sync would leave the
    // card indices pointing into the built-in deck.
    deckChanges = [];   // Moxfield is the source of truth again
    try{ lsSet('ktm.defs', JSON.stringify({ cards:list, name:deckName,
         commander:commander||null, changes:[], phys:physChanges })); }catch(e){}
    if(deckRef){
      deckRef.set({ cards:list, name:deckName, commander:commander||null,
                    changes:[], phys:physChanges, stamp:lastDeckStamp })
        .catch(function(e){ errBox.textContent = 'Could not share the deck with your other device ('+(e&&e.code||'error')+'). It still works here.'; });
    }
    state = buildGame(defs, commander);
    commit('Imported '+deckName+' ('+list.reduce(function(a,c){return a+qOf(c);},0)+' cards)');
    closeLayer();
    if(physChanges.length) openSwapSheet();
  }

  b2.onclick = function(){
    var p = parsed();
    if(!p.cards.length){ errBox.textContent='Nothing to import, paste a decklist first.'; return; }
    finish(p.cards.map(function(c){
      return { n:c.n, q:c.q, side:c.side, t:'', m:'', ci:[], pm:[], o:'' };
    }), p.commander, 'Imported deck');
  };

  b1.onclick = async function(){
    var p = parsed();
    if(!p.cards.length){ errBox.textContent='Nothing to import, paste a decklist first.'; return; }
    errBox.textContent=''; b1.disabled=true; b2.disabled=true;
    status.textContent = 'Looking up cards on Scryfall\u2026';

    var names = [], seen = {};
    p.cards.forEach(function(c){
      var k = c.n.toLowerCase();
      if(!seen[k]){ seen[k] = 1; names.push(c.n); }
    });
    var res;
    try{
      res = await scryLookup(names, function(done, all){
        status.textContent = 'Looking up cards on Scryfall\u2026 ' + done + ' / ' + all;
      });
    }catch(e){
      status.textContent = '';
      b1.disabled = false; b2.disabled = false;
      errBox.textContent = navigator.onLine
        ? 'Scryfall did not answer (' + e.message + '). Use "Import names only" to continue.'
        : 'No internet, so card data cannot be fetched. Use "Import names only" to continue.';
      return;
    }
    if(res.missing.length){
      errBox.textContent = 'Scryfall did not know: ' + res.missing.slice(0,6).join(', ')
        + (res.missing.length > 6 ? ' and ' + (res.missing.length-6) + ' more' : '')
        + '. Those came in by name only.';
    }
    var list = p.cards.map(function(c){
      var d = res.found[c.n.toLowerCase()];
      if(!d) return { n:c.n, q:c.q, side:c.side, t:'', m:'', ci:[], pm:[], o:'' };
      var out = JSON.parse(JSON.stringify(d));
      out.q = c.q; out.side = c.side;
      return out;
    });
    finish(list, p.commander, 'Imported deck');
  };
}

/* ---------------- boot ---------------- */
function boot(){
  var restored = null;
  try{
    var raw = lsGet('ktm.state','');
    if(raw){ var j = JSON.parse(raw); if(j && j.z && j.cards) restored = normalise(j); }
  }catch(e){}

  if(restored){
    state = restored;
    if(state.deck && !state.deck.builtin){
      defsAreBuiltin = false;
      try{
        var ld = JSON.parse(lsGet('ktm.defs','null'));
        if(ld && ld.cards && ld.cards.length){
          defs = ld.cards; importedCommander = ld.commander;
          deckChanges = ld.changes || []; physChanges = ld.phys || [];
        }
      }catch(e){}
    }
    if(state.deck && state.deck.name) deckName = state.deck.name;
  } else {
    state = buildGame(defs, (builtinDeck() || {}).commander);
    for(var i=0;i<7 && state.z.lib.length;i++) move(state.z.lib[0],'hand');
    logg('Opening hand drawn, '+deckName);
  }
  if(defsAreBuiltin && builtinDeck()) importedCommander = builtinDeck().commander;

  // Games made before opponents existed carry a single seat.
  if(!state.seats || !state.seats.length) state.seats = [ newSeat() ];
  if(!state.seats[0].cmdDmg) state.seats[0].cmdDmg = {};
  if(state.seats.length === 1){
    state.seats.push(newOpponent(1), newOpponent(2), newOpponent(3));
  }
  state.seats.forEach(function(sx){ if(!sx.cmdDmg) sx.cmdDmg = {}; });

  // Keep nextId ahead of any restored token ids.
  nextId = Math.max(nextId, Object.keys(state.cards).length + 50);

  try{ lsSet('ktm.state', JSON.stringify(state)); }catch(e){}
  markClean();
  setDot('connecting');
  render();
  initSync();

  // Cache the app and every card picture seen, so a shop with no wifi still
  // deals a game. Sync still needs a connection.
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
}

if(!BUILTIN.length){
  document.getElementById('main').innerHTML =
    '<div style="padding:40px 20px;text-align:center;color:#9db0a5">Deck data failed to load.</div>';
} else {
  boot();
}

})();
</script>
