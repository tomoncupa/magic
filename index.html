<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kitchen Table">
<meta name="theme-color" content="#131b17">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Kitchen Table Magic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#131b17; --bg2:#1a2520; --bg3:#22302a; --bg4:#2a3a33;
  --line:#2f4139; --line2:#3d5349;
  --ink:#e8efe9; --ink2:#9db0a5; --ink3:#6f847a;
  --brass:#d4a94b; --brass-dim:#8a6f2e;
  --danger:#d9534a; --good:#5aab6b; --warn:#d99a3a;
  --mW:#f4ecd6; --mU:#4a8fd6; --mB:#6b5878; --mR:#d4543c; --mG:#4a9d5c; --mC:#a9b4b0;
  /* One spacing scale and one type scale. No step is within 25% of another,
     so there is never a choice between 13 and 14. */
  --s1:4px; --s2:6px; --s3:8px; --s4:12px; --s5:16px; --s6:22px; --s7:30px;
  --t1:11px; --t2:13px; --t3:15px; --t4:19px; --t5:25px; --t6:34px;
  --tap:44px;                       /* smallest square a thumb catches */
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-sheet:20px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --disp:'Alegreya',Georgia,'Times New Roman',serif;
  --ui:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --cw:104px; --r:10px;
  --shadow:0 2px 10px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
/* A press answers in the same frame, the way a real button does. */
button{touch-action:manipulation}
button:active{transform:scale(.97)}
@media (hover:none){ button:hover{background:inherit} }
body{
  background:var(--bg); color:var(--ink); font-family:var(--ui); font-size:14px;
  overflow:hidden; overscroll-behavior:none;
  background-image:radial-gradient(120% 90% at 50% 0%,#1b2721 0%,#131b17 60%,#0e1512 100%);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100%}
.topbar{
  display:flex;align-items:center;gap:10px;flex-wrap:nowrap;
  padding:8px 12px; padding-top:calc(8px + env(safe-area-inset-top,0px));
  background:linear-gradient(#1c2823,#16201b); border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset; flex:0 0 auto; min-height:0;
}
.brand{font-family:var(--disp);font-weight:800;font-size:17px;letter-spacing:.01em;
  color:var(--brass);white-space:nowrap;line-height:1}
.brand small{display:block;font-family:var(--ui);font-weight:500;font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-top:2px}
.spacer{flex:1 1 auto;min-width:0}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  white-space:nowrap;position:relative;
  padding:var(--s3) var(--s4);border-radius:var(--r-md);
  background:var(--bg3);border:1px solid var(--line2);
  font-size:var(--t2);font-weight:500;color:var(--ink);
  min-height:var(--tap);transition:background .12s,border-color .12s;
}
/* The catchable area is larger than the ink where the ink must stay small. */
.tap-sm{position:relative}
.tap-sm::after{content:"";position:absolute;left:50%;top:50%;
  width:var(--tap);height:var(--tap);transform:translate(-50%,-50%)}
.btn:hover{background:var(--bg4)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(#e0b658,#c4992f);border-color:#8a6f2e;color:#20180a;font-weight:600}
.btn.primary:hover{background:linear-gradient(#e8c268,#cea137)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.sm{padding:var(--s2) var(--s3);font-size:var(--t1);min-height:36px}
.btn[disabled]{opacity:.4;pointer-events:none}
.turnchip{
  display:flex;align-items:baseline;gap:7px;padding:5px 11px;border-radius:8px;
  background:var(--bg2);border:1px solid var(--line);
}
.turnchip b{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;color:var(--brass)}
.turnchip span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.phasebar{display:flex;gap:2px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:2px}
.phasebar button{padding:4px 8px;border-radius:6px;font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink3);font-weight:500}
.phasebar button[aria-pressed=true]{background:var(--bg4);color:var(--brass)}
.syncdot{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:0 0 auto}
.syncdot.live{background:var(--good);box-shadow:0 0 6px rgba(90,171,107,.7)}
.syncdot.local{background:var(--warn)}

/* ---------- board ---------- */
.board{flex:1 1 auto;display:grid;grid-template-columns:1fr 208px;min-height:0}
.field{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.band{
  display:flex;flex-direction:column;min-height:0;
  border-bottom:1px solid var(--line);
}
.band.main{flex:1 1 62%}
.band.lands{flex:1 1 38%;border-bottom:0;background:linear-gradient(180deg,transparent,rgba(74,157,92,.045))}
.bandhead{
  display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s4);flex:0 0 auto;
  font-size:var(--t1);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);
}
/* Whether the land for the turn is still to come, readable across the table. */
.dropmark{display:inline-flex;align-items:center;gap:var(--s2);
  padding:var(--s1) var(--s3);border-radius:var(--r-full,999px);
  font-family:var(--mono);font-size:var(--t1);letter-spacing:0;
  border:1px solid var(--line2);background:var(--bg2);color:var(--ink2)}
.dropmark b{font-weight:600}
.dropmark.open{border-color:var(--good);background:rgba(90,171,107,.16);color:#a8dcb4}
.dropmark.used{border-color:var(--line);background:var(--bg2);color:var(--ink3)}
.dropmark.over{border-color:var(--warn);background:rgba(217,154,58,.16);color:#e8c489}
.dropdot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:0 0 auto}
.bandhead .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.bandhead b{font-family:var(--mono);color:var(--ink2);font-size:11px;letter-spacing:0}
.tray{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
  padding:var(--s1) var(--s6) var(--s4);
  display:flex;flex-wrap:wrap;align-content:flex-start;
  gap:var(--s4) var(--s3);
}
.tray.empty::after{
  content:attr(data-empty);color:var(--ink3);font-size:12px;font-style:italic;
  padding:14px 4px;opacity:.65;
}

/* ---------- rail ---------- */
.rail{
  border-left:1px solid var(--line);background:linear-gradient(180deg,#17211c,#131b17);
  display:flex;flex-direction:column;min-height:0;overflow-y:auto;
}
.railsec{padding:10px;border-bottom:1px solid var(--line)}
.railsec h3{
  margin:0 0 8px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink3);font-weight:600;font-family:var(--ui);
}
.lifebox{display:flex;align-items:center;gap:8px}
.lifebox .num{
  font-family:var(--mono);font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;
  color:var(--ink);line-height:1;flex:1;text-align:center;
}
.lifebox .num.low{color:var(--danger)}
.stepper{display:flex;flex-direction:column;gap:4px}
.stepper button{width:30px;height:24px;border-radius:6px;background:var(--bg3);
  border:1px solid var(--line2);font-size:14px;line-height:1;color:var(--ink2)}
.stepper button:hover{background:var(--bg4);color:var(--ink)}
.subcount{display:flex;gap:6px;margin-top:8px}
.subcount .sc{flex:1;display:flex;align-items:center;justify-content:space-between;gap:4px;
  padding:4px 7px;border-radius:6px;background:var(--bg2);border:1px solid var(--line);font-size:10.5px;color:var(--ink3)}
.subcount .sc b{font-family:var(--mono);color:var(--ink2);font-size:12px}

/* mana */
.manarow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pip{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 5px;
  border-radius:8px;background:var(--bg2);border:1px solid var(--line);
}
.pip:hover{border-color:var(--line2)}
.pip .sym{
  width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--disp);font-weight:800;font-size:13px;color:#10160f;
  box-shadow:inset 0 -2px 4px rgba(0,0,0,.25),0 1px 2px rgba(0,0,0,.4);
}
.pip .ct{font-family:var(--mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink3)}
.pip.has .ct{color:var(--brass)}
.pip.has{border-color:var(--brass-dim);background:#26301f}
.sym.W{background:var(--mW)}.sym.U{background:var(--mU);color:#06121f}
.sym.B{background:var(--mB);color:#e8dff0}.sym.R{background:var(--mR);color:#2a0a05}
.sym.G{background:var(--mG);color:#06180b}.sym.C{background:var(--mC);color:#141a18}

/* zone stacks */
.sechead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px}
.sechead h3{margin:0}
/* One row per player at the table. Opponents are trackers, not boards. */
.seatrow{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:8px;
  background:var(--bg2);border:1px solid var(--line);margin-bottom:5px}
.seatrow.me{border-color:var(--brass-dim);background:#212c1d}
.seatrow .nm{flex:1;min-width:0;font-size:11.5px;color:var(--ink2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;text-align:left;padding:3px 0}
.seatrow.me .nm{color:var(--brass);font-weight:600}
.seatrow .lf{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--ink);
  font-variant-numeric:tabular-nums;min-width:26px;text-align:right}
.seatrow .lf.low{color:var(--warn)}
.seatrow .lf.out{color:var(--danger);text-decoration:line-through}
.seatrow .pm{display:flex;gap:3px}
.seatrow .pm button{width:22px;height:22px;border-radius:5px;background:var(--bg3);
  border:1px solid var(--line2);font-size:12px;line-height:1;color:var(--ink2)}
.seatrow .pm button:hover{background:var(--bg4);color:var(--ink)}
.seatrow .flag{font-family:var(--mono);font-size:9.5px;padding:1px 4px;border-radius:4px;
  background:rgba(217,83,74,.2);border:1px solid rgba(217,83,74,.5);color:#e8897f}
.cdgrid{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;margin-bottom:6px}
.cdgrid .lbl{font-size:12px;color:var(--ink2);min-width:0}
.cdgrid .val{font-family:var(--mono);font-size:15px;font-weight:600;min-width:30px;text-align:center}
.cdgrid .val.lethal{color:var(--danger)}
.cdgrid button{width:28px;height:28px;border-radius:6px;background:var(--bg3);
  border:1px solid var(--line2);font-size:13px;color:var(--ink2)}
.deckrow{display:flex;align-items:center;gap:8px;padding:6px 2px;
  border-bottom:1px solid rgba(47,65,57,.55)}
.deckrow .dn{flex:1;min-width:0;font-size:12.5px;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deckrow .dt{font-size:9.5px;color:var(--ink3);white-space:nowrap;max-width:88px;
  overflow:hidden;text-overflow:ellipsis}
.deckrow .dq{font-family:var(--mono);font-size:13px;font-weight:600;min-width:18px;
  text-align:center;font-variant-numeric:tabular-nums}
.deckrow button{width:26px;height:26px;border-radius:6px;background:var(--bg3);
  border:1px solid var(--line2);font-size:13px;line-height:1;color:var(--ink2);flex:0 0 auto}
.deckrow button:hover{background:var(--bg4);color:var(--ink)}
.difflist{background:var(--bg);border:1px solid var(--line2);border-radius:8px;
  padding:9px 11px;font-family:var(--mono);font-size:12px;line-height:1.7;
  max-height:150px;overflow-y:auto}
.difflist .add{color:var(--good)}
.difflist .rem{color:var(--danger)}
.scroller{max-height:290px;overflow-y:auto;margin-top:4px}
.rulings{max-height:300px;overflow-y:auto}
.ruling{padding:var(--s3) 0;border-bottom:1px solid rgba(47,65,57,.55);
  font-size:var(--t2);line-height:1.5;color:var(--ink2)}
.ruling b{display:block;font-family:var(--mono);font-size:var(--t1);
  color:var(--ink3);font-weight:500;margin-bottom:2px}
.printopt{display:block;width:100%;padding:0;background:none;border:0}
.printopt img{width:100%;aspect-ratio:63/88;object-fit:cover;
  border-radius:var(--r-sm);border:1px solid var(--line2);display:block}
.printopt span{display:block;font-family:var(--mono);font-size:var(--t1);
  color:var(--ink3);margin-top:3px;text-align:center}
.printopt.on img{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass)}
.printopt.on span{color:var(--brass)}
.logsheet{max-height:360px;overflow-y:auto}
.logrow{display:flex;gap:var(--s3);padding:var(--s2) 0;
  border-bottom:1px solid rgba(47,65,57,.55);font-size:var(--t2);color:var(--ink2)}
.logrow b{font-family:var(--mono);font-size:var(--t1);color:var(--ink3);
  flex:0 0 32px;font-weight:500}
.tablecode{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--brass);letter-spacing:.14em}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.zone{
  position:relative;border-radius:8px;background:var(--bg2);border:1px solid var(--line);
  padding:7px;text-align:left;overflow:hidden;
}
.zone:hover{border-color:var(--line2);background:var(--bg3)}
.zone .zl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);display:block}
.zone .zc{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.zone.wide{grid-column:1/-1;display:flex;align-items:center;gap:9px}
.zone.wide .ztext{flex:1;min-width:0}
.zone .thumb{width:30px;aspect-ratio:63/88;border-radius:3px;background:var(--bg4);
  object-fit:cover;flex:0 0 auto;border:1px solid var(--line2)}

/* log */
.log{padding:8px 10px 12px;font-size:11px;color:var(--ink3);line-height:1.5;overflow-y:auto;flex:1 1 auto;min-height:60px}
.log div{padding:1.5px 0;border-bottom:1px solid rgba(47,65,57,.4)}
.log b{color:var(--ink2);font-weight:500}

/* ---------- cards ---------- */
.cw{
  position:relative;width:var(--cw);height:calc(var(--cw) * 88 / 63);flex:0 0 auto;
}
.cw.tapped{margin-left:calc(var(--cw) * .11);margin-right:calc(var(--cw) * .11)}
.card{
  position:absolute;inset:0;border-radius:calc(var(--cw)*.048);overflow:hidden;
  background:var(--bg3);border:1px solid #0b100d;box-shadow:var(--shadow);
  transition:transform .16s ease, box-shadow .16s ease; transform-origin:center center;
  display:block;width:100%;height:100%;padding:0;text-align:left;
}
.cw.tapped .card{transform:rotate(90deg)}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.6),0 0 0 1px var(--brass-dim)}
.cw.sel .card{box-shadow:0 0 0 2px var(--brass),0 6px 20px rgba(0,0,0,.6)}
.card img{width:100%;height:100%;object-fit:cover;display:block;background:var(--bg3)}

/* text-only face (imported decks with no art) */
.face{
  width:100%;height:100%;display:flex;flex-direction:column;
  background:linear-gradient(165deg,var(--fc1,#2b3830),var(--fc2,#1c2620));
  padding:calc(var(--cw)*.055);gap:calc(var(--cw)*.03);
}
.face .fn{font-family:var(--disp);font-weight:700;font-size:calc(var(--cw)*.105);
  line-height:1.12;color:var(--ink);overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical}
.face .fm{display:flex;gap:2px;flex-wrap:wrap}
.face .fm i{width:calc(var(--cw)*.105);height:calc(var(--cw)*.105);border-radius:50%;
  font-style:normal;font-size:calc(var(--cw)*.075);display:grid;place-items:center;
  font-family:var(--disp);font-weight:800;color:#10160f}
.face .ft{font-size:calc(var(--cw)*.072);color:var(--ink2);line-height:1.2;
  border-top:1px solid rgba(255,255,255,.08);padding-top:calc(var(--cw)*.03);
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.face .fo{font-size:calc(var(--cw)*.065);color:var(--ink3);line-height:1.25;flex:1;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
.face .fpt{align-self:flex-end;font-family:var(--mono);font-size:calc(var(--cw)*.095);
  font-weight:600;color:var(--ink)}

/* card back */
.back{
  width:100%;height:100%;
  background:
    radial-gradient(60% 45% at 50% 50%, rgba(212,169,75,.16), transparent 70%),
    linear-gradient(150deg,#243029,#141d18);
  display:grid;place-items:center;
}
.back::after{
  content:"";width:44%;aspect-ratio:1;border:1.5px solid rgba(212,169,75,.5);
  transform:rotate(45deg);border-radius:12%;
  box-shadow:inset 0 0 0 3px rgba(212,169,75,.12);
}

/* badges on battlefield cards */
.badges{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;
  align-items:flex-end;padding:3px;gap:3px;pointer-events:none;z-index:2}
.bdg{
  font-family:var(--mono);font-size:10.5px;font-weight:600;line-height:1;
  padding:2.5px 4px;border-radius:5px;background:rgba(10,14,12,.86);
  border:1px solid rgba(255,255,255,.14);color:var(--ink);backdrop-filter:blur(2px);
}
.bdg.ctr{background:rgba(74,157,92,.92);border-color:rgba(255,255,255,.3);color:#06180b}
.bdg.ctr.neg{background:rgba(217,83,74,.92);color:#2a0605}
.bdg.ctr.loy{background:rgba(212,169,75,.95);color:#20180a;border-color:#8a6f2e;
  font-size:12px;padding:3px 6px}
.prolrow{display:block;width:100%;text-align:left;padding:var(--s3) var(--s4);
  border-radius:var(--r-md);background:var(--bg2);border:1px solid var(--line);
  margin-bottom:var(--s2);min-height:var(--tap)}
.prolrow.on{border-color:var(--brass-dim);background:#232d1f}
.pr-n{font-size:var(--t2);color:var(--ink)}
.prolrow.on .pr-n{color:var(--brass)}
.pr-c{font-family:var(--mono);font-size:var(--t1);color:var(--ink3);margin-top:2px}
.bdg.tok{background:rgba(212,169,75,.9);color:#20180a;font-size:9px;letter-spacing:.06em}

/* ---------- hand strip (board) ---------- */
.handstrip{
  flex:0 0 auto;border-top:1px solid var(--line);background:linear-gradient(#18221d,#121a16);
  padding:8px 12px; padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:10px;
}
.handstrip .hs-cards{display:flex;gap:6px;overflow-x:auto;flex:1;padding-bottom:2px}
.handstrip .hs-cards .cw{--cw:66px}

/* ---------- hand mode (phone) ---------- */
.handview{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.handmeta{display:flex;gap:8px;padding:8px 14px;align-items:center;flex:0 0 auto;
  border-bottom:1px solid var(--line);background:var(--bg2)}
.handmeta .life{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--ink)}
.handmeta .mini{display:flex;gap:4px;flex:1;justify-content:flex-end;flex-wrap:wrap}

<div id="app">
  <div class="topbar">
    <div class="brand">Kitchen Table<small>Magic</small></div>
    <span class="syncdot" id="dot" title="sync status"></span>
    <div class="spacer"></div>
    <div id="topActions" style="display:flex;gap:7px;align-items:center;overflow-x:auto"></div>
  </div>
  <div id="main" style="flex:1 1 auto;min-height:0;display:flex;flex-direction:column"></div>
</div>
<div id="layer"></div>

<script src="decks.js"></script>
<script src="config.js" onerror="window.MTG_FIREBASE=null"></script>
<script>
(function(){
"use strict";

/* ========================================================================
   Kitchen Table Magic, a two-device Magic playmat.
   iPad = the board. iPhone = your hand. State syncs through the artifact db.
   No rules enforcement: the app tracks zones and offers assists, never
   blocks a play.
   ======================================================================== */

var MANA = ['W','U','B','R','G','C'];
var MANA_NAME = {W:'White',U:'Blue',B:'Black',R:'Red',G:'Green',C:'Colorless'};
var PHASES = ['Untap','Upkeep','Draw','Main 1','Combat','Main 2','End'];
var ZONES = {lib:'Library', hand:'Hand', bf:'Battlefield', gy:'Graveyard', ex:'Exile', cmd:'Command'};

/* ---------------- device identity + local prefs ---------------- */
function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

var DEVICE = lsGet('ktm.device','');
if(!DEVICE){ DEVICE = 'd'+Math.random().toString(36).slice(2,10); lsSet('ktm.device',DEVICE); }

var mode = lsGet('ktm.mode', window.innerWidth < 820 ? 'hand' : 'board');
var revealHand = lsGet('ktm.reveal','0') === '1';
var focusIid = null;   // which hand card is magnified on the phone
var phoneTab = lsGet('ktm.ptab','hand');   // 'hand' | 'board'
// Life counters are hidden for now, not removed. Flip this back to true and
// the life box and the opponents panel return exactly as they were.
var showLife = lsGet('ktm.life','0') === '1';
// The phone is for the hand. The board tab and the life row are hidden, not
// removed: flip either one back on from the menu and it returns as it was.
var showPhoneBoard = lsGet('ktm.pboard','0') === '1';

// Two app users at one physical table must not share a game, so every game
// lives under its own table code.
var tableId = lsGet('ktm.table','main');
function newTableCode(){
  var A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', out = '';
  for(var i=0;i<8;i++) out += A.charAt(Math.floor(Math.random()*A.length));
  return out;
}
var autoDraw = lsGet('ktm.autodraw','1') === '1';
var autoUntap = lsGet('ktm.autountap','1') === '1';
var emptyPool = lsGet('ktm.emptypool','1') === '1';

/* ---------------- card definitions ---------------- */
// Built-in deck ships with real art as same-origin files (art/<slug>.jpg).
// Imported decks carry no art and render as typographic faces.
// Every deck that ships with the app. Switching between them keeps each one's
// own art and card data; nothing is re-imported.
var DECKS = window.MTG_DECKS || (window.MTG_DECK ? [window.MTG_DECK] : []);
var builtinId = lsGet('ktm.builtin', DECKS.length ? DECKS[0].id : '');
function builtinDeck(){
  for(var i=0;i<DECKS.length;i++){ if(DECKS[i].id === builtinId) return DECKS[i]; }
  return DECKS[0] || null;
}
var BUILTIN = (builtinDeck() || {}).cards || [];
// Art comes from Scryfall's own image host. Anything without a picture draws
// a typographic face instead.
function hasArt(d){ return !!(d && d.u); }
// Scryfall names its image files after the card id, so a deck built before we
// stored the id still has one to look up.
function cardId(d){
  if(!d) return null;
  if(d.id) return d.id;
  var m = /([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/.exec(d.u || '');
  return m ? m[1] : null;
}
function artSrc(d){ return d.u; }
function slugify(n){
  return String(n||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-+/g,'-')
    .replace(/^-|-$/g,'').slice(0,60);
}
var defs = BUILTIN;               // active definition table
var defsAreBuiltin = true;
var deckName = (builtinDeck() || {}).name || 'Deck';

/* ---------------- game state ---------------- */
var state = null;
var nextId = 1;

function newSeat(){
  return { id:'s0', name:'You', life:40, poison:0, cmdTax:0, cmdDmg:{},
           mana:{W:0,U:0,B:0,R:0,G:0,C:0}, landDrop:0,
           landMax: parseInt(lsGet('ktm.landmax','1'), 10) };
}
// Opponents hold real cards: they get a life total and a commander-damage
// tally, and nothing else.
function newOpponent(n){
  return { id:'o'+n, name:'Opponent '+n, life:40, poison:0, cmdDmg:{}, opp:1 };
}
function seats(){ return state.seats || []; }
function seatById(id){
  var a = seats();
  for(var i=0;i<a.length;i++){ if(a[i].id === id) return a[i]; }
  return null;
}
function isOut(sx){ return sx.life <= 0 || (sx.poison||0) >= 10 || cmdLethal(sx); }
function cmdLethal(sx){
  var d = sx.cmdDmg || {};
  for(var k in d){ if(d[k] >= 21) return true; }
  return false;
}

function isLand(d){ return !!d && /Land/.test(d.t||''); }
function isCommanderDef(d){
  var b = builtinDeck();
  return !!d && !!b && d.n === b.commander;
}

function buildGame(defList, commanderName){
  var cards = {}, lib = [], cmd = [], id = 1;
  for(var i=0;i<defList.length;i++){
    var d = defList[i], q = qOf(d);
    for(var k=0;k<q;k++){
      var iid = 'c'+(id++);
      cards[iid] = { i:iid, d:i, tp:0, ctr:{}, fd:0, tok:0 };
      if(commanderName && d.n === commanderName && cmd.length===0) cmd.push(iid);
      else lib.push(iid);
    }
  }
  nextId = id;
  return {
    v:1, rev:1, by:DEVICE, turn:1, phase:3, started:false,
    deck:{ name: deckName, builtin: defsAreBuiltin },
    seats:[ newSeat(), newOpponent(1), newOpponent(2), newOpponent(3) ],
    cards: cards,
    z: { lib:shuffle(lib), hand:[], bf:[], gy:[], ex:[], cmd:cmd },
    log: []
  };
}

function shuffle(a){
  a = a.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
  return a;
}

function defOf(c){
  if(!c) return null;
  if(c.tok && c.td) return c.td;                    // token carries its own def
  return defs[c.d] || null;
}
function seat(){ return state.seats[0]; }
function zoneOf(iid){
  for(var k in state.z){ if(state.z[k].indexOf(iid) >= 0) return k; }
  return null;
}
function move(iid, to, toTop){
  var from = zoneOf(iid);
  if(from){ var a = state.z[from]; a.splice(a.indexOf(iid),1); }
  var c = state.cards[iid];
  if(to === 'lib' || to === 'hand'){ if(c){ c.tp=0; c.ctr={}; c.fd=0; delete c.gave; } }
  if(to === 'gy' || to === 'ex'){
    if(c && c.tok){ delete state.cards[iid]; return; }   // tokens cease to exist
    if(c){ c.tp=0; c.ctr={}; c.fd=0; }
  }
  if(toTop) state.z[to].unshift(iid); else state.z[to].push(iid);
}
function logg(txt){
  state.log = state.log || [];
  state.log.unshift({ t:'T'+state.turn, s:txt });
  if(state.log.length > 60) state.log.length = 60;
}

/* ---------------- sync ---------------- */
var db=null, stateRef=null, deckRef=null, syncMode='local', saveTimer=null, saving=false, pending=false;

function setDot(m){
  syncMode = m;
  var d = document.getElementById('dot');
  d.className = 'syncdot' + (m==='live'?' live':(m==='local'?' local':''));
  d.title = m==='live' ? 'Synced, open this same link on your other device'
          : m==='local' ? 'Local only, this device is not syncing' : 'Connecting\u2026';
}

function touch(){ state.rev = (state.rev||0) + 1; state.by = DEVICE; }

function save(){
  render();
  try{ lsSet('ktm.state', JSON.stringify(state)); }catch(e){}
  if(!stateRef) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 60);
}
function flush(){
  if(!stateRef) return;
  if(saving){ pending = true; return; }
  saving = true;
  var snapshot = JSON.parse(JSON.stringify(state));
  stateRef.set(snapshot).then(function(){
    saving = false;
    if(pending){ pending = false; flush(); }
  }, function(err){
    saving = false;
    if(err && err.code === 'invalid_argument'){ setDot('local'); stateRef = null; }
    else if(err && err.code === 'revoked'){ setDot('local'); stateRef = null; }
    else { setTimeout(function(){ saving=false; flush(); }, 900 + Math.random()*600); }
  });
}

// Undo keeps whole snapshots rather than reversing each action, because every
// action here is small and a snapshot cannot drift out of step with the state.
var undoStack = [], lastSnap = null;
var UNDO_MAX = 30;
function snapNow(){ try{ return JSON.stringify(state); }catch(e){ return null; } }
function markClean(){ lastSnap = snapNow(); }
function canUndo(){ return undoStack.length > 0; }

function commit(msg){
  if(lastSnap){
    undoStack.push({ s:lastSnap, why: msg || 'that' });
    if(undoStack.length > UNDO_MAX) undoStack.shift();
  }
  touch(); if(msg) logg(msg); save();
  markClean();
}

function undo(){
  var step = undoStack.pop();
  if(!step) return;
  var back;
  try{ back = JSON.parse(step.s); }catch(e){ return; }
  // The step forward has to beat the copy the other device is holding, so it
  // takes the next revision number rather than the one it originally had.
  back.rev = (state.rev || 0) + 1;
  back.by = DEVICE;
  state = normalise(back);
  logg('Undid: ' + step.why);
  blip('act');
  save();
  markClean();
}

// ---- sync ----------------------------------------------------------------
// Firebase's Realtime Database over plain HTTP: PUT to write, EventSource to
// listen. No SDK. With no config.js the app runs on this device alone.
function firebaseDb(base){
  base = String(base).replace(/\/+$/,'');
  return {
    doc: function(path){
      var url = base + '/' + path + '.json';
      return {
        set: function(data){
          return fetch(url, {
            method:'PUT', headers:{ 'Content-Type':'application/json' },
            body: JSON.stringify(data)
          }).then(function(r){
            if(!r.ok) return Promise.reject({ code:'unavailable', message:'http '+r.status });
          });
        },
        delete: function(){ return fetch(url, { method:'DELETE' }).then(function(){}); },
        onSnapshot: function(next, onErr){
          var es;
          try { es = new EventSource(url); }
          catch(e){ if(onErr) onErr({ code:'unavailable', message:String(e) }); return function(){}; }
          function deliver(raw){
            var payload = null;
            try { payload = JSON.parse(raw); } catch(e){ return; }
            // A patch names the changed key; re-read rather than merge by hand.
            if(payload && payload.path !== undefined && payload.path !== '/'){
              fetch(url).then(function(r){ return r.json(); })
                .then(function(v){ next({ exists: v != null, data: function(){ return v; },
                                          metadata:{ fromCache:false, hasPendingWrites:false } }); })
                .catch(function(){});
              return;
            }
            var v = payload ? payload.data : null;
            next({ exists: v != null, data: function(){ return v; },
                   metadata:{ fromCache:false, hasPendingWrites:false } });
          }
          es.addEventListener('put', function(e){ deliver(e.data); });
          es.addEventListener('patch', function(e){ deliver(e.data); });
          es.onerror = function(){
            // EventSource retries on its own; only a hard close is terminal.
            if(es.readyState === 2 && onErr) onErr({ code:'unavailable', message:'stream closed' });
          };
          return function(){ try{ es.close(); }catch(e){} };
        }
      };
    }
  };
}

// Firebase drops empty arrays and empty objects rather than storing them, so a
// game with an empty graveyard comes back with no graveyard at all. It also
// hands back sparse arrays as objects keyed by index. Put both right on arrival.
function toArr(v){
  if(Array.isArray(v)) return v.filter(function(x){ return x != null; });
  if(v && typeof v === 'object'){
    return Object.keys(v)
      .sort(function(a,b){ return (+a) - (+b); })
      .map(function(k){ return v[k]; })
      .filter(function(x){ return x != null; });
  }
  return [];
}
function normalise(d){
  if(!d || typeof d !== 'object') return d;
  d.z = d.z || {};
  ['lib','hand','bf','gy','ex','cmd'].forEach(function(k){ d.z[k] = toArr(d.z[k]); });
  d.cards = d.cards || {};
  for(var id in d.cards){
    var c = d.cards[id];
    if(!c) continue;
    c.ctr = c.ctr || {};
    c.tp = c.tp || 0;
  }
  d.seats = toArr(d.seats);
  if(!d.seats.length) d.seats = [ newSeat() ];
  d.seats.forEach(function(sx){
    sx.mana = sx.mana || {};
    MANA.forEach(function(m){ if(sx.mana[m] == null) sx.mana[m] = 0; });
    sx.cmdDmg = sx.cmdDmg || {};
    if(sx.life == null) sx.life = 40;
    sx.poison = sx.poison || 0;
  });
  d.log = toArr(d.log);
  return d;
}

async function initSync(){
  var cfg = window.MTG_FIREBASE;
  if(!cfg || !cfg.databaseURL){ setDot('local'); return; }
  db = firebaseDb(cfg.databaseURL);
  stateRef = db.doc('tables/' + tableId);
  deckRef  = db.doc('decks/' + tableId);

  deckRef.onSnapshot(function(snap){
    if(!snap.exists) return;
    var data = snap.data();
    if(!data || !data.cards || !data.cards.length) return;
    if(defsAreBuiltin || data.stamp !== lastDeckStamp){
      defs = toArr(data.cards); defsAreBuiltin = false;
      deckName = data.name || 'Imported deck';
      importedCommander = data.commander || importedCommander;
      deckChanges = toArr(data.changes);
      physChanges = toArr(data.phys);
      lastDeckStamp = data.stamp;
      render();
    }
  }, function(){});

  stateRef.onSnapshot(function(snap){
    setDot('live');
    if(!snap.exists){ flush(); return; }
    var data = snap.data();
    if(!data || !data.z) return;
    if(data.by === DEVICE && (data.rev||0) <= (state.rev||0)) return;  // own echo
    if((data.rev||0) < (state.rev||0)) return;                          // stale
    state = normalise(data);
    markClean();          // the other device moved; undo starts again from here
    render();
  }, function(err){
    setDot('local'); stateRef = null;
  });
  setDot('live');
}
var lastDeckStamp = null;

/* ---------------- actions ---------------- */
function draw(n){
  n = n||1; var got=0;
  for(var i=0;i<n;i++){
    if(!state.z.lib.length) break;
    move(state.z.lib[0],'hand'); got++;
  }
  commit(got ? ('Drew '+got+' card'+(got>1?'s':'')) : 'Library is empty');
}
function mill(n){
  var got=0;
  for(var i=0;i<n;i++){ if(!state.z.lib.length) break; move(state.z.lib[0],'gy'); got++; }
  commit('Milled '+got);
}
function doShuffle(){ state.z.lib = shuffle(state.z.lib); commit('Shuffled library'); }

function untapAll(){
  var n=0;
  state.z.bf.forEach(function(iid){
    var c=state.cards[iid];
    if(c && c.tp){ c.tp=0; delete c.gave; n++; }
  });
  // Untapping everything is a new turn's worth of mana, not a refund.
  commit('Untapped '+n+' permanent'+(n===1?'':'s'));
}
function clearPool(){ var s=seat(); MANA.forEach(function(m){ s.mana[m]=0; }); }

function nextPhase(){
  state.phase = (state.phase + 1) % PHASES.length;
  if(emptyPool) clearPool();
  if(state.phase === 0) return nextTurn(true);
  commit(null);
}
function nextTurn(silent){
  state.turn++;
  state.phase = 0;
  var s = seat();
  var carried = (s.landMax == null) ? 1 : s.landMax;
  s.landDrop = 0;
  clearPool();
  if(autoUntap){ state.z.bf.forEach(function(iid){ var c=state.cards[iid]; if(c) c.tp=0; }); }
  logg('Turn '+state.turn+'');
  if(autoDraw && state.z.lib.length){ move(state.z.lib[0],'hand'); logg('Drew for turn'); }
  state.phase = 3;
  blip('turn');
  touch(); save();
  // Extra land drops usually come from a permanent that can leave, so a turn
  // that carried an allowance checks whether it still applies.
  if(carried !== 1 && !silent) setTimeout(function(){ askLandAllowance(carried); }, 60);
}

function askLandAllowance(carried){
  var sh = sheet('Still playing extra lands?',
    'Last turn you could play ' + (carried ? carried : 'any number of') + ' lands.');
  var g = el('div','grid');
  var keep = el('button','btn primary', carried ? ('Yes, ' + carried + ' again') : 'Yes, any number');
  keep.onclick = function(){ closeLayer(); };
  var back = el('button','btn','No, back to one');
  back.onclick = function(){
    seat().landMax = 1; lsSet('ktm.landmax','1');
    commit('Back to one land a turn'); closeLayer();
  };
  var more = el('button','btn ghost','Change it');
  more.onclick = function(){ closeLayer(); openLandAllowance(); };
  g.appendChild(keep); g.appendChild(back); g.appendChild(more);
  sh.appendChild(g);
}

function tapCard(iid){
  var c = state.cards[iid]; if(!c) return;
  var d = defOf(c);
  // Untapping a land takes back the mana it made, so a misplaced tap costs
  // nothing. Only what this land actually added comes off.
  if(c.tp && c.gave){
    addMana(c.gave, -1);
    var gave = c.gave;
    delete c.gave;
    c.tp = 0;
    commit('Untapped ' + (d ? d.n : 'a card') + ', took back ' + gave);
    return;
  }
  c.tp = c.tp ? 0 : 1;
  blip('tick');
  if(c.tp && d && isLand(d) && d.pm && d.pm.length){
    // Light assist: one produced colour goes to the pool. Multi-colour lands
    // ask, because guessing wrong is worse than one extra tap.
    if(d.pm.length === 1){
      addMana(d.pm[0],1); c.gave = d.pm[0];
      commit('Tapped '+d.n+' for '+d.pm[0]); return;
    }
    openManaChoice(d, iid); render(); return;
  }
  commit((c.tp?'Tapped ':'Untapped ') + (d?d.n:'a card'));
}
function addMana(sym,n){
  var s = seat(); if(!(sym in s.mana)) sym='C';
  s.mana[sym] = Math.max(0,(s.mana[sym]||0) + n);
}

// ---- auto-tap ------------------------------------------------------------
var autoTap = lsGet('ktm.autotap','1') === '1';

// What a cost actually demands: coloured pips, and a generic number.
function costNeed(m){
  var syms = parseCost(m), need = {}, generic = 0;
  MANA.forEach(function(k){ need[k] = 0; });
  syms.forEach(function(sym){
    if(/^[0-9]+$/.test(sym)){ generic += parseInt(sym,10); return; }
    if(/^[XYZ]$/.test(sym)) return;            // you decide X, not the app
    if(MANA.indexOf(sym) >= 0){ need[sym]++; return; }
    if(sym.indexOf('/') >= 0){                 // hybrid and phyrexian
      var parts = sym.split('/').filter(function(x){ return MANA.indexOf(x) >= 0; });
      if(parts.length){ need[parts[0]]++; return; }
    }
    generic++;
  });
  return { need:need, generic:generic };
}

// What one permanent makes when it taps. Scryfall says which colours; the
// rules text says how many, which is how Sol Ring is worth two and a Forest
// is worth one.
function sourceOut(d){
  var cols = ((d && d.pm) || []).filter(function(c){ return MANA.indexOf(c) >= 0; });
  if(!cols.length) return null;
  var amount = 1;
  var m = /Add ([^.]*)/i.exec((d && d.o) || '');
  if(m){
    var first = m[1].split(/ or /i)[0];
    var n = (first.match(/[{][^}]+[}]/g) || []).length;
    if(n > 1) amount = n;
  }
  return { cols:cols, amount:amount };
}

function planPayment(cost){
  var s = seat();
  var have = {}, need = {};
  MANA.forEach(function(k){ have[k] = s.mana[k] || 0; need[k] = cost.need[k] || 0; });
  var generic = cost.generic;

  // Floating mana pays first, colours before generic.
  MANA.forEach(function(k){
    var use = Math.min(have[k], need[k]); have[k] -= use; need[k] -= use;
  });
  MANA.forEach(function(k){
    var use = Math.min(have[k], generic); have[k] -= use; generic -= use;
  });

  var srcs = [];
  state.z.bf.forEach(function(iid){
    var c = state.cards[iid];
    if(!c || c.tp) return;
    var o = sourceOut(defOf(c));
    if(!o) return;
    srcs.push({ iid:iid, cols:o.cols, amount:o.amount, name:(defOf(c) || {}).n || 'a permanent' });
  });
  // A one-colour source is spent before a five-colour one, or the flexible
  // ones get used up on pips anything could have paid.
  srcs.sort(function(a,b){ return a.cols.length - b.cols.length || a.amount - b.amount; });

  var taps = [], used = {};
  MANA.forEach(function(k){
    while(need[k] > 0){
      var pick = null;
      for(var i=0;i<srcs.length;i++){
        if(used[srcs[i].iid]) continue;
        if(srcs[i].cols.indexOf(k) < 0) continue;
        pick = srcs[i]; break;
      }
      if(!pick) return;                         // this colour cannot be paid
      used[pick.iid] = 1;
      taps.push({ iid:pick.iid, colour:k, amount:pick.amount, name:pick.name });
      need[k] -= 1;
      var spare = pick.amount - 1;
      if(spare > 0){
        var more = Math.min(spare, need[k]); need[k] -= more; spare -= more;
        var g = Math.min(spare, generic); generic -= g;
      }
    }
  });
  // Generic is the opposite problem: fewest permanents tapped is best, so a
  // Sol Ring pays two rather than two lands doing it. Prefer the biggest
  // source that does not overshoot, so nothing is wasted.
  while(generic > 0){
    var free = srcs.filter(function(x){ return !used[x.iid]; });
    if(!free.length) break;
    free.sort(function(a,b){
      var ao = a.amount > generic ? 1 : 0, bo = b.amount > generic ? 1 : 0;
      if(ao !== bo) return ao - bo;              // exact fits before overshoot
      return ao ? a.amount - b.amount            // overshooting: waste least
                : b.amount - a.amount;           // fitting: take the biggest
    });
    var g = free[0];
    used[g.iid] = 1;
    taps.push({ iid:g.iid, colour:g.cols[0], amount:g.amount, name:g.name });
    generic -= g.amount;
  }

  var shortCols = MANA.filter(function(k){ return need[k] > 0; });
  return { ok: generic <= 0 && !shortCols.length,
           taps: taps, shortCols: shortCols, shortGeneric: Math.max(0, generic) };
}

function payFromPool(cost){
  var s = seat();
  MANA.forEach(function(k){
    var use = Math.min(s.mana[k] || 0, cost.need[k] || 0);
    s.mana[k] -= use;
  });
  var g = cost.generic;
  ['C','W','U','B','R','G'].forEach(function(k){
    var use = Math.min(s.mana[k] || 0, g);
    s.mana[k] -= use; g -= use;
  });
}

// The one action: pay for it and put it down.
function castCard(iid){
  var c = state.cards[iid];
  if(!c) return;
  var d = defOf(c);
  if(!d || isLand(d) || !autoTap || !d.m) return playCard(iid);

  var cost = costNeed(d.m);
  if(!cost.generic && !MANA.some(function(k){ return cost.need[k]; })) return playCard(iid);

  var plan = planPayment(cost);
  if(!plan.ok) return offerAnyway(iid, d, plan);

  plan.taps.forEach(function(t){
    var sc = state.cards[t.iid];
    // The mana goes straight into this spell, so untapping must not hand it
    // back the way a manual tap does.
    if(sc){ sc.tp = 1; delete sc.gave; }
    addMana(t.colour, t.amount);
  });
  payFromPool(cost);
  move(iid,'bf');
  c.tp = d.ebt ? 1 : 0;
  startingLoyalty(c, d);
  blip('act');
  commit(plan.taps.length
    ? ('Tapped ' + plan.taps.length + ' for ' + d.n + ' and played it')
    : ('Played ' + d.n + ' from floating mana'));
}

// A planeswalker arrives with its printed loyalty, and doublers apply to it
// the same as any other counter.
function startingLoyalty(c, d){
  if(!c || !d || !/Planeswalker/.test(d.t || '')) return;
  var base = parseInt(d.loy, 10);
  if(!base) return;
  c.ctr = c.ctr || {};
  c.ctr.loyalty = counterMath('loyalty', base).n;
}

function offerAnyway(iid, d, plan){
  var missing = [];
  plan.shortCols.forEach(function(k){ missing.push(MANA_NAME[k]); });
  if(plan.shortGeneric) missing.push(plan.shortGeneric + ' more of anything');
  var sh = sheet('Not enough mana for ' + d.n,
                 'Short of ' + missing.join(' and ') + '.');
  actionGrid(sh, [
    ['Play it anyway', function(){ playCard(iid); closeLayer(); }, true],
    ['Leave it in hand', function(){ closeLayer(); }]
  ]);
  sh.appendChild(el('p','note','Nothing is blocked here. The count is a convenience.'));
}

// ---- counters -----------------------------------------------------------
var COUNTERS = [
  { k:'p1p1',    label:'+1/+1',  pt:1 },
  { k:'m1m1',    label:'-1/-1',  pt:-1 },
  { k:'loyalty', label:'Loyalty' },
  { k:'charge',  label:'Charge' },
  { k:'stun',    label:'Stun' },
  { k:'shield',  label:'Shield' }
];
function counterLabel(k){
  for(var i=0;i<COUNTERS.length;i++) if(COUNTERS[i].k === k) return COUNTERS[i].label;
  return k;
}

// Replacement effects only. Each one reads your own battlefield, never anyone
// else's, so none of this needs to know what the table is holding. Matched by
// printed name rather than by reading rules text, because a guess here would
// quietly give you the wrong number.
var COUNTER_RULES = [
  { n:'Doubling Season',              mult:2, tokens:2 },
  { n:'Primal Vigor',                 mult:2, tokens:2 },
  { n:'Vorinclex, Monstrous Raider',  mult:2 },
  { n:"Innkeeper's Talent",           mult:2 },
  { n:'Branching Evolution',          mult:2, only:'p1p1' },
  { n:'Corpsejack Menace',            mult:2, only:'p1p1' },
  { n:'Hardened Scales',              add:1,  only:'p1p1' },
  { n:'Ozolith, the Shattered Spire', add:1,  only:'p1p1' },
  { n:'Conclave Mentor',              add:1,  only:'p1p1' },
  { n:'Parallel Lives',               tokens:2 },
  { n:'Anointed Procession',          tokens:2 },
  { n:'Mondrak, Glory Dominus',       tokens:2 }
];

function rulesInPlay(){
  var out = [];
  state.z.bf.forEach(function(iid){
    var c = state.cards[iid];
    if(!c || c.fd) return;                     // a face down card does nothing
    var d = defOf(c);
    if(!d) return;
    for(var i=0;i<COUNTER_RULES.length;i++){
      if(COUNTER_RULES[i].n === d.n) out.push(COUNTER_RULES[i]);
    }
  });
  return out;
}

// Adders apply before doublers, which is the order that gives the most and the
// one you would choose. Returns the final number and the working.
function counterMath(kind, base){
  var adds = 0, mults = [], why = [];
  rulesInPlay().forEach(function(r){
    if(r.only && r.only !== kind) return;
    if(r.add){ adds += r.add; why.push(r.n + ' adds ' + r.add); }
    if(r.mult){ mults.push(r.mult); why.push(r.n + ' doubles'); }
  });
  var n = base + adds;
  mults.forEach(function(m){ n = n * m; });
  return { n:n, base:base, why:why };
}
function tokenMath(base){
  var mults = [], why = [];
  rulesInPlay().forEach(function(r){
    if(r.tokens){ mults.push(r.tokens); why.push(r.n + ' doubles'); }
  });
  var n = base;
  mults.forEach(function(m){ n = n * m; });
  return { n:n, base:base, why:why };
}

function counterSum(c){
  var t = 0, ctr = (c && c.ctr) || {};
  for(var k in ctr) t += Math.abs(ctr[k]);
  return t;
}

// ---- the counter sheet ---------------------------------------------------
function openCounters(iid){
  var c = state.cards[iid];
  if(!c) return;
  var d = defOf(c);
  var sh = sheet('Counters', d ? d.n : 'This permanent');
  var body = el('div');
  sh.appendChild(body);

  function paint(){
    body.innerHTML = '';
    var ctr = c.ctr || {};
    var kinds = Object.keys(ctr);
    if(kinds.length){
      kinds.forEach(function(k){
        var row = el('div','cdgrid');
        row.appendChild(el('div','lbl', counterLabel(k)));
        var dn = el('button',null,'\u2212');
        var val = el('div','val', String(ctr[k]));
        var up = el('button',null,'+');
        dn.onclick = function(){ addCounter(iid, k, -1, true); paint(); };
        up.onclick = function(){ addCounter(iid, k, 1); paint(); };
        row.appendChild(dn); row.appendChild(val); row.appendChild(up);
        body.appendChild(row);
      });
    } else {
      body.appendChild(el('p','note','No counters on this yet.'));
    }

    body.appendChild(el('div','divider'));
    var math = counterMath('p1p1', 1);
    if(math.why.length){
      var m = el('p','note');
      m.innerHTML = '<b>One +1/+1 counter becomes ' + math.n + '.</b> ' + math.why.join(', ') + '.';
      m.style.marginBottom = 'var(--s3)';
      body.appendChild(m);
    }
    var g = el('div','grid');
    COUNTERS.forEach(function(x){
      var b = el('button','btn', 'Add ' + x.label);
      b.onclick = function(){ addCounter(iid, x.k, 1); paint(); };
      g.appendChild(b);
    });
    var other = el('button','btn ghost','Other kind');
    other.onclick = function(){
      var name = (prompt && prompt('Name of counter')) || '';
      name = String(name).trim().toLowerCase().replace(/[^a-z0-9 ]/g,'').slice(0,14);
      if(name){ addCounter(iid, name, 1); paint(); }
    };
    g.appendChild(other);
    body.appendChild(g);
  }
  paint();
}

// One place that puts counters on, so the replacement effects cannot be
// skipped by going in a side door. `raw` means place exactly this many.
function addCounter(iid, kind, delta, raw){
  var c = state.cards[iid];
  if(!c) return;
  c.ctr = c.ctr || {};
  var applied = delta;
  var note = '';
  if(delta > 0 && !raw){
    var m = counterMath(kind, delta);
    applied = m.n;
    if(m.why.length) note = ' (' + m.why.join(', ') + ')';
  }
  c.ctr[kind] = (c.ctr[kind] || 0) + applied;
  if(!c.ctr[kind]) delete c.ctr[kind];
  var d = defOf(c);
  blip('tick');
  commit((applied >= 0 ? 'Put ' + applied : 'Removed ' + Math.abs(applied))
    + ' ' + counterLabel(kind) + (Math.abs(applied) === 1 ? ' counter' : ' counters')
    + ' on ' + (d ? d.n : 'a permanent') + note);
}

// ---- proliferate ---------------------------------------------------------
function openProliferate(){
  var withCounters = state.z.bf.filter(function(iid){ return counterSum(state.cards[iid]); });
  var sh = sheet('Proliferate', 'Add one more of each kind of counter already there.');
  if(!withCounters.length){
    sh.appendChild(el('p','note','Nothing on your battlefield has a counter on it.'));
    return;
  }
  var picked = {};
  withCounters.forEach(function(iid){ picked[iid] = true; });

  var list = el('div');
  sh.appendChild(list);
  function paint(){
    list.innerHTML = '';
    withCounters.forEach(function(iid){
      var c = state.cards[iid], d = defOf(c);
      var row = el('button','prolrow' + (picked[iid] ? ' on' : ''));
      row.appendChild(el('div','pr-n', d ? d.n : 'Permanent'));
      var kinds = Object.keys(c.ctr || {}).map(function(k){
        return counterLabel(k) + ' ' + c.ctr[k];
      }).join(', ');
      row.appendChild(el('div','pr-c', kinds));
      row.onclick = function(){ picked[iid] = !picked[iid]; paint(); };
      list.appendChild(row);
    });
  }
  paint();

  sh.appendChild(el('div','divider'));
  var go = el('button','btn primary','Proliferate the chosen');
  go.style.cssText = 'width:100%;justify-content:center';
  go.onclick = function(){
    var n = 0;
    withCounters.forEach(function(iid){
      if(!picked[iid]) return;
      var c = state.cards[iid];
      Object.keys(c.ctr || {}).forEach(function(k){
        var m = counterMath(k, 1);
        c.ctr[k] = (c.ctr[k] || 0) + (c.ctr[k] < 0 ? -m.n : m.n);
        n++;
      });
    });
    blip('act');
    commit('Proliferated ' + n + ' counter kind' + (n===1?'':'s'));
    closeLayer();
  };
  sh.appendChild(go);
  var pm = counterMath('p1p1', 1);
  if(pm.why.length){
    sh.appendChild(el('p','note','Each counter becomes ' + pm.n + ': ' + pm.why.join(', ') + '.'));
  }
  sh.appendChild(el('p','note','Opponents are not listed. Proliferate their poison at the table.'));
}

function playCard(iid, opts){
  opts = opts||{};
  var c = state.cards[iid], d = defOf(c); if(!c) return;
  move(iid,'bf');
  var tapped = !!opts.tapped || (d && d.ebt);
  c.tp = tapped ? 1 : 0;
  startingLoyalty(c, d);
  if(d && isLand(d)){ seat().landDrop = (seat().landDrop||0) + 1; }
  blip('act');
  commit('Played '+(d?d.n:'a card') + (tapped?' (tapped)':''));
}

function makeToken(td, count){
  count = count||1;
  var tm = tokenMath(count);
  var tokenNote = tm.why.length ? ' (' + tm.why.join(', ') + ')' : '';
  count = tm.n;
  for(var i=0;i<count;i++){
    var iid = 'k'+(nextId++)+Math.random().toString(36).slice(2,5);
    state.cards[iid] = { i:iid, d:-1, tp:0, ctr:{}, fd:0, tok:1, td:td };
    state.z.bf.push(iid);
  }
  commit('Created '+count+'\u00d7 '+td.n+tokenNote);
}
function copyAsToken(iid){
  var c = state.cards[iid], d = defOf(c); if(!d) return;
  var td = { n:d.n, t:d.t, m:d.m, p:d.p, tg:d.tg, ci:d.ci, pm:d.pm, s:d.s, o:d.o, copy:1 };
  makeToken(td,1);
}
function bump(iid, key, delta){
  var c = state.cards[iid]; if(!c) return;
  c.ctr = c.ctr||{};
  c.ctr[key] = (c.ctr[key]||0) + delta;
  if(!c.ctr[key]) delete c.ctr[key];
  commit(null);
}

/* ---------------- rendering ---------------- */
// A remote write re-renders everything; without this the hand strip snaps
// back to the first card mid-scroll.
var scrollMem = {};
function rememberScrolls(){
  var els = document.querySelectorAll('[data-scroll]');
  for(var i=0;i<els.length;i++){
    scrollMem[els[i].getAttribute('data-scroll')] = [els[i].scrollLeft, els[i].scrollTop];
  }
}
function restoreScrolls(){
  var els = document.querySelectorAll('[data-scroll]');
  for(var i=0;i<els.length;i++){
    var v = scrollMem[els[i].getAttribute('data-scroll')];
    if(v){ els[i].scrollLeft = v[0]; els[i].scrollTop = v[1]; }
  }
}

// An iPhone browser cannot vibrate, so every action makes a short sound instead.
// Small actions stay small: if everything is loud, nothing is.
var soundOn = lsGet('ktm.sound','1') === '1';
var AC = null;
function blip(kind){
  if(!soundOn) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    var spec = kind === 'turn' ? [523, 0.13, 0.07]
             : kind === 'act'  ? [392, 0.09, 0.05]
             :                   [784, 0.045, 0.025];
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = spec[0];
    g.gain.setValueAtTime(0.0001, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(spec[2], AC.currentTime + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + spec[1]);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + spec[1] + 0.02);
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate(kind === 'turn' ? 16 : 7); }catch(e){}
}

// Battlefield cards grow until the row they are in stops fitting, so the board
// uses every pixel it has instead of leaving a margin of empty felt.
function fitTray(tray, n){
  if(!tray || !n) return;
  var cs = getComputedStyle(tray);
  var W = tray.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  var H = tray.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if(W <= 0 || H <= 0) return;
  var gx = 8, gy = 12, best = 54;
  for(var w = 280; w >= 54; w -= 2){
    var h = w * 88 / 63;
    var perRow = Math.max(1, Math.floor((W + gx) / (w + gx)));
    var rows = Math.ceil(n / perRow);
    if(rows * (h + gy) - gy <= H){ best = w; break; }
  }
  tray.style.setProperty('--cw', best + 'px');
}
// One frame after a render the flex boxes can still measure zero, so watch the
// trays and refit whenever their box actually settles.
var fitRO = null;
function fitAllTrays(){
  var trays = document.querySelectorAll('.tray');
  if(window.ResizeObserver){
    if(!fitRO){
      fitRO = new ResizeObserver(function(entries){
        for(var k=0;k<entries.length;k++){
          var t = entries[k].target;
          fitTray(t, t.querySelectorAll('.cw').length);
        }
      });
    }
    fitRO.disconnect();
  }
  for(var i=0;i<trays.length;i++){
    fitTray(trays[i], trays[i].querySelectorAll('.cw').length);
    if(fitRO) fitRO.observe(trays[i]);
  }
}

var el = function(tag,cls,txt){ var n=document.createElement(tag); if(cls)n.className=cls; if(txt!=null)n.textContent=txt; return n; };
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }

function manaColorVar(sym){ return 'var(--m'+sym+')'; }
function faceColors(d){
  var ci = (d && d.ci) || [];
  if(!ci.length) return ['#333f38','#1b2520'];
  if(ci.length > 1) return ['#3a3526','#1f2118'];
  var map = {W:['#3c3a2e','#22231b'],U:['#22354a','#141f2b'],B:['#2e2736','#1a1620'],
             R:['#3d261f','#221512'],G:['#233a29','#141f17']};
  return map[ci[0]] || ['#333f38','#1b2520'];
}
function parseCost(m){
  var out = [], re = /\{([^}]+)\}/g, x;
  while((x = re.exec(m||''))) out.push(x[1]);
  return out;
}

function cardFace(d, forZoom){
  // Typographic face, used for tokens and for imported decks (no art available).
  var f = el('div','face');
  var fc = faceColors(d);
  f.style.setProperty('--fc1',fc[0]); f.style.setProperty('--fc2',fc[1]);
  var top = el('div');
  top.style.cssText = 'display:flex;gap:4px;align-items:flex-start;justify-content:space-between';
  var nm = el('div','fn', d.n || 'Token'); top.appendChild(nm);
  var cost = el('div','fm');
  parseCost(d.m).slice(0,8).forEach(function(sym){
    var i = el('i', null, sym.replace(/\//g,''));
    i.style.background = MANA.indexOf(sym) >= 0 ? manaColorVar(sym) : '#b9c2be';
    if(sym==='U'||sym==='B') i.style.color = '#eef3ff';
    cost.appendChild(i);
  });
  if(cost.children.length) top.appendChild(cost);
  f.appendChild(top);
  f.appendChild(el('div','ft', (d.copy?'Token copy, ':'') + (d.t || 'Token')));
  if(!forZoom || true) f.appendChild(el('div','fo', d.o || ''));
  if(d.p != null || d.tg != null) f.appendChild(el('div','fpt', (d.p==null?'0':d.p)+' / '+(d.tg==null?'0':d.tg)));
  return f;
}

function cardNode(iid, opts){
  opts = opts||{};
  var c = state.cards[iid], d = defOf(c);
  var w = el('div','cw');
  w.dataset.iid = iid;
  if(c && c.tp && opts.zone === 'bf') w.classList.add('tapped');

  var btn = el('button','card');
  btn.type = 'button';
  btn.setAttribute('aria-label', (opts.hidden||!d) ? 'Face-down card' : d.n);

  if(opts.hidden || (c && c.fd)){
    btn.appendChild(el('div','back'));
  } else if(hasArt(d) && !(c && c.tok)){
    var img = new Image();
    img.src = artSrc(d);
    img.alt = d.n;
    img.loading = 'lazy';
    img.decoding = 'async';
    img.onerror = function(){ btn.innerHTML=''; btn.appendChild(cardFace(d)); addOverlays(); };
    btn.appendChild(img);
  } else if(d){
    btn.appendChild(cardFace(d));
  } else {
    btn.appendChild(el('div','back'));
  }

  function addOverlays(){
    if(opts.zone !== 'bf' || !d) return;
    var bar = el('div','badges');
    var left = el('div'); left.style.cssText='display:flex;gap:3px;flex-wrap:wrap';
    var ctr = (c && c.ctr) || {};
    Object.keys(ctr).forEach(function(k){
      var v = ctr[k];
      var txt = k === 'p1p1' ? (v>0?'+':'')+v+'/'+(v>0?'+':'')+v
              : k === 'loyalty' ? String(v)
              : counterLabel(k) + ' ' + v;
      var b = el('span','bdg ctr' + (v<0?' neg':'') + (k==='loyalty'?' loy':''), txt);
      left.appendChild(b);
    });
    if(c && c.tok) left.appendChild(el('span','bdg tok','TOKEN'));
    bar.appendChild(left);
    if(d.p != null || d.tg != null){
      var pw = parseInt(d.p,10), tg = parseInt(d.tg,10);
      var add = ctr.p1p1 || 0;
      var ptTxt = (isNaN(pw)? (d.p||'*') : pw+add) + '/' + (isNaN(tg)? (d.tg||'*') : tg+add);
      bar.appendChild(el('span','bdg', ptTxt));
    }
    if(bar.firstChild && (left.children.length || bar.children.length>1)) btn.appendChild(bar);
  }
  addOverlays();

  // Single tap on the battlefield = tap/untap (fastest path for mana).
  // Long press, or a tap anywhere else, opens the card sheet.
  var onTap = opts.onTap || function(){
    if(opts.zone === 'bf' && !opts.hidden) tapCard(iid);
    else openCardSheet(iid, opts.zone);
  };
  var onHold = opts.onHold || function(){ openCardSheet(iid, opts.zone); };
  var timer=null, longFired=false;
  btn.addEventListener('pointerdown', function(){
    longFired=false;
    timer = setTimeout(function(){ longFired=true; onHold(); }, 430);
  });
  var cancel=function(){ clearTimeout(timer); };
  btn.addEventListener('pointerup', cancel);
  btn.addEventListener('pointerleave', cancel);
  btn.addEventListener('pointercancel', cancel);
  btn.addEventListener('click', function(ev){
    ev.preventDefault();
    if(longFired) return;
    onTap();
  });
  btn.addEventListener('contextmenu', function(ev){ ev.preventDefault(); onHold(); });

  w.appendChild(btn);
  return w;
}

// Counts what has actually been played this turn. The allowance is whatever
// the board says it is, so it is set by hand rather than assumed to be one.
function landMark(){
  var s = seat();
  var used = s.landDrop || 0;
  var max = (s.landMax == null) ? 1 : s.landMax;
  var free = max === 0;                       // 0 means no limit tonight
  var state2 = free ? 'open' : used > max ? 'over' : used >= max ? 'used' : 'open';
  var mark = el('button','dropmark ' + state2);
  mark.appendChild(el('span','dropdot'));
  mark.appendChild(el('b', null, free
    ? ('Lands played ' + used)
    : ('Lands played ' + used + ' of ' + max)));
  mark.setAttribute('aria-label','Lands played this turn. Tap to change the allowance.');
  mark.onclick = openLandAllowance;
  return mark;
}

function openLandAllowance(){
  var s = seat();
  var sh = sheet('Lands this turn',
    'Played ' + (s.landDrop || 0) + ' so far. Set what the board allows.');
  var g = el('div','grid');
  [['1 land', 1], ['2 lands', 2], ['3 lands', 3], ['Any number', 0]].forEach(function(o){
    var b = el('button','btn' + (((s.landMax == null ? 1 : s.landMax) === o[1]) ? ' primary' : ''), o[0]);
    b.onclick = function(){
      s.landMax = o[1];
      lsSet('ktm.landmax', String(o[1]));
      commit('Lands allowed this turn: ' + (o[1] ? o[1] : 'any'));
      closeLayer();
    };
    g.appendChild(b);
  });
  sh.appendChild(g);
  sh.appendChild(el('div','divider'));
  var r = el('div','grid');

  sh.appendChild(el('p','note','Nothing is blocked either way. This only keeps count.'));

function openDeckSheet(){

    var was = qOf(d);
    d.q = Math.max(0, was + delta);
    if(d.q === was) return;          // already at zero, nothing moved
    noteChange(d.n, d.q - was);
    persistDeck();
    paint();

  function paintPhys(){

    diffWrap.innerHTML = '';

    row.appendChild(cp); row.appendChild(done);
    diffWrap.appendChild(row);
    diffWrap.appendChild(el('div','divider'));
  }

  function deckRow(d){
    var r = el('div','deckrow');
    r.appendChild(el('div','dn', d.n));
    if(d.t) r.appendChild(el('div','dt', String(d.t).split('\u2014')[0].trim()));
    var dn = el('button',null,'\u2212');
    dn.setAttribute('aria-label','Remove one ' + d.n);
    dn.onclick = function(){ bump(d,-1); };
    var q = el('div','dq', String(qOf(d)));
    if(!qOf(d)) q.style.color = 'var(--ink3)';
    var up = el('button',null,'+');

    up.onclick = function(){ bump(d,1); };
    r.appendChild(dn); r.appendChild(q); r.appendChild(up);
    return r;
  }

  function paintList(){
    scroller.innerHTML = '';
    var f = (fin.value || '').toLowerCase();
    var main = [], side = [], shown = 0;
    defs.forEach(function(d){
      if(f && (d.n + ' ' + (d.t||'')).toLowerCase().indexOf(f) < 0) return;
      (qOf(d) ? main : side).push(d);
    });
    [['In the deck', main],['Sideboard box', side]].forEach(function(grp){
      if(!grp[1].length) return;
      var h = el('div','pbsec');
      h.appendChild(el('span',null,grp[0]));
      h.appendChild(el('span','rule'));
      h.appendChild(el('b',null,String(grp[1].length)));
      scroller.appendChild(h);
      grp[1].forEach(function(d){
        if(shown++ > 140) return;
        scroller.appendChild(deckRow(d));
      });
    });
    if(!main.length && !side.length){
      scroller.appendChild(el('p','note','No cards match that filter.'));
    }
  }

  function paintFoot(){
    foot.innerHTML = '';
    foot.appendChild(el('div','divider'));
    var g = el('div','grid');
    var ng = el('button','btn primary','New game with this list');
    ng.onclick = function(){
      var keep = seats().filter(function(o){ return o.opp; });
      state = buildGame(defs, importedCommander);
      keep.forEach(function(o){ o.life=40; o.poison=0; o.cmdDmg={}; state.seats.push(o); });
      dealOpeningHand();
      undoStack = [];
      commit('New game, ' + totalCards() + ' cards');
      closeLayer();
      doMulligan();
    };
    var ex = el('button','btn','Export for Moxfield');
    ex.onclick = function(){ closeLayer(); openExportSheet(); };
    g.appendChild(ng); g.appendChild(ex);
    foot.appendChild(g);
    var n = el('p','note');
    n.style.marginTop='9px';
    n.textContent = 'Edits change the list, not the game in progress. Start a new game to shuffle them in.';
    foot.appendChild(n);
  }

  function paint(){
    paintPhys();
    paintDiff();
    paintList();
    paintFoot();
    var h = sh.querySelector('.sub');
    if(h){
      var sc = sideCount();
      h.textContent = deckName + ' \u00b7 ' + totalCards() + ' cards'
        + (sc ? ' \u00b7 ' + sc + ' in the box' : '');
    }
  }

  fin.oninput = paintList;

  abtn.onclick = async function(){
    var name = (ain.value || '').trim();
    if(!name){ astat.textContent = 'Type a card name first.'; return; }
    var ex = findDef(name);
    if(ex){
      var was = qOf(ex);
      bump(ex, 1);
      astat.textContent = (was === 0)
        ? 'Pulled ' + ex.n + ' out of the sideboard box.'
        : 'Already in the deck, now ' + ex.q + '.';
      ain.value = '';
      return;
    }
    abtn.disabled = true;
    astat.textContent = 'Looking up ' + name + '\u2026';
    var d = { n:name, q:1, t:'', m:'', ci:[], pm:[], o:'' };
    try{
      var hit = await scryOne(name);
      if(hit){ hit.q = 1; d = hit; }
      else astat.textContent = 'Scryfall does not know that card. Added by name only.';
    }catch(e){
      astat.textContent = navigator.onLine
        ? 'Card lookup failed. Added by name only.'
        : 'No internet. Added by name only.';
    }
    var dupe = findDef(d.n);
    if(dupe){ bump(dupe, 1); }
    else { defs.push(d); noteChange(d.n, 1); persistDeck(); paint(); }
    if(astat.textContent.indexOf('Looking up') === 0) astat.textContent = 'Added ' + d.n + '.';
    ain.value = '';
    abtn.disabled = false;
  };

  paint();
}

// Load one of the built-in decks, replacing whatever is loaded now.
function loadBuiltin(id){
  builtinId = id;
  lsSet('ktm.builtin', id);
  var b = builtinDeck();
  if(!b) return;
  BUILTIN = b.cards;
  defs = BUILTIN;
  defsAreBuiltin = true;
  deckChanges = [];
  physChanges = [];
  importedCommander = b.commander;
  deckName = b.name;
  try{ localStorage.removeItem('ktm.defs'); }catch(e){}
  if(deckRef) deckRef.delete().catch(function(){});
  state = buildGame(defs, b.commander);
  dealOpeningHand();
  undoStack = [];
  commit('Loaded ' + deckName);
  closeLayer();
  doMulligan();
}

/* ---------- hand view (phone) ---------- */
function renderHandView(){
  var v = el('div','handview');
  var s = seat();

  var meta = el('div','handmeta');
  meta.hidden = !showLife && !hasFloatingMana();
  var lifeWrap = el('div');
  lifeWrap.style.cssText='display:flex;align-items:center;gap:6px';
  var mn = el('button','btn sm','\u2212'); mn.onclick=function(){ s.life--; commit(null); };
  var lf = el('div','life', String(s.life));
  var pl = el('button','btn sm','+'); pl.onclick=function(){ s.life++; commit(null); };
  lifeWrap.appendChild(mn); lifeWrap.appendChild(lf); lifeWrap.appendChild(pl);
  lifeWrap.hidden = !showLife;
  meta.appendChild(lifeWrap);

  var mini = el('div','mini');
  MANA.forEach(function(m){
    if(!s.mana[m]) return;
    var w = el('button'); w.className='msym';
    w.style.background = manaColorVar(m);
    if(m==='U'||m==='B') w.style.color='#eef3ff';
    w.textContent = m;
    w.appendChild(el('s',null,String(s.mana[m])));
    w.onclick=function(){ addMana(m,-1); commit(null); };
    mini.appendChild(w);
  });
  if(!mini.children.length && showLife){
    var hint = el('div',null,'No mana floating');
    hint.style.cssText='font-size:var(--t1);color:var(--ink3);font-style:italic';
    mini.appendChild(hint);
  }
  meta.appendChild(mini);
  v.appendChild(meta);

  // Your own battlefield has to be reachable from the phone: cards come back
  // to hand, creatures block, counters go on things.
  var bfAll = state.z.bf.length;
  var tabs = el('div','ptabs');
  tabs.hidden = !showPhoneBoard;
  if(!showPhoneBoard) phoneTab = 'hand';
  [['hand','Hand',state.z.hand.length],['board','Board',bfAll]].forEach(function(t){
    var b = el('button');
    b.setAttribute('aria-pressed', phoneTab===t[0] ? 'true':'false');
    b.appendChild(document.createTextNode(t[1]));
    b.appendChild(el('b',null,String(t[2])));
    b.onclick = function(){ phoneTab=t[0]; lsSet('ktm.ptab',phoneTab); render(); };
    tabs.appendChild(b);
  });
  v.appendChild(tabs);

  if(phoneTab === 'board'){
    v.appendChild(phoneBoard());
    v.appendChild(phoneZones());
    v.appendChild(phoneActions());
    return v;
  }

  // The focused card is per-device UI, not shared state.
  if(state.z.hand.indexOf(focusIid) < 0) focusIid = state.z.hand[0] || null;

  var cast = el('div','castrow');
  var castBtn = el('button','btn primary','Cast to board');
  var moreBtn = el('button','btn ghost','More');
  cast.appendChild(castBtn); cast.appendChild(moreBtn);
  v.appendChild(cast);

  // One scroller, one finger, one card centred at a time.
  var deck = el('div','handdeck');
  deck.setAttribute('data-scroll','handdeck');
  v.appendChild(deck);

  function labelFor(iid){
    if(!iid){ castBtn.disabled = true; moreBtn.disabled = true;
              castBtn.textContent = 'Nothing to play'; return; }
    castBtn.disabled = false; moreBtn.disabled = false;
    var d = defOf(state.cards[iid]);
    castBtn.textContent = (d && isLand(d)) ? 'Play land' : 'Cast to board';
  }

  if(!state.z.hand.length){
    deck.appendChild(el('div','emptyhand','Your hand is empty. Tap Draw below.'));
  }
  state.z.hand.forEach(function(iid){
    deck.appendChild(cardNode(iid, {
      zone:'hand',
      onTap:  function(){ var dd = defOf(state.cards[iid]); if(dd) openCardInfo(dd); },
      onHold: function(){ openCardSheet(iid, 'hand'); }
    }));
  });

  // Whatever sits under the middle of the screen is what the buttons act on.
  function centred(){
    var mid = deck.scrollLeft + deck.clientWidth / 2, best = null, bd = 1e9;
    for(var k=0;k<deck.children.length;k++){
      var c = deck.children[k];
      if(!c.dataset || !c.dataset.iid) continue;
      var dd = Math.abs((c.offsetLeft + c.offsetWidth / 2) - mid);
      if(dd < bd){ bd = dd; best = c; }
    }
    return best ? best.dataset.iid : null;
  }
  var scrollT = null;
  deck.addEventListener('scroll', function(){
    clearTimeout(scrollT);
    scrollT = setTimeout(function(){
      var iid = centred();
      if(iid && iid !== focusIid){ focusIid = iid; labelFor(iid); }
    }, 60);
  }, { passive:true });

  castBtn.onclick = function(){ var iid = centred() || focusIid; if(iid) castCard(iid); };
  moreBtn.onclick = function(){ var iid = centred() || focusIid; if(iid) openCardSheet(iid,'hand'); };

  if(state.z.hand.indexOf(focusIid) < 0) focusIid = state.z.hand[0] || null;
  labelFor(focusIid);

  v.appendChild(phoneZones());
  v.appendChild(phoneActions());
  return v;
}

/* ---------------- sheets ---------------- */
function closeLayer(){ document.getElementById('layer').innerHTML=''; }
function sheet(title, subtitle){
  var layer = document.getElementById('layer');
  layer.innerHTML='';
  var scrim = el('div','scrim');
  scrim.addEventListener('click', function(e){ if(e.target===scrim) closeLayer(); });
  var s = el('div','sheet');

  var head = el('div');
  head.style.cssText='display:flex;justify-content:space-between;align-items:flex-start;gap:10px';

  });

function actionGrid(s, actions){
  var g = el('div','grid');
  actions.forEach(function(a){
    if(!a) return;
    var b = el('button','btn'+(a[2]?' primary':''), a[0]);
    b.onclick = function(){ a[1](); };
    g.appendChild(b);
  });
  s.appendChild(g);
  return g;
}

function openCardSheet(iid, zone){
  var c = state.cards[iid]; if(!c) return;
  var d = defOf(c);
  var z = zoneOf(iid) || zone;
  var s = sheet(d ? d.n : 'Card', (d ? d.t : '') + ' \u00b7 in ' + (ZONES[z]||z));

  if(d && d.o){
    var o = el('p','note', d.o);
    o.style.cssText='margin:0 0 12px;max-height:120px;overflow:auto;white-space:pre-wrap';
    s.appendChild(o);
  }

  var acts = [];
  if(z === 'hand'){
    acts.push(['Play', function(){ castCard(iid); closeLayer(); }, true]);
    acts.push(['Play tapped', function(){ playCard(iid,{tapped:true}); closeLayer(); }]);
    acts.push(['Play without paying', function(){ playCard(iid); closeLayer(); }]);
  }
  if(z === 'bf'){
    acts.push([c.tp?'Untap':'Tap', function(){ tapCard(iid); closeLayer(); }, true]);
    acts.push(['Counters', function(){ closeLayer(); openCounters(iid); }]);
    acts.push(['+1/+1', function(){ addCounter(iid,'p1p1',1); closeLayer(); }]);

var rulingCache = {}, printCache = {};

function openCardInfo(d){
  if(!d) return;
  var id = cardId(d);
  var sh = sheet(d.n, [d.t, d.p != null ? (d.p + '/' + d.tg) : null]
    .filter(Boolean).join('  \u00b7  '));

  if(d.m){
    var cost = el('div','fm');
    cost.style.marginBottom = 'var(--s3)';
    parseCost(d.m).slice(0,10).forEach(function(sym){
      var i2 = el('i', null, sym.replace(/[/]/g,''));
      i2.style.cssText = 'width:22px;height:22px;border-radius:50%;font-style:normal;'
        + 'font-size:12px;display:grid;place-items:center;font-family:var(--disp);'
        + 'font-weight:800;color:#10160f;background:'
        + (MANA.indexOf(sym) >= 0 ? manaColorVar(sym) : '#b9c2be');
      if(sym==='U'||sym==='B') i2.style.color = '#eef3ff';
      cost.appendChild(i2);
    });
    sh.appendChild(cost);
  }

  if(d.o){
    var o = el('p','note', d.o);
    o.style.cssText = 'white-space:pre-wrap;line-height:1.5;color:var(--ink2);margin:0 0 var(--s4)';
    sh.appendChild(o);
  }

  sh.appendChild(el('div','divider'));
  var tabs = el('div','chips');
  var body = el('div');
  body.style.marginTop = 'var(--s3)';
  ['Rulings','Printings'].forEach(function(name){
    var c = el('button','chip', name);
    c.setAttribute('aria-pressed', name==='Rulings' ? 'true':'false');
    c.onclick = function(){
      [].forEach.call(tabs.children, function(x){ x.setAttribute('aria-pressed','false'); });
      c.setAttribute('aria-pressed','true');
      name === 'Rulings' ? showRulings() : showPrintings();
    };
    tabs.appendChild(c);
  });
  sh.appendChild(tabs);
  sh.appendChild(body);

  function msg(t){ body.innerHTML=''; body.appendChild(el('p','note', t)); }

  function showRulings(){
    if(!id) return msg('This card came in by name only, so there is nothing to look up.');
    if(rulingCache[id]) return paintRulings(rulingCache[id]);
    msg('Looking up rulings' + '\u2026');
    fetch(SCRY + '/cards/' + id + '/rulings')
      .then(function(r){ return r.json(); })
      .then(function(j){ rulingCache[id] = j.data || []; paintRulings(rulingCache[id]); })
      .catch(function(){
        msg(navigator.onLine ? 'Scryfall did not answer.' : 'No internet, so rulings cannot load.');
      });
  }
  function paintRulings(list){
    body.innerHTML = '';
    if(!list.length){
      body.appendChild(el('p','note','No rulings have been published for this card.'));
    } else {
      var box = el('div','rulings');
      list.forEach(function(r){
        var row = el('div','ruling');
        row.appendChild(el('b', null, r.published_at));
        row.appendChild(el('span', null, r.comment));
        box.appendChild(row);
      });
      body.appendChild(box);
    }
    var link = el('a', 'btn ghost', 'Open on Scryfall');
    link.href = 'https://scryfall.com/card/' + (id || '');
    link.target = '_blank'; link.rel = 'noopener';
    link.style.cssText = 'width:100%;justify-content:center;margin-top:var(--s3);text-decoration:none';
    if(id) body.appendChild(link);
  }

  function showPrintings(){
    if(!id) return msg('This card came in by name only, so there is nothing to look up.');
    var key = d.n.toLowerCase();
    if(printCache[key]) return paintPrints(printCache[key]);
    msg('Looking up printings' + '\u2026');
    fetch(SCRY + '/cards/search?order=released&unique=prints&q='
          + encodeURIComponent('!"' + d.n + '"'))
      .then(function(r){ return r.json(); })
      .then(function(j){
        printCache[key] = (j.data || []).filter(function(c){
          return c.image_uris && c.image_uris.normal;
        });
        paintPrints(printCache[key]);
      })
      .catch(function(){
        msg(navigator.onLine ? 'Scryfall did not answer.' : 'No internet, so printings cannot load.');
      });
  }
  function paintPrints(list){
    body.innerHTML = '';
    if(!list.length) return body.appendChild(el('p','note','No other printings found.'));
    body.appendChild(el('p','note','Tap the printing you actually own. It changes every copy in the deck.'));
    var grid = el('div','cardlist');
    grid.style.marginTop = 'var(--s3)';
    list.slice(0,60).forEach(function(c){
      var w = el('button','printopt');
      var im = new Image();
      im.src = c.image_uris.normal; im.alt = c.set_name; im.loading = 'lazy';
      w.appendChild(im);
      w.appendChild(el('span', null, (c.set || '').toUpperCase() + '  ' + (c.released_at || '').slice(0,4)));
      if(cardId(d) === c.id) w.classList.add('on');
      w.onclick = function(){
        d.u = c.image_uris.normal;
        d.id = c.id;
        persistDeck();
        blip('act');
        closeLayer();
        render();
      };
      grid.appendChild(w);
    });
    body.appendChild(grid);
  }

  showRulings();
}
