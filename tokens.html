<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080B10">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Block, Motherbase's default theme. */
:root{
  --bg:#080B10; --bg2:#0E141D; --bg3:#131B26; --bg4:#1B2634;
  --line:#1E2A38; --line2:#2B3A4D;
  --ink:#DBE7F0; --ink2:#B8C9D8; --ink3:#7F93A8;
  --brass:#F0B323; --brass-soft:rgba(240,179,35,.12);
  --good:#6EE7A8; --wait:#FFB347; --bad:#FF6B81;
  --tap:44px; --r:6px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --t12:12px; --t14:14px; --t16:16px; --t20:20px; --t24:24px; --t32:32px; --t48:48px;
  --disp:'Chakra Petch',system-ui,sans-serif;
  --ui:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  --fast:.15s;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:var(--t14);line-height:1.45;min-height:100vh;
  padding:0 env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit}
.btn{min-height:var(--tap);min-width:var(--tap);padding:0 var(--s3);border-radius:var(--r);border:1px solid var(--line2);background:var(--bg3);
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:active{background:var(--bg4)}
.btn.gold{border-color:var(--brass);color:var(--brass);background:var(--brass-soft)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.bad{color:var(--bad);border-color:rgba(255,107,129,.4)}
.btn[disabled]{opacity:.4;pointer-events:none}
.ic{padding:0;width:var(--tap)}

/* Top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg2);border-bottom:1px solid var(--line);
  padding:calc(var(--s2) + env(safe-area-inset-top,0px)) var(--s4) var(--s2);display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.brand{font-family:var(--disp);font-weight:700;font-size:var(--t20);color:var(--brass);letter-spacing:.04em;display:flex;align-items:center;gap:var(--s2);text-decoration:none;min-height:var(--tap)}
.stats{display:flex;gap:var(--s5);flex:1;min-width:0;flex-wrap:wrap;align-items:center}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat b{font-family:var(--disp);font-size:var(--t24);font-weight:700}
.stat span{font-size:var(--t12);color:var(--ink3)}
.stat.hot b{color:var(--brass)}
.mods{display:flex;gap:var(--s2);flex-wrap:wrap}
.chip{min-height:32px;padding:0 var(--s3);border-radius:var(--r);border:1px solid var(--line2);background:var(--bg3);display:inline-flex;align-items:center;gap:6px;font-size:var(--t12);color:var(--ink2);font-weight:600;cursor:pointer;position:relative}
.chip::after{content:"";position:absolute;inset:-6px 0}
.chip i{font-style:normal;width:8px;height:8px;border-radius:50%;background:var(--brass)}
.actions{display:flex;gap:var(--s2)}

/* Board */
.board{min-height:calc(100vh - 90px);align-content:start;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:var(--s3);padding:var(--s4)}
.tile{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;position:relative}
.tile.sel{border-color:var(--brass)}
.art{position:relative;aspect-ratio:626/457;background:var(--bg3) center/cover no-repeat;cursor:pointer}
.art .shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(8,11,16,0) 40%,rgba(8,11,16,.92))}
.art .cnt{position:absolute;left:var(--s3);bottom:var(--s2);font-family:var(--disp);font-weight:700;font-size:var(--t48);line-height:1;color:var(--ink);text-shadow:0 2px 8px #000}
.art .cnt small{font-size:var(--t24);color:var(--ink2);margin-right:2px}
.art .pt{position:absolute;right:var(--s3);bottom:var(--s3);font-family:var(--disp);font-weight:700;font-size:var(--t24);background:rgba(8,11,16,.85);border:1px solid var(--line2);border-radius:var(--r);padding:0 var(--s2);line-height:1.4}
.art .pt.up{border-color:var(--good)}
.art .pt.down{border-color:var(--bad)}
.art .more{position:absolute;right:var(--s1);top:var(--s1);background:rgba(8,11,16,.75);border-color:transparent}
.art .tags{position:absolute;left:var(--s2);top:var(--s2);display:flex;gap:var(--s1);flex-wrap:wrap;max-width:75%}
.tag{font-size:var(--t12);font-weight:600;background:rgba(8,11,16,.85);border:1px solid var(--line2);border-radius:4px;padding:0 6px;color:var(--ink2)}
.tag.g{border-color:var(--good)}
.tag.w{border-color:var(--wait)}
.tname{padding:var(--s2) var(--s3) 0;font-weight:600;font-size:var(--t16);display:flex;justify-content:space-between;gap:var(--s2)}
.tname span:last-child{color:var(--ink3);font-size:var(--t12);font-weight:500;text-align:right;padding-top:3px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);padding:var(--s2) var(--s3) var(--s3)}
.half{border:1px solid var(--line);border-radius:var(--r);background:var(--bg3);padding:var(--s2);display:flex;flex-direction:column;gap:var(--s2)}
.half .hd{display:flex;align-items:baseline;justify-content:space-between}
.half .hd b{font-family:var(--disp);font-size:var(--t24);line-height:1}
.half .hd span{font-size:var(--t12);color:var(--ink3)}
.half.tp .hd b{color:var(--ink2)}
.half .row{display:flex;gap:var(--s1)}
.half .row .btn{flex:1;min-width:0;padding:0}
.qty{display:flex;gap:var(--s2);padding:0 var(--s3) var(--s3)}
.tapbox{padding:var(--s2) var(--s3) var(--s1)}
.tapbox .hd{display:flex;justify-content:space-between;color:var(--ink2);font-size:var(--t14)}
.tapbox .hd b{font-family:var(--disp);font-size:var(--t20);color:var(--ink)}
.tapbox input{width:100%}
.qty .btn{flex:1}
.empty{grid-column:1/-1;text-align:center;padding:var(--s6) var(--s4);color:var(--ink2)}
.empty p{margin:0 0 var(--s4);font-size:var(--t16)}
.quick{display:flex;flex-wrap:wrap;gap:var(--s2);justify-content:center;max-width:720px;margin:var(--s4) auto 0}

/* Panels */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;opacity:0;pointer-events:none;transition:opacity var(--fast)}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;z-index:21;background:var(--bg2);border:1px solid var(--line2);display:flex;flex-direction:column;
  top:0;right:0;bottom:0;width:min(440px,100%);border-radius:var(--r) 0 0 var(--r);transform:translateX(100%);transition:transform var(--fast) ease-out;
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
.panel.on{transform:none}
.panel.wide{width:min(760px,100%)}
@media (max-width:640px){
  .panel,.panel.wide{top:auto;left:0;width:100%;max-height:92vh;border-radius:var(--r) var(--r) 0 0;transform:translateY(100%)}
}
@media (prefers-reduced-motion:reduce){.panel,.scrim{transition:none}}
.ph{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s2) var(--s2) var(--s4);border-bottom:1px solid var(--line)}
.ph h2{margin:0;flex:1;font-family:var(--disp);font-size:var(--t20);font-weight:700;min-width:0;overflow-wrap:anywhere}
.pb{overflow:auto;padding:var(--s4);display:flex;flex-direction:column;gap:var(--s4);-webkit-overflow-scrolling:touch;flex:1}
.pf{padding:var(--s3) var(--s4);border-top:1px solid var(--line);display:flex;gap:var(--s2)}
.pf .btn{flex:1}
.sec{display:flex;flex-direction:column;gap:var(--s2)}
.sec>label,.lbl{font-size:var(--t12);color:var(--ink3);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.help{font-size:var(--t12);color:var(--ink3);margin:0}
.ctl{display:flex;align-items:center;gap:var(--s2)}
.num{width:76px;min-height:var(--tap);border-radius:var(--r);border:1px solid var(--line2);background:var(--bg);color:var(--ink);font-family:var(--disp);font-size:var(--t20);font-weight:700;text-align:center}
.txt{width:100%;min-height:var(--tap);border-radius:var(--r);border:1px solid var(--line2);background:var(--bg);color:var(--ink);font-size:var(--t16);padding:0 var(--s3)}
textarea.txt{padding:var(--s2) var(--s3);min-height:72px;resize:vertical;font-family:var(--ui)}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:var(--tap);background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--brass);margin-top:-11px;border:3px solid var(--bg2)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line2)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--brass);border:3px solid var(--bg2)}
.oracle{background:var(--bg3);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3);color:var(--ink2);white-space:pre-wrap;font-size:var(--t14)}
.math{font-family:var(--disp);font-size:var(--t14);color:var(--ink2)}
.math b{color:var(--ink);font-size:var(--t20)}
.ctr{display:flex;align-items:center;gap:var(--s2);background:var(--bg3);border:1px solid var(--line);border-radius:var(--r);padding:var(--s1) var(--s1) var(--s1) var(--s3)}
.ctr span{flex:1;font-weight:600;overflow-wrap:anywhere}
.ctr b{font-family:var(--disp);font-size:var(--t20);min-width:32px;text-align:center}
.seg{display:flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.seg button{flex:1;min-height:var(--tap);background:var(--bg3);border:0;border-right:1px solid var(--line2);font-weight:600;cursor:pointer;color:var(--ink2);padding:0 var(--s2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--brass-soft);color:var(--brass)}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:var(--s3)}
.res{background:var(--bg3);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column}
.res:active{border-color:var(--brass)}
.res .ra{aspect-ratio:626/457;background:var(--bg) center/cover no-repeat}
.res .rt{padding:var(--s2);display:flex;flex-direction:column;gap:2px}
.res .rt b{font-size:var(--t14)}
.res .rt span{font-size:var(--t12);color:var(--ink3)}
.res .rt em{font-style:normal;font-size:var(--t12);color:var(--ink2)}
.msg{color:var(--ink2);text-align:center;padding:var(--s5) 0}
.addhead{display:flex;gap:var(--s3);align-items:center}
.addhead .ra{width:120px;aspect-ratio:626/457;border-radius:var(--r);background:var(--bg3) center/cover no-repeat;flex:none}
.big{font-family:var(--disp);font-size:var(--t32);font-weight:700;color:var(--brass)}
.check{display:flex;align-items:center;gap:var(--s3);min-height:var(--tap);cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--brass)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}

/* Undo bar */
.deckbar{background:var(--bg2);border-bottom:1px solid var(--line);padding:var(--s2) var(--s4);display:flex;flex-direction:column;gap:var(--s2)}
.brow{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.brow.inplay .lbl{margin-right:var(--s1)}
.chip.on{border-color:var(--brass);color:var(--ink)}
.pl{min-height:var(--tap);min-width:72px;border-radius:var(--r);border:1px solid var(--line2);background:var(--bg3);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px var(--s3);cursor:pointer;line-height:1.1}
.pl span{font-size:var(--t12);color:var(--ink3);max-width:110px;overflow-wrap:anywhere;text-align:center}
.pl b{font-family:var(--disp);font-size:var(--t20)}
.pl em{font-style:normal;font-size:var(--t12);color:var(--wait)}
.pl.dead{border-color:var(--bad)}
.cue{display:flex;flex-direction:column;gap:var(--s2);border-bottom:1px solid var(--line);padding-bottom:var(--s3)}
.cardrow{align-items:flex-start;padding:var(--s2) 0;border-bottom:1px solid var(--line)}
.cardrow input{margin-top:4px;flex:none}
.undo{position:fixed;left:50%;bottom:calc(var(--s4) + env(safe-area-inset-bottom,0));transform:translate(-50%,200%);z-index:30;background:var(--bg4);border:1px solid var(--line2);
  border-radius:var(--r);padding:var(--s1) var(--s1) var(--s1) var(--s4);display:flex;align-items:center;gap:var(--s3);transition:transform var(--fast);max-width:calc(100% - 32px)}
.undo.on{transform:translate(-50%,0)}
@media (hover:hover){.btn:hover{border-color:var(--ink3)}.res:hover{border-color:var(--line2)}}
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="./" aria-label="Back to Magic home">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>TOKENS
  </a>
  <div class="stats" id="stats"></div>
  <div class="actions">
    <button class="btn" id="bUndo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Undo</button>
    <button class="btn" id="bTurn" title="Untap everything and clear end of turn effects"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>New turn</button>
    <button class="btn gold" id="bAdd"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add token</button>
    <button class="btn ic" id="bMenu" aria-label="Table settings"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
  </div>
</header>

<nav class="deckbar" id="deckbar"></nav>
<main class="board" id="board"></main>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true">
  <div class="ph"><h2 id="pTitle"></h2><button class="btn ic ghost" id="pClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="pb" id="pBody"></div>
  <div class="pf" id="pFoot"></div>
</aside>

<div class="undo" id="undoBar"><span id="undoMsg"></span><button class="btn gold" id="undoBtn">Undo</button></div>

<script src="decks.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const KEY = 'tokens.v1';
const COMMON = ['Treasure','Food','Clue','Blood','Map','Goblin','Soldier','Zombie','Spirit','Saproling','Elf Warrior','Thopter','Beast','Cat','Squirrel','Human'];

/* ---------- State ---------- */
let S = load();
function blank(){ return {inPlay:{}, players:[{name:'You', life:40, poison:0, cmd:{}}], arts:{}, groups:[], doublers:0, ctrDoublers:0, anthem:{p:0,t:0}, recent:[], turn:1, awake:false, nextId:1, deck:'', real:{}}; }
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && Array.isArray(s.groups)) return Object.assign(blank(), s); }catch(e){}
  return blank();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const hist = [];
function snap(){ hist.push(JSON.stringify(S)); if(hist.length > 40) hist.shift(); }
function undo(){
  if(!hist.length) return;
  S = JSON.parse(hist.pop()); save(); hideUndo();
  if(openGroupId && !grp(openGroupId)) closePanel();
  render(); if(openGroupId) groupPanel(openGroupId, true);
}
/* Every change goes through act(): one undo step, saved, drawn. */
function act(fn, undoText){ snap(); fn(); save(); render(); if(undoText) showUndo(undoText); }

/* ---------- Token maths ---------- */
const grp = id => S.groups.find(g => g.id === id);
const numOr = (v, d) => { const n = parseInt(v, 10); return isNaN(n) ? d : n; };
function pt(g){
  const a = g.creature ? S.anthem : {p:0,t:0};
  const e = g.creature ? engineAnthem(g) : {p:0,t:0};
  const p = numOr(g.basePow, 0) + g.plus + g.temp.p + a.p + e.p;
  const t = numOr(g.baseTou, 0) + g.plus + g.temp.t + a.t + e.t;
  return {p, t, changed: g.plus || g.temp.p || g.temp.t || a.p || a.t || e.p || e.t, down: (p < numOr(g.basePow,0)) || (t < numOr(g.baseTou,0))};
}
const hasHaste = g => g.haste || inPlayKinds('haste').some(k => typeMatch(g, k.type));
function ready(g){
  if(!g.creature) return g.count - g.tapped;
  const untapped = g.count - g.tapped;
  const sick = hasHaste(g) ? 0 : Math.min(g.sick, untapped);
  return Math.max(0, untapped - sick);
}

/* ---------- Cards in play: read off their own text ---------- */
// Each deck card is read once into "kinds": what it does to tokens and counters. Only cards marked in play count.
const W2N = {a:1, an:1, one:1, two:2, three:3, four:4, five:5, six:6, x:'X'};
const wn = w => { w = String(w).toLowerCase(); return W2N[w] != null ? W2N[w] : (parseInt(w, 10) || 1); };
function readKinds(oracle, name){
  const kinds = [];
  const self = (name || '').split(',')[0].split(' // ')[0];
  (oracle || '').split('\n').forEach(line => {
    const L = line.replace(/\([^)]*\)/g, '').trim(); if(!L) return;
    if(/^If an opponent/i.test(L)) return;
    // Token replacement: Doubling Season, Parallel Lives, Primal Vigor, Peregrin Took
    if(/tokens? would be created|would create one or more tokens/i.test(L)){
      const f = /three times that many/i.test(L) ? 3 : /twice that many/i.test(L) ? 2 : 0;
      if(f) kinds.push({k:'tokX', f, creatureOnly: /creature tokens/i.test(L)});
      const ex = L.match(/plus an additional (\w[\w ]*?) token/i); if(ex) kinds.push({k:'tokExtra', what: ex[1]});
      if(/that many plus one/i.test(L)) kinds.push({k:'tokAdd', n:1});
    }
    // Counter replacement: Vorinclex, Hardened Scales, Ozolith, Kami, Branching Evolution, The Earth Crystal
    if(/counters? would be put|would put one or more counters|put one or more counters on a permanent/i.test(L) && /instead/i.test(L)){
      const plusOnly = /\+1\/\+1 counters? would|would put one or more \+1\/\+1/i.test(L) || (/\+1\/\+1/.test(L) && !/each of those kinds/i.test(L));
      const others = /another creature/i.test(L);
      if(/twice that many/i.test(L)) kinds.push({k:'ctrX', f:2, plusOnly, others});
      if(/that many plus one/i.test(L)) kinds.push({k:'ctrAdd', n:1, plusOnly, others});
    }
    // Enters with counters: Renata, Arwen
    let m = L.match(/Each other creature you control enters with (?:an additional|a number of additional) \+1\/\+1 counters?(?: on it)?(?: equal to ([^.]+))?/i);
    if(m) kinds.push({k:'enters', n: m[1] ? 'V' : 1, what: m[1] || ''});
    m = L.match(/Whenever a creature you control enters, draw a card if its power is (\d+) or greater\. Otherwise, put (\w+) \+1\/\+1 counters on it/i);
    if(m) kinds.push({k:'entersIf', below:+m[1], n: wn(m[2])});
    // Anthems and haste, only the plain sentence
    L.split(/(?<=\.)\s+/).forEach(s => {
      let a = s.match(/^(Other )?(creature|[A-Z][a-z]+?)s? you control get \+(\d+)\/\+(\d+)(?: and have [^.]+)?\.?$/i);
      if(a) kinds.push({k:'anthem', type: a[2], p:+a[3], t:+a[4]});
      a = s.match(/^(?:Other )?(creature|[A-Z][a-z]+?)s? you control (?:have|gain) haste\.?$/i);
      if(a) kinds.push({k:'haste', type: a[1]});
    });
    // Shared Animosity
    if(/for each other attacking creature that shares a creature type/i.test(L)) kinds.push({k:'animosity'});
    // Death triggers that hit someone: Pashalik Mons
    m = L.match(/Whenever [^,]*?(?:another )?([A-Z][a-z]+?)s? you control dies, [^.]*?deals (\d+) damage/);
    if(m) kinds.push({k:'death', type:m[1], dmg:+m[2]});
    // Triggers and abilities the app can do for you
    const when = /^At the beginning of your upkeep/i.test(L) ? 'upkeep' : /^At the beginning of combat/i.test(L) ? 'combat' : /^At the beginning of your end step/i.test(L) ? 'end'
      : /^(Landfall|Whenever a land)/i.test(L) ? 'landfall' : /^Whenever [^,]*attacks?\b/i.test(L) ? 'attack' : /^\{[^:]*\}[^:]*:/.test(L) ? 'ability' : '';
    if(!when) return;
    const t = {k:'trig', when, text: L, monarch: /if you(?:'|’)re the monarch/i.test(L)};
    let d = L.match(/double the number of \+1\/\+1 counters on (each creature you control|target creature|each of those creatures|this creature)/i);
    if(d && !/this creature/i.test(d[1])) t.act = {do:'dbl', all: /each creature/i.test(d[1])};
    d = !t.act && L.match(/put (a|an|one|two|three|X|\d+) \+1\/\+1 counters? on (each creature you control|target creature(?: you control)?)/i);
    if(d) t.act = {do:'put', n: wn(d[1]), all: /each/i.test(d[2]), xWhat: (L.match(/where X is ([^.]+)/i) || [])[1]};
    d = !t.act && L.match(/create (a|an|one|two|three|X|\d+) (?:tapped )?(\d+\/\d+ )?[^.]*?token/i);
    if(d && !/copy of/i.test(L)) t.act = {do:'token', n: wn(d[1]), tapped: /tapped/i.test(L), attacking: /attacking/i.test(L)};
    if(t.act || when !== 'ability') kinds.push(t);
  });
  return kinds;
}
function deckCard(name){ return deckData && deckData.cards.find(c => c.name === name); }
function inPlayCards(){ return deckData ? deckData.cards.filter(c => S.inPlay && S.inPlay[c.name]) : []; }
function inPlayKinds(k){ const out = []; inPlayCards().forEach(c => c.kinds.forEach(x => { if(x.k === k) out.push(Object.assign({card:c.name}, x)); })); return out; }

/* How many tokens an effect really makes. */
function tokenMath(tpl, n){
  let f = Math.pow(2, S.doublers); const why = [];
  if(S.doublers) why.push('x' + f + ' (doublers you set)');
  let add = 0; inPlayKinds('tokAdd').forEach(k => { add += k.n; why.unshift('+' + k.n + ' ' + k.card); });
  inPlayKinds('tokX').forEach(k => { if(!k.creatureOnly || tpl.creature){ f *= k.f; why.push('x' + k.f + ' ' + k.card); } });
  const extras = inPlayKinds('tokExtra').map(k => ({what:k.what, card:k.card}));
  return {total: (n + add) * f, f, add, why, extras};
}
const mult = () => tokenMath({creature:true}, 1).f;
/* How many counters really go on. Pluses first, then doublers: the order that gives you the most. */
function counterMath(n, plusOne = true, other = true){
  let add = 0, f = Math.pow(2, S.ctrDoublers || 0); const why = [];
  inPlayKinds('ctrAdd').forEach(k => { if((plusOne || !k.plusOnly) && (other || !k.others)){ add += k.n; why.push('+' + k.n + ' ' + k.card); } });
  if(S.ctrDoublers) why.push('x' + f + ' (doublers you set)');
  inPlayKinds('ctrX').forEach(k => { if((plusOne || !k.plusOnly) && (other || !k.others)){ f *= k.f; why.push('x' + k.f + ' ' + k.card); } });
  return {total: n > 0 ? (n + add) * f : 0, why};
}
const cmult = () => counterMath(1).total;
/* Counters a new creature token arrives with: Renata and Arwen together, Tribute to the World Tree on its own. */
function entersMath(tpl){
  if(!tpl.creature) return {total:0, why:[]};
  let base = 0; const why = [];
  inPlayKinds('enters').forEach(k => { const v = k.n === 'V' ? numOr((S.inPlay[k.card] || {}).v, 0) : k.n; if(v){ base += v; why.push(k.card + ' ' + v); } });
  let total = base ? counterMath(base).total : 0;
  inPlayKinds('entersIf').forEach(k => { if(numOr(tpl.basePow, 0) < k.below){ const c = counterMath(k.n).total; total += c; why.push(k.card + ' ' + c); } });
  return {total, why};
}
function clampG(g){
  g.count = Math.max(0, g.count|0);

  g.sick = Math.min(Math.max(0, g.sick|0), g.count);
}

let lastCall = 0;
async function sf(url){
  const wait = Math.max(0, lastCall + 110 - Date.now()); lastCall = Date.now() + wait;
  if(wait) await new Promise(r => setTimeout(r, wait));

function numCtl(id, val, min, max){
  return `<div class="ctl"><button class="btn ic" data-step="${id}" data-d="-1" aria-label="Less">${I.minus}</button>
    <input type="range" id="${id}R" min="${min}" max="${max}" value="${Math.min(Math.max(val, min), max)}">

    <input class="num" id="${id}" inputmode="numeric" value="${val}" aria-label="Type a number"></div>`;
}
/* Wire a numCtl: onChange(value) runs on every change; the slider grows when a typed number passes its end. */
function wireNum(id, min, onChange, getMax){
  const r = $('#' + id + 'R'), t = $('#' + id);
  const setVal = (v, from) => {
    v = Math.max(min, v);
    if(getMax){ const m = getMax(); if(v > m) v = m; }
    if(v > +r.max) r.max = Math.ceil(v * 1.5 / 10) * 10;
    if(from !== 'r') r.value = v;
    if(from !== 't') t.value = v;
    onChange(v);
  };
  r.addEventListener('input', () => setVal(+r.value, 'r'));
  t.addEventListener('input', () => { const n = parseInt(t.value.replace(/[^\d-]/g, ''), 10); if(!isNaN(n)) setVal(n, 't'); });
  t.addEventListener('focus', () => t.select());
  t.addEventListener('blur', () => { t.value = r.value === t.value ? t.value : t.value; });
  document.querySelectorAll(`[data-step="${id}"]`).forEach(b => b.onclick = () => setVal((parseInt(t.value, 10) || 0) + (+b.dataset.d), ''));
  return setVal;
}

  }catch(e){}
  return deckList = out;
}
async function collection(ids){
  const got = [];
  for(let i = 0; i < ids.length; i += 75){
    const r = await fetch('https://api.scryfall.com/cards/collection', {method:'POST', headers:{'Content-Type':'application/json', Accept:'application/json'},
      body: JSON.stringify({identifiers: ids.slice(i, i + 75).map(id => ({id}))})}).then(r => r.json());
    got.push(...(r.data || []));
    await new Promise(r => setTimeout(r, 110));
  }
  return got;
}
/* One deck read down to what a token board needs: its creatures, the tokens it makes and who makes them, its copy effects. */
async function loadDeck(id){
  const cacheKey = 'tokens.deck.' + id;
  try{ const c = JSON.parse(localStorage.getItem(cacheKey)); if(c && c.v === 4) return deckData = c; }catch(e){}
  const all = await listDecks(); const d = all.find(x => x.id === id); if(!d) throw new Error('Deck not found');
  let cards; const sideNames = new Set();
  if(d.built){
    d.built.cards.forEach(c => { if(c.side) sideNames.add(c.n); });
    cards = await collection(d.built.cards.map(c => c.id));
  } else {
    (d.mox.side || []).forEach(c => sideNames.add(c.n));
    const ids = [...d.mox.commanders, ...d.mox.main, ...(d.mox.side || [])].map(c => c.sid).filter(Boolean);
    cards = await collection(ids);
  }
  const tokIds = new Set(), makers = {};
  cards.forEach(c => (c.all_parts || []).forEach(p => { if(p.component === 'token'){ tokIds.add(p.id); (makers[p.id] = makers[p.id] || []).push(c.name); } }));
  const toks = await collection([...tokIds]);
  const tokens = [], seen = {};
  toks.filter(t => t.name !== 'Copy').forEach(t => {
    const tpl = tplFromCard(t);
    const by = makers[t.id] || [];
    if(seen[tpl.key]){ seen[tpl.key].makers = [...new Set(seen[tpl.key].makers.concat(by))]; return; }
    tpl.makers = by; seen[tpl.key] = tpl; tokens.push(tpl);
  });
  const creatures = cards.filter(c => /Creature/.test(c.type_line || (c.card_faces || [{}])[0].type_line || '')).map(tplFromCard);
  const copies = cards.map(c => {
    const o = c.oracle_text || (c.card_faces || []).map(f => f.oracle_text).join('\n');
    if(!/(token that's a copy|tokens that are copies|token copy|copy of (that|target|it|this|exiled)[^.]*token)/i.test(o)) return null;
    const m = o.match(/except (?:it'?s|it is|they'?re|they are|it has|it gains)\b([^.]*)/i);
    return {name:c.name, oracle:o, except: m ? m[0] : ''};
  }).filter(Boolean);
  const oracles = {}; cards.forEach(c => { oracles[c.name] = c.oracle_text || ''; });
  // Every card, side deck too, read for what it does to tokens and counters.
  const slim = cards.map(c => { const t = tplFromCard(c); const o = c.oracle_text || (c.card_faces || []).map(f => f.oracle_text).join('\n');
    return Object.assign(t, {oracle:o, side: sideNames.has(c.name), kinds: readKinds(o, c.name), toks: (c.all_parts || []).filter(p => p.component === 'token').map(p => p.id)}); });
  const tokById = {}; toks.forEach(x => { tokById[x.id] = tplFromCard(x).key; });
  slim.forEach(c => { c.toks = [...new Set(c.toks.map(i => tokById[i]).filter(Boolean))]; });
  deckData = {v:4, id, name:d.name, tokens, creatures, copies, oracles, cards: slim};
  try{ localStorage.setItem(cacheKey, JSON.stringify(deckData)); }catch(e){}
  return deckData;
}
/* A copy with the effect's changes: "except it's a 4/4 black Zombie", "an enchantment and loses all other card types". */
function applyExcept(t, eff){
  const c = Object.assign({}, t, {copy:true});
  if(!eff){ c.key = t.key + '|copy'; return c; }
  const ex = eff.except || '';
  c.key = t.key + '|' + eff.name; c.copyBy = eff.name;
  const ptm = ex.match(/(\d+)\/(\d+)/); if(ptm){ c.basePow = ptm[1]; c.baseTou = ptm[2]; }
  const subs = (ex.match(/\b[A-Z][a-z]+\b/g) || []).filter(w => !/^(It|They|White|Blue|Black|Red|Green|Colorless|Legendary)$/.test(w));
  const cardT = (ex.match(/\b(enchantment|artifact)\b/gi) || []).map(w => w[0].toUpperCase() + w.slice(1).toLowerCase());
  let [sup, sub] = c.type.split(/\s+—\s+/);
  if(/loses all other card types/i.test(ex)){ sup = cardT.join(' '); c.creature = /creature/i.test(ex); }
  else if(cardT.length) sup = cardT.join(' ') + ' ' + sup;
  if(/not legendary|isn't legendary|nonlegendary/i.test(ex)) sup = sup.replace('Legendary ', '');
  if(subs.length) sub = /in addition/i.test(ex) && sub ? sub + ' ' + subs.join(' ') : subs.join(' ');
  c.type = 'Token ' + sup.trim() + (sub ? ' — ' + sub : '');
  if(/haste/i.test(ex)) c.haste = true;
  if(c.creature && !/Creature/.test(c.type)) c.type = c.type.replace('Token ', 'Token Creature ');
  c.oracle = (t.oracle ? t.oracle + '\n\n' : '') + eff.name + ': ' + ex;
  return c;
}

/* ---------- Camera: read a card's name ---------- */
const TESS = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
let ocrP = null;
function loadOCR(){
  if(!ocrP) ocrP = new Promise((res, rej) => { const s = document.createElement('script'); s.src = TESS; s.onload = res; s.onerror = () => { ocrP = null; rej(new Error('The reader did not load')); }; document.head.appendChild(s); })
    .then(() => Tesseract.createWorker('eng'));
  return ocrP;
}
function lev(a, b){
  const m = a.length, n = b.length; if(!m || !n) return Math.max(m, n);
  let prev = Array.from({length:n + 1}, (_, j) => j);
  for(let i = 1; i <= m; i++){ const cur = [i]; for(let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
const norm = s => s.toLowerCase().replace(/[^a-z ]/g, '').replace(/\s+/g, ' ').trim();
let stream = null;
function stopCam(){ if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } }
/* onPick(template) gets the card the camera read. pool: deck creatures to match first. */
function scanPanel(onPick, pool, back){
  openPanel('Scan the card', `
    <div style="position:relative;border-radius:6px;overflow:hidden;background:#000">
      <video id="cam" playsinline muted autoplay style="width:100%;display:block"></video>
      <div style="position:absolute;left:6%;right:6%;top:6%;height:16%;border:2px solid var(--brass);border-radius:6px"></div>
    </div>
    <p class="help">Fill the frame with the card, its name inside the gold box.</p>
    <div class="msg" id="camMsg" style="padding:8px 0"></div>
    <div id="camRes"></div>`,
    `<button class="btn" id="camBack">Back</button><button class="btn gold" id="camGo">Read the name</button>`);
  const panelClose = $('#pClose').onclick;
  $('#camBack').onclick = () => { stopCam(); back(); };
  const msg = t => { $('#camMsg').textContent = t; };
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment', width:{ideal:1920}}, audio:false})
    .then(s => { stream = s; $('#cam').srcObject = s; msg(''); })
    .catch(() => msg('The camera did not open. Allow it for this site in Settings, Safari, Camera.'));
  loadOCR().catch(() => {});
  $('#camGo').onclick = async () => {
    const v = $('#cam'); if(!v.videoWidth){ msg('No picture from the camera yet.'); return; }
    const go = $('#camGo'); go.disabled = true; go.textContent = 'Reading…';
    try{
      const W = v.videoWidth, H = v.videoHeight, cv = document.createElement('canvas');
      const sx = W * .06, sy = H * .06, sw = W * .88, sh = H * .16;
      cv.width = 1200; cv.height = Math.round(1200 * sh / sw);
      const x = cv.getContext('2d'); x.filter = 'grayscale(1) contrast(1.6)'; x.drawImage(v, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
      const w = await loadOCR();
      const {data} = await w.recognize(cv);
      const lines = data.text.split('\n').map(l => l.replace(/[^A-Za-z ',-]/g, '').trim()).filter(l => l.length > 2);
      let best = null;
      if(pool && pool.length){
        lines.forEach(l => { const nl = norm(l); pool.forEach(t => { const nn = norm(t.name.split(' // ')[0]); const sc = 1 - lev(nl.slice(0, nn.length + 3), nn) / Math.max(nn.length, 1); if(!best || sc > best.sc) best = {sc, t}; }); });
        if(best && best.sc < .55) best = null;
      }
      if(!best){
        for(const l of lines){ try{ const c = await sf('https://api.scryfall.com/cards/named?fuzzy=' + encodeURIComponent(l)); best = {t: tplFromCard(c)}; break; }catch(e){} }
      }
      if(!best){ msg('No card name read. Hold it closer, out of glare, and try again.'); return; }
      stopCam(); onPick(best.t);
    }catch(e){ msg(e.message); }
    finally{ if($('#camGo')){ go.disabled = false; go.textContent = 'Read the name'; } }
  };
}

const COLORS = {white:'w', blue:'u', black:'b', red:'r', green:'g', colorless:'c'};
function tokenQuery(q){
  // Plain words a player says, turned into Scryfall's search words.
  const parts = [];
  q.toLowerCase().split(/\s+/).filter(Boolean).forEach(w => {
    const m = w.match(/^(\d+|x|\*)\/(\d+|x|\*)$/);
    if(m){ if(/\d/.test(m[1])) parts.push('pow=' + m[1]); if(/\d/.test(m[2])) parts.push('tou=' + m[2]); return; }
    if(COLORS[w]){ parts.push(w === 'colorless' ? 'c=c' : 'c>=' + COLORS[w]); return; }
    if(/^(flying|haste|vigilance|trample|lifelink|deathtouch|menace|reach|indestructible|hexproof|defender)$/.test(w)){ parts.push('keyword:' + w); return; }
    parts.push(w);
  });
  return 't:token ' + parts.join(' ');
}

async function runSearch(){

      cards = j.data;
      // A name match first: "Treasure" should open with Treasure, not Treasure Map.

    } else if(searchMode === 'copy'){
      const j = await sf('https://api.scryfall.com/cards/search?unique=cards&q=' + encodeURIComponent(q + ' -t:token'));
      cards = j.data.slice(0, 40);
    } else {
      const c = await sf('https://api.scryfall.com/cards/named?fuzzy=' + encodeURIComponent(q));
      const parts = (c.all_parts || []).filter(p => p.component === 'token');
      if(seq !== searchSeq) return;
      if(!parts.length){ out.innerHTML = `<div class="msg">${esc(c.name)} makes no tokens Scryfall knows of.</div>`; return; }

      const j = await fetch('https://api.scryfall.com/cards/collection', {method:'POST', headers:{'Content-Type':'application/json', Accept:'application/json'}, body: JSON.stringify({identifiers: ids})}).then(r => r.json());
      cards = j.data || [];
      const seen = new Set(); cards = cards.filter(x => !seen.has(x.oracle_id) && seen.add(x.oracle_id));
      cards.unshift(null); cards.makerName = c.name;
    }

    const tpls = cards.filter(Boolean).map(tplFromCard).filter(t => { const k = [t.name, t.type, t.basePow, t.baseTou, t.oracle].join('|'); return !look.has(k) && look.add(k); });
    out._tpls = tpls;
    out.innerHTML = head + `<div class="results">${tpls.map((t, i) => `<button class="res" data-i="${i}">
      <div class="ra" style="background-image:url('${esc(t.art)}')"></div>
      <div class="rt"><b>${esc(t.name)}${t.creature ? ' ' + esc(t.basePow) + '/' + esc(t.baseTou) : ''}</b><span>${esc(t.type)}</span>${t.oracle ? `<em>${esc(t.oracle.length > 90 ? t.oracle.slice(0, 88) + '…' : t.oracle)}</em>` : ''}</div>
    </button>`).join('')}</div>`;
    out.onclick = e => { const b = e.target.closest('.res'); if(b) addPanel(out._tpls[+b.dataset.i]); };
  }catch(err){

  }
}

// Read off the card that makes the token, so Krenko and anything worded like him counts for you.
function countRule(t){

  for(const m of t.makers){

    if(r) return {maker:m, word:r[1]};
  }
  return null;
}

function wireCountHelp(t, setN){

  wireNum('aR', 0, v => { real = v; S.real = S.real || {}; S.real[r.word] = v; save(); $('#aX').textContent = onBoard(r.word) + v; });

/* ---------- Making tokens: one path for every button ---------- */
function makeText(t, n){
  const m = tokenMath(t, n), e = entersMath(t);
  let h = m.why.length ? `${n} ${m.why.map(esc).join(' ')} = <b>${m.total}</b> tokens` : `<b>${m.total}</b> token${m.total === 1 ? '' : 's'}`;
  if(m.extras.length) h += `<br>Plus ${m.extras.map(x => `${tokenMath({creature:false}, 1).total} ${esc(x.what)} (${esc(x.card)})`).join(', ')}`;
  if(e.total) h += `<br>Each arrives with <b>${e.total}</b> +1/+1 counters (${e.why.map(esc).join(', ')})`;
  return h;
}
const tplCache = {};
async function tokenByName(name){
  if(tplCache[name]) return tplCache[name];
  const j = await sf('https://api.scryfall.com/cards/search?unique=cards&q=' + encodeURIComponent('t:token !"' + name + '"'));
  return tplCache[name] = tplFromCard(j.data[0]);
}
/* Put n tokens' worth on the table: doublers, counters they arrive with, extra tokens like Peregrin's Food. */
function makeTokens(t, n, tapped, attacking, quiet, noExtra){
  const m = tokenMath(t, n), plus = entersMath(t).total;
  let target = null;
  act(() => {
    // Same token, same counters, nothing else on it: joins the pile already there.
    target = S.groups.find(g => g.key === t.key && g.plus === plus && !g.temp.p && !g.temp.t && !Object.values(g.counters).some(Boolean));
    if(!target){
      target = Object.assign({}, t, {id: S.nextId++, count:0, tapped:0, sick:0, plus, temp:{p:0,t:0}, counters:{}, note:''});
      delete target.makers;
      S.groups.push(target);
    }
    target.count += m.total; target.sick += m.total; if(tapped) target.tapped += m.total;
    clampG(target);
    if(!t.copy || t.copyBy) S.recent = [t].concat(S.recent.filter(r => r.key !== t.key)).slice(0, 12);
  }, quiet ? null : `Made ${m.total} ${t.name}${plus ? ' with ' + plus + ' counters each' : ''}${attacking ? ', tapped and attacking' : ''}.`);
  // The extra token is part of the same event, so it is not given another extra.
  if(!noExtra) m.extras.forEach(x => tokenByName(x.what).then(et => makeTokens(et, 1, false, false, true, true)).catch(() => {}));
  return m.total;
}

function smallStep(id, v){ return `<div class="ctl"><button class="btn ic" data-ss="${id}" data-d="-1" aria-label="Less">${I.minus}</button><input class="num" id="${id}" inputmode="numeric" value="${sign(v)}" aria-label="Type a number"><button class="btn ic" data-ss="${id}" data-d="1" aria-label="More">${I.plus}</button></div>`; }
function wireSmall(id, fn){
  const t = $('#' + id); if(!t) return;
  const cur = () => parseInt(t.value.replace(/[^\d-]/g, ''), 10) || 0;
  document.querySelectorAll(`[data-ss="${id}"]`).forEach(b => b.onclick = () => { const v = cur() + (+b.dataset.d); t.value = sign(v); fn(v); refreshOpen(); });
  t.addEventListener('focus', () => t.select());
  t.addEventListener('change', () => { const v = cur(); t.value = sign(v); fn(v); refreshOpen(); });
}
const refreshOpen = () => { if(openGroupId) groupPanel(openGroupId, true); };

// A photo shrunk to 720px wide, so dozens fit in the iPad's storage for this page.
function shrinkPic(file){
  return new Promise((res, rej) => {
    const img = new Image(); img.onload = () => {
      const W = Math.min(720, img.width), H = Math.round(img.height * W / img.width);
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      cv.getContext('2d').drawImage(img, 0, 0, W, H); URL.revokeObjectURL(img.src); res(cv.toDataURL('image/jpeg', .8));
    }; img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}

    <input class="txt" id="cfQ" placeholder="Find a card" autocomplete="off">

    ${group('Changes counters', c => c.kinds.some(k => /^ctr|^enters/.test(k.k)) && !c.kinds.some(k => /^tok/.test(k.k)))}
    ${group('Pumps or haste', c => c.kinds.some(k => /anthem|haste|animosity/.test(k.k)) && !c.kinds.some(k => /^tok|^ctr|^enters/.test(k.k)))}
    ${group('Triggers the app can do', c => c.kinds.every(k => /trig|death/.test(k.k)))}

function sumKinds(c){
  return c.kinds.map(k => ({tokX:`tokens x${k.f}${k.creatureOnly ? ' (creatures)' : ''}`, tokAdd:'tokens +1', tokExtra:`plus a ${k.what}`, ctrX:`${k.plusOnly ? '+1/+1 ' : ''}counters x${k.f}`, ctrAdd:`${k.plusOnly ? '+1/+1 ' : ''}counters +1${k.others ? ' (others)' : ''}`,
    enters:`creatures arrive with ${k.n === 'V' ? k.what : '1'} counter${k.n === 1 ? '' : 's'}`, entersIf:`small creatures arrive with ${k.n} counters`, anthem:`${k.type}s +${k.p}/+${k.t}`, haste:`${k.type}s have haste`, animosity:'attackers pump each other',
    death:`${k.type}s dying deal ${k.dmg}`, trig: k.when + (k.act ? ': ' + ({dbl:'double counters', put:'put counters', token:'make tokens'}[k.act.do]) : ' reminder')}[k.k])).filter(Boolean).join(' · ');
}
function setInPlay(name, on){
  act(() => { S.inPlay = S.inPlay || {}; if(on) S.inPlay[name] = S.inPlay[name] || {}; else delete S.inPlay[name]; }, `${name.split(',')[0]} ${on ? 'in play' : 'left play'}.`);
}
/* One card: from the camera, the In play strip or a search. Everything it can do for the token board. */

  const c = deckCard(name); if(!c){ closePanel(); return; }
  const on = !!S.inPlay[c.name];
  const toks = c.toks.map(k => deckData.tokens.find(t => t.key === k)).filter(Boolean);
  const trigs = c.kinds.filter(k => k.k === 'trig' && k.act);
  const needV = c.kinds.find(k => k.k === 'enters' && k.n === 'V');
  const copies = c.creature ? deckData.copies : [];
  openPanel(c.name, `
    <div class="addhead"><div class="ra" style="background-image:url('${esc(c.art)}')"></div><div><div class="help">${esc(c.type)}${c.side ? ' · Side deck' : ''}</div>${c.kinds.length ? `<div class="help">${esc(sumKinds(c))}</div>` : ''}</div></div>
    <div class="oracle">${esc(c.oracle)}</div>
    ${c.kinds.length ? `<button class="btn ${on ? '' : 'gold'}" id="csIn">${on ? 'It left play' : 'Mark it in play'}</button>` : ''}
    ${needV && on ? `<div class="sec"><label>${esc(needV.what)}</label>${numCtl('csV', numOr(S.inPlay[c.name].v, 0), 0, 12)}</div>` : ''}
    ${trigs.map((k, i) => `<button class="btn" data-tr="${i}">${esc(trigLabel(c, k))}</button>`).join('')}
    ${toks.length ? `<div class="lbl">Tokens it makes</div><div class="results">${toks.map((t, i) => `<button class="res" data-tk="${i}"><div class="ra" style="background-image:url('${esc(t.art)}')"></div><div class="rt"><b>${esc(t.name)}${t.creature ? ' ' + esc(t.basePow) + '/' + esc(t.baseTou) : ''}</b></div></button>`).join('')}</div>` : ''}
    ${copies.length ? `<div class="lbl">Bring it back as a token</div>${copies.map((e, i) => `<button class="btn" style="justify-content:flex-start;white-space:normal;text-align:left;padding:8px 12px" data-cp="${i}"><span><b>${esc(e.name)}</b>${S.inPlay[e.name] ? ' · in play' : ''}<br><span class="help">${esc(e.except || 'A plain copy')}</span></span></button>`).join('')}` : ''}
  `, `<button class="btn" id="csDone">Done</button>`);
  if($('#csIn')) $('#csIn').onclick = () => { setInPlay(c.name, !on); cardSheet(c.name); };
  if(needV && on) wireNum('csV', 0, v => { S.inPlay[c.name].v = v; save(); render(); });
  document.querySelectorAll('[data-tr]').forEach(b => b.onclick = () => runTrig(c, trigs[+b.dataset.tr]));
  document.querySelectorAll('[data-tk]').forEach(b => b.onclick = () => addPanel(Object.assign({}, toks[+b.dataset.tk], {makers:[c.name]})));
  document.querySelectorAll('[data-cp]').forEach(b => b.onclick = () => addPanel(applyExcept(c, copies[+b.dataset.cp])));
  $('#csDone').onclick = closePanel;
}

/* ---------- Triggers ---------- */
function trigLabel(c, k){
  const n = c.name.split(',')[0], a = k.act;
  if(k.monarch && !S.monarch && a.do === 'dbl') return `${n}: no doubling, you are not the monarch`;
  if(a.do === 'dbl') return `${n}: double the counters on ${a.all ? 'every creature token' : 'one pile'}`;
  if(a.do === 'put') return `${n}: put ${a.n === 'X' ? 'X' : a.n} counter${a.n === 1 ? '' : 's'} on ${a.all ? 'every creature token' : 'one pile'}`;
  if(a.do === 'token') return `${n}: make ${a.n === 'X' ? 'X' : a.n} ${(deckData.tokens.find(t => t.key === c.toks[0]) || {name:'token'}).name}${a.attacking ? ', tapped and attacking' : a.tapped ? ', tapped' : ''}`;
  return n;
}
function runTrig(c, k, back){
  const a = k.act, creaturePiles = S.groups.filter(g => g.creature && g.count);
  if(k.monarch && !S.monarch && a.do === 'dbl'){ if(back) back(); else closePanel(); return; }
  if(a.do === 'token'){
    const t = deckData.tokens.find(x => x.key === c.toks[0]); if(!t){ cardSheet(c.name); return; }
    if(a.n === 'X'){ addPanel(Object.assign({}, t, {makers:[c.name]})); return; }
    makeTokens(t, a.n, a.tapped || a.attacking, a.attacking); if(back) back(); else closePanel(); return;
  }
  const doIt = piles => {
    let x = a.n;
    if(a.do === 'put' && x === 'X' && !doIt.x){ openPanel('What is X', `<p class="help">X is ${esc(a.xWhat || 'the number on the card')}.</p>${numCtl('xV', 1, 1, 20)}`, `<button class="btn gold" id="xGo">Put them on</button>`); let v = 1; wireNum('xV', 1, n => { v = n; }); $('#xGo').onclick = () => { doIt.x = v; doIt(piles); }; return; }
    if(doIt.x) x = doIt.x;
    act(() => piles.forEach(g => { g.plus += counterMath(a.do === 'dbl' ? g.plus : x).total; }), `${c.name.split(',')[0]}: done on ${piles.length} pile${piles.length === 1 ? '' : 's'}.`);
    if(back) back(); else closePanel();
  };
  if(a.all){ doIt(creaturePiles); return; }
  openPanel('Which pile', `<p class="help">${esc(k.text)}</p>${creaturePiles.map(g => `<button class="btn" data-pg="${g.id}" style="justify-content:flex-start">${esc(g.name)} x${g.count} · ${pt(g).p}/${pt(g).t}</button>`).join('') || '<p class="msg">No creature tokens on the table.</p>'}`, `<button class="btn" id="wpBack">Back</button>`);
  document.querySelectorAll('[data-pg]').forEach(b => b.onclick = () => doIt([grp(+b.dataset.pg)]));
  $('#wpBack').onclick = () => back ? back() : cardSheet(c.name);
}
/* After New turn and after an attack: the in-play cards that do something now. */
function cuePanel(when, title, onDone, doneLabel){
  const list = []; inPlayCards().forEach(c => c.kinds.forEach(k => { if(k.k === 'trig' && (when.includes(k.when))) list.push({c, k}); }));
  if(!list.length){ if(onDone) onDone(); return false; }
  const draw = () => {
    openPanel(title, (list.length ? '' : '<p class="msg">All done.</p>') + list.map((x, i) => `<div class="cue"><p class="help">${esc(x.c.name)}: ${esc(x.k.text)}</p>${x.k.act ? `<button class="btn gold" data-q="${i}">${esc(trigLabel(x.c, x.k))}</button>` : ''}</div>`).join(''), `<button class="btn ${onDone ? 'gold' : ''}" id="cqDone">${doneLabel || 'Done'}</button>`);
    document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { const x = list[+b.dataset.q]; list.splice(+b.dataset.q, 1); runTrig(x.c, x.k, draw); });
    $('#cqDone').onclick = finish;
  };
  let done = false; const finish = () => { if(done) return; done = true; closePanel(); if(onDone) onDone(); };
  draw(); return true;
}

/* ---------- Attack ---------- */
function attackPanel(){
  const piles = S.groups.filter(g => g.creature && ready(g) > 0);
  const opps = (S.players || []).map((p, i) => ({p, i})).filter(x => x.i > 0);
  const anim = inPlayKinds('animosity').length > 0;
  const n = {}; piles.forEach(g => { n[g.id] = ready(g); });
  let real = 0, target = opps.length ? opps[0].i : -1;
  openPanel('Attack', piles.length ? `
    ${piles.map(g => `<div class="sec"><label>${esc(g.name)} · ${pt(g).p}/${pt(g).t} · ${ready(g)} can attack</label>${numCtl('at' + g.id, ready(g), 0, ready(g))}</div>`).join('')}
    ${anim ? `<div class="sec"><label>Your real creatures attacking too, sharing a type</label>${numCtl('atReal', 0, 0, 10)}<p class="help">Shared Animosity counts them.</p></div>` : ''}
    ${opps.length ? `<div class="sec"><label>At</label><div class="seg" id="atWho">${opps.map(x => `<button data-w="${x.i}" class="${x.i === target ? 'on' : ''}">${esc(x.p.name)}</button>`).join('')}<button data-w="-1">Nobody yet</button></div></div>` : ''}
    <div class="math" id="atMath"></div>` : '<p class="msg">No creature tokens can attack. New turn clears summoning sickness.</p>',
    piles.length ? `<button class="btn" id="atCancel">Cancel</button><button class="btn gold" id="atGo">Attack</button>` : `<button class="btn" id="atCancel">Close</button>`);
  const math = () => {
    const attackers = piles.filter(g => n[g.id] > 0);
    let dmg = 0; const lines = [];
    attackers.forEach(g => {
      let p = Math.max(0, pt(g).p);
      if(anim){ const shares = attackers.filter(o => o !== g && sharesType(o, g)).reduce((s, o) => s + n[o.id], 0) + (n[g.id] - 1) + real; p += shares; }
      dmg += p * n[g.id]; lines.push(`${n[g.id]} ${esc(g.name)} x ${p}`);
    });
    $('#atMath').innerHTML = `${lines.join(' + ') || 'Nobody attacking'} = <b>${dmg}</b> damage`;
    return dmg;
  };
  piles.forEach(g => wireNum('at' + g.id, 0, v => { n[g.id] = v; math(); }, () => ready(g)));
  if($('#atReal')) wireNum('atReal', 0, v => { real = v; math(); });
  if($('#atWho')) $('#atWho').onclick = e => { const b = e.target.closest('button'); if(!b) return; target = +b.dataset.w; $('#atWho').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); };
  $('#atCancel').onclick = closePanel;
  if(!piles.length) return;
  math();
  $('#atGo').onclick = () => {
    act(() => { piles.forEach(g => { if(!/(^|\n)Vigilance/.test(g.oracle)) g.tapped += n[g.id]; clampG(g); }); });
    // Attack triggers resolve before damage, so the damage is counted after them.
    const deal = () => {
      const attackers = piles.filter(g => n[g.id] > 0 && grp(g.id));
      let dmg = 0; attackers.forEach(g => { let p = Math.max(0, pt(g).p); if(anim) p += attackers.filter(o => o !== g && sharesType(o, g)).reduce((s, o) => s + n[o.id], 0) + (n[g.id] - 1) + real; dmg += p * n[g.id]; });
      act(() => { if(target > 0) S.players[target].life -= dmg; }, `Hit for ${dmg}${target > 0 ? ' at ' + S.players[target].name : ''}.`);
    };
    closePanel();
    cuePanel(['attack'], 'Attack triggers', deal, 'Deal the damage');
  };
}
function sharesType(a, b){ const st = g => (g.type.split('—')[1] || '').trim().split(/\s+/).filter(Boolean); const x = st(a); return st(b).some(w => x.includes(w)); }

/* ---------- Sacrifice ---------- */
function sacPanel(){
  const piles = S.groups.filter(g => g.count);
  const n = {}; piles.forEach(g => { n[g.id] = 0; });
  openPanel('Sacrifice', piles.length ? piles.map(g => `<div class="sec"><label>${esc(g.name)} · ${g.count} on the table</label>${numCtl('sc' + g.id, 0, 0, g.count)}</div>`).join('') + '<div class="math" id="scMath"></div>' : '<p class="msg">No tokens on the table.</p>',
    `<button class="btn" id="scCancel">Cancel</button>${piles.length ? '<button class="btn bad" id="scGo">Sacrifice</button>' : ''}`);
  const math = () => { const t = Object.values(n).reduce((a, b) => a + b, 0); const d = deathText(piles.map(g => [g, n[g.id]])); $('#scMath').innerHTML = `<b>${t}</b> token${t === 1 ? '' : 's'}${d ? '<br>' + esc(d) : ''}`; };
  piles.forEach(g => wireNum('sc' + g.id, 0, v => { n[g.id] = v; math(); }, () => g.count));
  $('#scCancel').onclick = closePanel;
  if(!piles.length) return;
  math();
  $('#scGo').onclick = () => {
    const d = deathText(piles.map(g => [g, n[g.id]]));
    act(() => { piles.forEach(g => { const k = n[g.id]; if(!k) return; const fromTap = Math.min(k, g.tapped); g.count -= k; g.tapped -= fromTap; clampG(g); }); S.groups = S.groups.filter(g => g.count > 0); }, 'Sacrificed.' + (d ? ' ' + d : ''));
    closePanel();
  };
}
/* Pashalik Mons and the like: how much damage the dying tokens deal. */
function deathText(pairs){
  return inPlayKinds('death').map(k => { const dead = pairs.reduce((s, [g, c]) => s + (typeMatch(g, k.type) ? c : 0), 0); return dead ? `${k.card.split(',')[0]}: ${dead * k.dmg} damage to any target.` : ''; }).filter(Boolean).join(' ');
}

/* ---------- A real creature died: Myrkul, Ratadrabik, Ardyn ---------- */
function diedPanel(){
  const D = deckData; const list = D.copies.slice().sort((a, b) => (S.inPlay[b.name] ? 1 : 0) - (S.inPlay[a.name] ? 1 : 0));
  openPanel('A creature died', `<p class="help">Pick what brings it back, then scan or pick the creature.</p>${list.map((e, i) => `<button class="btn" style="justify-content:flex-start;white-space:normal;text-align:left;padding:8px 12px" data-e="${i}"><span><b>${esc(e.name)}</b>${S.inPlay[e.name] ? ' · in play' : ''}<br><span class="help">${esc(e.except || 'A plain copy')}</span></span></button>`).join('')}`, `<button class="btn" id="dpX">Close</button>`);
  document.querySelectorAll('[data-e]').forEach(b => b.onclick = () => copyPick(list[+b.dataset.e], D));
  $('#dpX').onclick = closePanel;
}

/* ---------- Life ---------- */
function playersPanel(){
  const ps = S.players;
  openPanel('Players', `${ps.map((p, i) => `<div class="ctl"><input class="txt" data-pn="${i}" value="${esc(p.name)}" aria-label="Name">${i ? `<button class="btn ic" data-rm="${i}" aria-label="Remove">${I.minus}</button>` : ''}</div>`).join('')}
    <button class="btn" id="ppAdd" ${ps.length >= 6 ? 'disabled' : ''}>${I.plus}Add an opponent</button>
    <div class="sec"><label>Starting life</label>${numCtl('ppLife', S.startLife || 40, 1, 60)}</div>
    <button class="btn" id="ppReset">Everyone back to starting life</button>`, `<button class="btn gold" id="ppDone">Done</button>`);
  document.querySelectorAll('[data-pn]').forEach(el => el.onchange = () => { act(() => { ps[+el.dataset.pn].name = el.value.trim() || 'Player'; }); });
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { act(() => { ps.splice(+b.dataset.rm, 1); }, 'Player removed.'); playersPanel(); });
  $('#ppAdd').onclick = () => { act(() => { ps.push({name: 'Opponent ' + ps.length, life: S.startLife || 40, poison:0, cmd:{}}); }); playersPanel(); };
  wireNum('ppLife', 1, v => { S.startLife = v; save(); });
  $('#ppReset').onclick = () => act(() => ps.forEach(p => { p.life = S.startLife || 40; p.poison = 0; p.cmd = {}; }), 'Life reset.');
  $('#ppDone').onclick = closePanel;
}
function lifePanel(i){
  const p = S.players[i]; if(!p) return;
  const others = S.players.map((o, j) => ({o, j})).filter(x => x.j !== i);
  openPanel(p.name, `
    <div class="sec"><label>Life</label>${numCtl('lpL', p.life, -20, Math.max(60, p.life + 20))}</div>
    <div class="sec"><label>Poison</label>${numCtl('lpP', p.poison || 0, 0, 10)}</div>
    ${others.map(x => `<div class="sec"><label>Commander damage from ${esc(x.o.name)}</label>${numCtl('lpC' + x.j, (p.cmd || {})[x.j] || 0, 0, 21)}<p class="help">Raising it takes the same off their life.</p></div>`).join('')}`, `<button class="btn gold" id="lpDone">Done</button>`);
  let snapped = false; const once = () => { if(!snapped){ snap(); snapped = true; } };
  wireNum('lpL', -99, v => { once(); p.life = v; save(); renderBar(); });
  wireNum('lpP', 0, v => { once(); p.poison = v; save(); renderBar(); }, () => 10);
  others.forEach(x => wireNum('lpC' + x.j, 0, v => { once(); p.cmd = p.cmd || {}; const was = p.cmd[x.j] || 0; p.cmd[x.j] = v; p.life -= (v - was); const l = $('#lpL'); if(l){ l.value = p.life; $('#lpLR').value = p.life; } save(); renderBar(); }, () => 21));
  $('#lpDone').onclick = closePanel;
}

/* ---------- Table settings ---------- */
function menuPanel(){
  openGroupId = null;
  openPanel('Table', `
    <div class="sec"><label>Token doublers out</label>${numCtl('mD', S.doublers, 0, 4)}<p class="help">Each doubles the tokens you make. Now x${mult()}.</p></div>
    <div class="sec"><label>Counter doublers out</label>${numCtl('mC', S.ctrDoublers || 0, 0, 4)}<p class="help">Vorinclex, Doubling Season, Branching Evolution. Each doubles the counters you put on.</p></div>
    <div class="sec"><label>All your creature tokens get</label>
      <div class="grid2"><div class="sec"><span class="help">Power</span>${smallStep('mAP', S.anthem.p)}</div><div class="sec"><span class="help">Toughness</span>${smallStep('mAT', S.anthem.t)}</div></div>
      <p class="help">For lords and anthems that stay on the table.</p></div>
    <div class="sec"><label>Whole table</label>
      <button class="btn" id="mPump">Every creature token +1/+1 counter</button>
      <button class="btn" id="mDouble">Double every pile</button>
      <button class="btn" id="mTapAll">Tap every creature token</button>
      <label class="check"><input type="checkbox" id="mAwake" ${S.awake ? 'checked' : ''}>Keep the screen on</label>
    </div>
    <div class="sec"><label>New game</label><button class="btn bad" id="mNew">Clear the table</button><p class="help">Tokens used before stay on the empty table for one tap.</p></div>
  `);
  wireNum('mD', 0, v => { S.doublers = v; save(); renderStats(); render(); }, () => 6);
  wireNum('mC', 0, v => { S.ctrDoublers = v; save(); renderStats(); }, () => 6);
  wireSmall('mAP', v => act(() => { S.anthem.p = v; }));
  wireSmall('mAT', v => act(() => { S.anthem.t = v; }));
  $('#mPump').onclick = () => act(() => S.groups.forEach(g => { if(g.creature) g.plus += counterMath(1).total; }), 'Every creature token got ' + counterMath(1).total + ' +1/+1 counter' + (counterMath(1).total > 1 ? 's.' : '.'));
  $('#mDouble').onclick = () => act(() => S.groups.forEach(g => { g.sick += g.count; g.count *= 2; }), 'Every pile doubled.');
  $('#mTapAll').onclick = () => act(() => S.groups.forEach(g => { if(g.creature) g.tapped = g.count; }), 'Every creature token tapped.');
  $('#mAwake').onchange = e => { S.awake = e.target.checked; save(); wake(); };
  $('#mNew').onclick = () => { act(() => { S.groups = []; S.turn = 1; S.anthem = {p:0,t:0}; S.inPlay = {}; S.died = []; (S.players || []).forEach(p => { p.life = 40; p.poison = 0; p.cmd = {}; }); }, 'Table cleared, life back to 40.'); closePanel(); };
}

/* ---------- Keep the iPad awake ---------- */
let lock = null;
async function wake(){
  try{
    if(S.awake && 'wakeLock' in navigator && document.visibilityState === 'visible'){ if(!lock){ lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } }
    else if(lock){ await lock.release(); lock = null; }
  }catch(e){}
}
document.addEventListener('visibilitychange', wake);

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
render(); wake(); ensureDeck();
</script>
</body>
