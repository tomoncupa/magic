<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brewing Station</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080B10">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Block, Motherbase's default theme: flat plates, hairlines do the separating,
   6px corners, Chakra Petch for headings, labels and numbers. */
:root{
  --bg:#080B10; --bg2:#0E141D; --bg3:#131B26; --bg4:#1B2634;
  --line:#1E2A38; --line2:#2B3A4D;
  --ink:#DBE7F0; --ink2:#B8C9D8; --ink3:#7F93A8;
  --brass:#F0B323; --brass-fg:#1A1206; --brass-soft:rgba(240,179,35,.10);
  --danger:#FF6B81; --good:#6EE7A8; --warn:#FFB347; --info:#7EE8FA;
  --mW:#f4ecd6; --mU:#4a8fd6; --mB:#8a7598; --mR:#d4543c; --mG:#4a9d5c; --mC:#a9b4b0;
  --s1:4px; --s2:6px; --s3:8px; --s4:12px; --s5:16px; --s6:22px; --s7:30px;
  --t1:11px; --t2:13px; --t3:15px; --t4:19px; --t5:25px; --t6:34px;
  --tap:44px; --r-sm:6px; --r-md:6px; --r-lg:6px; --cap:.08em;
  --disp:'Chakra Petch',system-ui,sans-serif;
  --num:'Chakra Petch',system-ui,sans-serif;
  --ui:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.45;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
[hidden]{display:none!important}

.top{position:sticky;top:0;z-index:5;background:var(--bg2);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top,0px)) 16px 0}
.toprow{display:flex;align-items:center;gap:var(--s4);max-width:980px;margin:0 auto}
.brand{font-family:var(--disp);font-weight:700;font-size:19px;color:var(--brass);line-height:1;letter-spacing:var(--cap);text-transform:uppercase}
.brand small{display:block;font-family:var(--disp);font-weight:500;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-top:4px}
.spacer{flex:1}
.back{font-family:var(--disp);font-size:var(--t2);letter-spacing:var(--cap);color:var(--ink2);min-height:var(--tap);padding:0 var(--s3);display:flex;align-items:center;text-decoration:none}
.back:hover{color:var(--ink)}
.back.home{flex:none;width:var(--tap);margin-left:-12px;justify-content:center;padding:0;font-size:28px;line-height:1}
.steps{display:flex;gap:2px;max-width:980px;margin:var(--s3) auto 0;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.stepbtn{flex:1 0 auto;min-height:var(--tap);padding:0 var(--s4);font-family:var(--disp);font-weight:600;font-size:var(--t2);letter-spacing:var(--cap);text-transform:uppercase;color:var(--ink3);border-bottom:2px solid transparent;white-space:nowrap}
.stepbtn.on{color:var(--brass);border-bottom-color:var(--brass)}
.stepbtn.done{color:var(--ink2)}
.stepbtn:disabled{opacity:.35;cursor:default}

main{max-width:980px;margin:0 auto;padding:var(--s5) 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-family:var(--disp);font-weight:700;font-size:var(--t5);letter-spacing:.02em;margin:0 0 var(--s2);text-wrap:balance}
h2{font-family:var(--disp);font-weight:600;font-size:var(--t4);margin:var(--s6) 0 var(--s3)}
h3{font-family:var(--disp);font-size:var(--t1);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin:var(--s5) 0 var(--s3)}
p{margin:0 0 var(--s3);max-width:68ch}
.note{color:var(--ink2);font-size:var(--t2)}
.small{font-size:var(--t1);color:var(--ink3)}
.src{font-size:var(--t1);color:var(--ink3)}
.src a,.note a,p a{color:var(--brass)}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s5)}
.stack{display:flex;flex-direction:column;gap:var(--s4)}
.row{display:flex;gap:var(--s3);flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--s4)}

.btn{min-height:var(--tap);padding:0 var(--s5);border-radius:var(--r-md);background:var(--bg3);border:1px solid var(--line);color:var(--ink2);
  font-family:var(--disp);font-weight:600;letter-spacing:var(--cap);text-transform:uppercase;font-size:var(--t2)}
.btn:hover{border-color:var(--line2);color:var(--ink)}
.btn.primary{border-color:var(--brass);color:var(--brass);background:var(--bg3)}
.btn.primary:hover{background:var(--brass-soft)}
.btn.fill{background:var(--brass);color:var(--brass-fg);border-color:var(--brass)}
.btn.small{font-size:var(--t1)}
.btn:disabled{opacity:.4;cursor:default}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg2);border-top:1px solid var(--line);
  padding:var(--s3) 16px calc(var(--s3) + env(safe-area-inset-bottom,0px))}
.bar .row{max-width:980px;margin:0 auto;justify-content:flex-end}
.bar .msg{flex:1;min-width:0;font-size:var(--t2);color:var(--ink2)}

input[type=text],input[type=number],textarea,select{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:10px 12px;min-height:var(--tap);font-size:16px}
input:focus,textarea:focus,select:focus{border-color:var(--brass-line);outline:none}
input:focus-visible,textarea:focus-visible,select:focus-visible{box-shadow:0 0 0 2px var(--brass)}
textarea{min-height:96px;resize:vertical;font-family:var(--mono);font-size:14px}
input[type=number]{width:84px;text-align:center;font-family:var(--num);font-weight:600;font-variant-numeric:tabular-nums}
label.lab{display:block;font-family:var(--disp);font-size:var(--t1);letter-spacing:var(--cap);text-transform:uppercase;color:var(--ink3);margin-bottom:var(--s2)}

.opt{display:flex;gap:var(--s4);align-items:flex-start;padding:var(--s4);border:1px solid var(--line);border-radius:var(--r-md);background:var(--bg2);text-align:left;width:100%;min-height:var(--tap)}
.opt:hover{border-color:var(--line2)}
.opt.on{border-color:var(--brass);background:var(--brass-soft)}
.opt b{display:block;font-family:var(--disp);font-weight:600}
.opt .tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);flex:0 0 auto;margin-top:2px}
.opt.on .tick{border-color:var(--brass);background:radial-gradient(circle,var(--brass) 45%,transparent 50%)}
.opt.multi .tick{border-radius:4px}
.opt.multi.on .tick{background:var(--brass)}
.chip{display:inline-flex;align-items:center;min-height:var(--tap);padding:0 var(--s4);border-radius:var(--r-sm);border:1px solid var(--line);background:var(--bg3);font-family:var(--disp);font-size:var(--t2);letter-spacing:.02em}
.chip.on{border-color:var(--brass);color:var(--brass)}
span.chip{min-height:32px}

.pip{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-family:var(--disp);font-weight:700;font-size:11px;color:#10160f;vertical-align:middle}
.pip.W{background:var(--mW)}.pip.U{background:var(--mU)}.pip.B{background:var(--mB)}.pip.R{background:var(--mR)}.pip.G{background:var(--mG)}.pip.C{background:var(--mC)}

.cmdcard{display:flex;gap:var(--s5);align-items:flex-start;flex-wrap:wrap}
.cmdcard img{width:200px;border-radius:10px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:var(--s2) var(--s4);font-size:var(--t2);align-items:center}
.facts dt{font-family:var(--disp);font-size:var(--t1);letter-spacing:var(--cap);text-transform:uppercase;color:var(--ink3)} .facts dd{margin:0}
.ok{color:var(--good)} .bad{color:var(--danger)} .warn{color:var(--warn)}

.suggest{position:relative}
.suggest ul{position:absolute;left:0;right:0;top:100%;z-index:4;margin:2px 0 0;padding:0;list-style:none;background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r-sm);max-height:300px;overflow:auto}
.suggest li button{display:block;width:100%;text-align:left;padding:10px 12px;min-height:var(--tap)}
.suggest li button:hover,.suggest li button:focus{background:var(--bg3)}

table{border-collapse:collapse;width:100%;font-size:var(--t2)}
th{font-family:var(--disp);font-size:var(--t1);letter-spacing:var(--cap);text-transform:uppercase;color:var(--ink3);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
.tablewrap{overflow-x:auto}

.quota{display:grid;grid-template-columns:1fr auto;gap:var(--s2) var(--s4);align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.quota .why{grid-column:1/-1;font-size:var(--t1);color:var(--ink3)}
.quota b{font-family:var(--disp);font-weight:600}

.cat{margin-top:var(--s5)}
.cat summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:var(--s3);min-height:var(--tap);font-family:var(--disp);font-weight:600;font-size:var(--t4)}
.cat summary::-webkit-details-marker{display:none}
.cat summary .ct{font-family:var(--num);font-size:var(--t2);color:var(--ink3)}
.cat summary .target{font-family:var(--disp);font-size:var(--t1);letter-spacing:var(--cap);text-transform:uppercase;color:var(--ink3);font-weight:500}
.card{display:grid;grid-template-columns:34px 1fr auto;gap:var(--s3);align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.card .mv{font-family:var(--num);font-weight:600;font-size:var(--t2);color:var(--ink2);text-align:center;background:var(--bg3);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px 0}
.card .nm{font-weight:500}
.card .why{font-size:var(--t1);color:var(--ink3)}
.tag{display:inline-block;font-family:var(--disp);font-size:10px;letter-spacing:var(--cap);text-transform:uppercase;font-weight:600;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:1px;border:1px solid}
.tag.gc{color:var(--danger);border-color:rgba(255,107,129,.4);background:rgba(255,107,129,.08)}
.tag.combo{color:var(--info);border-color:rgba(126,232,250,.4);background:rgba(126,232,250,.08)}
.tag.must{color:var(--good);border-color:rgba(110,231,168,.4);background:rgba(110,231,168,.08)}
.tag.job{color:var(--ink2);border-color:var(--line2);background:var(--bg3)}
.tpick .qty{position:absolute;right:6px;bottom:6px;font-family:var(--num);font-weight:700;font-size:var(--t3);color:var(--ink);background:rgba(8,11,16,.85);border:1px solid var(--line2);border-radius:4px;padding:2px 8px}
.x{width:var(--tap);height:var(--tap);border-radius:var(--r-sm);color:var(--ink3);font-size:18px;border:1px solid transparent}
.x:hover{background:var(--bg3);border-color:var(--line);color:var(--ink)}
.repl{grid-column:1/-1;background:var(--bg3);border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s3)}
.repl button{display:block;width:100%;text-align:left;padding:8px;min-height:var(--tap);border-radius:var(--r-sm)}
.repl button:hover{background:var(--bg4)}

.checks{display:flex;flex-direction:column;gap:var(--s2)}
.check{display:grid;grid-template-columns:22px 1fr;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.check .ic{font-weight:700}
.hist{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:18px}
.hist .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.hist .b{width:100%;background:var(--brass);border-radius:3px 3px 0 0;min-height:1px;position:relative}
.hist .b span{position:absolute;top:-17px;left:0;right:0;text-align:center;font-family:var(--num);font-size:11px;color:var(--ink2)}
.hist .l{font-family:var(--num);font-size:11px;color:var(--ink3)}
.stat{display:flex;flex-direction:column;gap:2px;padding:var(--s4);background:var(--bg3);border:1px solid var(--line);border-radius:var(--r-md)}
.stat .v{font-family:var(--num);font-size:var(--t5);font-weight:700;color:var(--brass);font-variant-numeric:tabular-nums}
.stat .k{font-size:var(--t2);color:var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--s4)}
pre.out{background:var(--bg3);border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s4);max-height:320px;overflow:auto;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;margin:0}
.swap{display:grid;grid-template-columns:1fr auto 1fr;gap:var(--s3);align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--line);font-size:var(--t2)}
.swap .arrow{color:var(--ink3)}
.swap .in{color:var(--good)} .swap .outc{color:var(--danger)}
.busy{display:inline-block;width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--brass);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;margin:var(--s3) 0 var(--s4)}
.seg button{min-height:var(--tap);padding:0 var(--s5);font-family:var(--disp);font-weight:600;font-size:var(--t2);letter-spacing:var(--cap);text-transform:uppercase;color:var(--ink3);background:var(--bg3)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{color:var(--brass);background:var(--brass-soft)}
.seg .n{font-family:var(--num);margin-left:6px}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:var(--s2);margin-bottom:var(--s4)}
.jobs .job{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:52px;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg3);text-align:left}
.jobs .job span:first-child{font-family:var(--disp);font-weight:600;font-size:var(--t1);letter-spacing:var(--cap);text-transform:uppercase;color:var(--ink2)}
.jobs .job .n{font-family:var(--num);font-weight:700;font-size:var(--t3);color:var(--ink)}
.jobs .job.full .n{color:var(--good)}
.jobs .job.on{border-color:var(--brass)}
.jobs .job.on span:first-child{color:var(--brass)}
.warnp{border-color:rgba(255,179,71,.5);margin-bottom:var(--s4)}
.rhead{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.rhead h2{margin:0}
.deal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s4);margin-top:var(--s3)}
.tile{position:relative;display:flex;flex-direction:column;gap:6px}
.tpick{position:relative;display:block;width:100%;aspect-ratio:488/680;border-radius:8px;overflow:hidden;background:var(--bg3);border:2px solid transparent;padding:0}
.tpick img{display:block;width:100%;height:100%;object-fit:cover}
.tile.on .tpick{border-color:var(--brass)}
.tile:not(.on) .tpick:hover{border-color:var(--line2)}
.tk{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(8,11,16,.75);border:2px solid var(--ink3);color:var(--brass-fg);font-weight:700}
.tile.on .tk{background:var(--brass);border-color:var(--brass)}
.tsrc{position:absolute;left:6px;bottom:6px;font-family:var(--disp);font-size:10px;font-weight:600;letter-spacing:var(--cap);text-transform:uppercase;padding:2px 6px;border-radius:4px;background:rgba(8,11,16,.85);color:var(--ink2);border:1px solid var(--line2)}
.tsrc.claude{color:var(--brass);border-color:var(--brass)}
.noimg{display:grid;place-items:center;height:100%;padding:8px;font-family:var(--disp)}
.tinfo{display:flex;flex-direction:column;gap:3px}
.tinfo b{font-weight:600;font-size:var(--t2)}
.tw{font-size:var(--t1);color:var(--ink3);line-height:1.35}
.tw.fit{color:var(--ink2)}
.zoom{position:absolute;top:4px;left:4px;min-height:var(--tap);min-width:var(--tap);padding:0 8px;font-family:var(--disp);font-size:10px;font-weight:600;letter-spacing:var(--cap);text-transform:uppercase;color:var(--ink2);background:transparent}
.zoom::before{content:'';position:absolute;inset:6px;border-radius:4px;background:rgba(8,11,16,.8);border:1px solid var(--line2);z-index:-1}
.zoom{z-index:1}
.zoomer{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.zoomer img{max-width:min(488px,100%);max-height:100%;border-radius:18px}
.clround{margin-bottom:var(--s2)}
.clpaste summary{cursor:pointer;min-height:var(--tap);display:flex;align-items:center;font-family:var(--disp);font-size:var(--t2);letter-spacing:var(--cap);text-transform:uppercase;color:var(--ink2)}
.sh-sbl{display:inline-block;padding:13px 0;margin:-13px 0;color:var(--brass);white-space:nowrap}
.linkbtn{display:inline-flex;align-items:center;color:var(--brass);text-decoration:underline;min-height:var(--tap);padding:0 4px}
.card[data-row]{cursor:pointer}
.card[data-row]:hover{background:var(--bg3)}
.x.sw{width:auto;padding:0 var(--s3);font-family:var(--disp);font-size:var(--t1);font-weight:600;letter-spacing:var(--cap);text-transform:uppercase;border-color:var(--line)}
.scrim{position:fixed;inset:0;z-index:14;background:rgba(0,0,0,.6)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:15;max-height:88vh;overflow:auto;background:var(--bg2);border-top:1px solid var(--line2);
  border-radius:var(--r-lg) var(--r-lg) 0 0;padding:var(--s4) 16px calc(var(--s5) + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:980px;margin:0 auto}
.swnow{display:flex;gap:var(--s4);align-items:flex-start}
.swnow img{width:110px;border-radius:6px;flex:0 0 auto}
.swhead{position:sticky;top:calc(-1 * var(--s4));background:var(--bg2);padding:var(--s2) 0;z-index:2;display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}
.guide h2{font-size:var(--t4);margin:var(--s5) 0 var(--s2)} .guide h2:first-child{margin-top:0}
.guide ul{margin:0 0 var(--s3);padding-left:20px} .guide li{margin:3px 0;max-width:68ch} .guide p{margin:0 0 var(--s3)}
.shelf{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s3)}
.drow{display:grid;grid-template-columns:52px 1fr auto;gap:var(--s3);align-items:center;padding:var(--s2);border:1px solid var(--line);border-radius:var(--r-md);background:var(--bg3)}
.drow.on{border-color:var(--brass)}
.drow img,.drow .ph{width:52px;height:38px;object-fit:cover;border-radius:4px;background:var(--bg4)}
.drow .open{text-align:left;min-height:var(--tap);display:flex;flex-direction:column;justify-content:center}
.drow .open b{font-family:var(--disp);font-weight:600}
.empty{padding:var(--s6);text-align:center;color:var(--ink3);border:1px dashed var(--line2);border-radius:var(--r-md)}
/* shell-only pieces brew.css does not have */
.sh-pics{display:flex;flex-direction:column;gap:var(--s6)}
.sh-pics .bs-group{margin-top:0}
.sh-chipword{font-family:var(--disp);font-size:var(--t1);letter-spacing:var(--cap);text-transform:uppercase;color:var(--ink3)}
#moxChip{cursor:default}
.sh-boards{margin-top:var(--s7);padding-top:var(--s5);border-top:1px solid var(--line2)}
.sh-qty{position:absolute;right:6px;bottom:6px;font-family:var(--num);font-weight:700;font-size:var(--t2);color:var(--ink);background:var(--glass);border:1px solid var(--line2);border-radius:4px;padding:1px 7px}
.sh-bas{display:flex;gap:10px;align-items:center}
.sh-pick{max-height:none}
.sh-links{display:flex;flex-wrap:wrap;gap:var(--s2)}
.sh-sub{font-size:var(--t1);color:var(--ink3);margin:var(--s2) 0 0}

<script>
'use strict';
/* ============ data access ============ */
var SF = 'https://api.scryfall.com';
var EDH = 'https://json.edhrec.com/pages';
var lastSf = 0;
function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

/* Fetched data (Scryfall cards, EDHREC pages) is kept a day so a rebuild does not refetch it.
   It lives in IndexedDB, not localStorage: this origin's localStorage is shared with Motherbase
   and every other app on tomoncupa.github.io. An in-memory map sits in front of it. Where
   IndexedDB is missing (some private windows) the cache is memory only, for this visit. */
var DAY = 864e5;
var CACHE_DB = 'brew-cache', MEM = new Map(), IDB = { p:null }, GETQ = null, PUTQ = null;
function idb(){
  if(IDB.p) return IDB.p;
  IDB.p = new Promise(function(res){
    // Some Safari versions never answer an open after the app was in the background: after 3 s the
    // cache runs in memory only, instead of every page waiting forever for card data.
    var over = false, t = setTimeout(function(){ over = true; res(null); }, 3000);
    function done(v){ clearTimeout(t); if(!over) res(v); else if(v) try{ v.close(); }catch(e){} }
    try{
      if(!window.indexedDB){ done(null); return; }
      var rq = indexedDB.open(CACHE_DB, 1);
      rq.onupgradeneeded = function(){ rq.result.createObjectStore('c'); };
      rq.onsuccess = function(){ var db = rq.result; db.onversionchange = function(){ db.close(); IDB.p = null; }; done(db); };
      rq.onerror = rq.onblocked = function(){ done(null); };
    }catch(e){ done(null); }
  });
  return IDB.p;
}
function fresh1(e){ return !!e && Date.now() - e.t < DAY; }
// Every read asked for in the same moment goes to IndexedDB as one transaction.
function cacheGet(k){
  var m = MEM.get(k);
  if(m) return Promise.resolve(fresh1(m) ? m.v : null);
  return new Promise(function(res){
    if(!GETQ){ GETQ = new Map(); setTimeout(flushGets, 0); }
    var l = GETQ.get(k); if(!l){ l = []; GETQ.set(k, l); } l.push(res);
  });
}
async function flushGets(){
  var batch = GETQ; GETQ = null;
  await CACHE_MOVED;
  var db = await idb(), found = {};
  if(db){
    await new Promise(function(done){
      try{
        var tx = db.transaction('c', 'readonly'), st = tx.objectStore('c');
        batch.forEach(function(l, k){ if(MEM.has(k)) return; var r = st.get(k); r.onsuccess = function(){ if(r.result) found[k] = r.result; }; });
        tx.oncomplete = tx.onerror = tx.onabort = function(){ done(); };
      }catch(e){ done(); }
    });
  }
  batch.forEach(function(l, k){
    var e = MEM.get(k) || found[k];
    if(e && !MEM.has(k)) MEM.set(k, e);
    l.forEach(function(res){ res(fresh1(e) ? e.v : null); });
  });
}
// Writes are batched the same way. The promise settles once the write is done (or failed).
function cachePut(k, v){
  MEM.set(k, { t:Date.now(), v:v });
  if(!PUTQ){ PUTQ = { keys:{}, p:null }; PUTQ.p = new Promise(function(res){ setTimeout(function(){ var q = PUTQ; PUTQ = null; writeCache(Object.keys(q.keys)).then(res, res); }, 0); }); }
  PUTQ.keys[k] = 1;
  return PUTQ.p;
}
function writeCache(keys){
  return idb().then(function(db){
    if(!db) return;
    return new Promise(function(done){
      try{
        var tx = db.transaction('c', 'readwrite'), st = tx.objectStore('c');
        keys.forEach(function(k){ var e = MEM.get(k); if(e) st.put(e, k); });
        tx.oncomplete = tx.onerror = tx.onabort = function(){ done(); };
      }catch(e){ done(); }
    });
  });
}
// One-time move: cache entries that older versions kept in localStorage go to IndexedDB
// and leave localStorage. Old card entries (card2:) have no price and are not kept.
var CACHE_MOVED = (function(){
  var keys = [];
  try{ for(var i = 0; i < localStorage.length; i++){ var k = localStorage.key(i); if(k && k.indexOf('forge.c.') === 0) keys.push(k); } }catch(e){ return Promise.resolve(0); }
  if(!keys.length) return Promise.resolve(0);
  var move = [];
  keys.forEach(function(k){
    var kk = k.slice(8); if(kk.indexOf('card2:') === 0) return;
    try{ var j = JSON.parse(lsGet(k)); if(fresh1(j)){ MEM.set(kk, { t:j.t, v:j.v }); move.push(kk); } }catch(e){}
  });
  return writeCache(move).then(function(){ keys.forEach(lsDel); return move.length; }, function(){ keys.forEach(lsDel); return move.length; });
})();
// Old entries are cleared out of IndexedDB a little after start, so it does not grow for ever.
setTimeout(function(){
  idb().then(function(db){
    if(!db) return;
    try{
      var tx = db.transaction('c', 'readwrite'), cur = tx.objectStore('c').openCursor();
      cur.onsuccess = function(){ var c = cur.result; if(!c) return; if(!fresh1(c.value)) c.delete(); c.continue(); };
    }catch(e){}
  });
}, 15000);
// Scryfall asks for 50-100 ms between requests. Browsers do not let a page set User-Agent.
// A 429 (too many requests) that reaches a browser often has no CORS header, so it shows up
// as a failed fetch, not as a status: both wait and try again, a few times.
async function sf(path, body, tries){
  tries = tries || 0;
  var gap = Date.now() - lastSf; if(gap < 110) await wait(110 - gap);
  lastSf = Date.now();
  var opt = { headers:{ 'Accept':'application/json' } };
  if(body){ opt.method = 'POST'; opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  var r;
  try{ r = await fetch(SF + path, opt); }
  catch(e){ if(tries < 3 && navigator.onLine !== false){ await wait(1500 * (tries + 1)); return sf(path, body, tries + 1); } throw new Error('Scryfall could not be reached'); }
  if(r.status === 404) return null;
  if(r.status === 429){ if(tries >= 5) throw new Error('Scryfall is busy, try again in a minute'); await wait(1000 * (tries + 1)); return sf(path, body, tries + 1); }
  if(!r.ok) throw new Error('Scryfall answered ' + r.status);
  return r.json();
}
async function sfSearchAll(q){
  var key = 'q:' + q, hit = await cacheGet(key); if(hit) return hit;
  var out = [], page = await sf('/cards/search?q=' + encodeURIComponent(q));
  while(page){
    out = out.concat(page.data.map(slim));
    if(!page.has_more) break;
    await wait(60);
    var u = page.next_page.replace(SF, '');
    page = await sf(u);
  }
  cachePut(key, out); return out;
}
// An EDHREC page, cached a day. A page with no cards (a filter EDHREC has no decks for) counts as
// no page and is not cached. v:2 pages also carry the bracket and budget counts, combos and similar
// commanders; an older cached copy is read again.
async function edh(path){
  var key = 'e:' + path, hit = await cacheGet(key); if(hit && hit.v === 2 && hit.cards && hit.cards.length) return hit;
  var r = await fetch(EDH + path + '.json', { headers:{ 'Accept':'application/json' } });
  if(!r.ok) return null;
  var j = await r.json();
  if(j && j.redirect) return null;
  var slimJ = slimEdh(j);
  if(!slimJ.cards.length) return null;
  cachePut(key, slimJ); return slimJ;
}
function slimEdh(j){
  var jd = (j.container && j.container.json_dict) || {};
  var cards = [];
  (jd.cardlists || []).forEach(function(cl){
    (cl.cardviews || []).forEach(function(c){
      cards.push({ n:c.name, id:c.id, syn:c.synergy || 0, nd:c.num_decks || 0, pd:c.potential_decks || 0, list:cl.header });
    });
  });
  var pie = {};
  ((j.panels && j.panels.piechart && j.panels.piechart.content) || []).forEach(function(p){ pie[p.label] = p.value; });
  var c = jd.card || {};
  var cc = ((j.panels && j.panels.combocounts) || []).filter(function(x){ return x && x.value && x.href; }).map(function(x){ return { v:x.value, href:x.href }; });
  return { v:2, cards:cards, tags:(j.panels && j.panels.taglinks) || [], pie:pie,
           salt:c.salt, decks:c.num_decks, rank:c.rank, header:j.header || '',
           bc:j.bracket_counts || null, bud:j.budget_counts || null, combos:cc, similar:Array.isArray(j.similar) ? j.similar.slice(0, 8) : [] };
}
function slim(c){
  var f = c.card_faces || [];
  var o = c.oracle_text != null ? c.oracle_text : f.map(function(x){ return x.oracle_text || ''; }).join('\n');
  var img = (c.image_uris || (f[0] && f[0].image_uris) || {});
  return { n:c.name, id:c.id, mv:c.cmc || 0, cost:c.mana_cost || (f[0] && f[0].mana_cost) || '',
    type:c.type_line || (f[0] && f[0].type_line) || '', o:o, ci:c.color_identity || [],
    legal:(c.legalities || {}).commander, prod:c.produced_mana || [], gc:!!c.game_changer,
    img:img.normal || '', sm:img.small || '', kw:c.keywords || [],
    // A reprint (Chaos Warp in an upcoming set) is out already: only a first printing has a release date to wait for.
    rel:c.reprint ? '' : c.released_at || '', usd:usdOfRaw(c) };
}
// Scryfall's US dollar price: normal, else foil, else etched. null when it has none.
function usdOfRaw(c){
  var p = c.prices || {}, k = ['usd', 'usd_foil', 'usd_etched'];
  for(var i = 0; i < k.length; i++){ var v = parseFloat(p[k[i]]); if(!isNaN(v)) return v; }
  return null;
}
// A card Scryfall knows but that is not out yet. Commander calls it not legal until release day.
// The date is the newest printing's, so a reprint in an upcoming set has a future date too; it stays legal.
function unreleased(c){ return !!(c && c.rel) && c.legal !== 'legal' && c.rel > new Date().toISOString().slice(0, 10); }
function relDate(c){ return new Date(c.rel + 'T00:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }); }
// Unreleased must-includes and cards added by name wait here instead of the 99.
function considering(){
  var out = [], seen = {}, must = lines(S.mustText);
  must.concat(S.considerAdd || []).forEach(function(n){
    var c = poolCard(n); if(!c || !unreleased(c) || seen[c.n]) return;
    seen[c.n] = 1; out.push({ c:c, added:!must.some(function(m){ return sameName(c.n, m); }) });
  });
  return out;
}
// Look up many cards at once, by Scryfall id where known, else by name.
async function sfCollection(list, onProgress){
  var out = {}, todo = [];
  var hits = await Promise.all(list.map(function(x){ return cacheGet('card4:' + (x.id || x.n.toLowerCase())); }));
  list.forEach(function(x, i){
    if(hits[i]){ out[(x.id || x.n.toLowerCase())] = hits[i]; } else todo.push(x);
  });
  var missing = [];
  for(var i = 0; i < todo.length; i += 75){
    if(onProgress) onProgress(i, todo.length);
    var chunk = todo.slice(i, i + 75);
    // Scryfall finds a two-faced card by its front face, not by its full "A // B" name.
    var j = await sf('/cards/collection', { identifiers: chunk.map(function(x){ return x.id ? { id:x.id } : { name:x.n.split(' // ')[0] }; }) });
    (j.not_found || []).forEach(function(nf){ missing.push(nf.name || nf.id); });
    var byName = {};
    (j.data || []).forEach(function(c){ var s = slim(c); byName[s.n.toLowerCase()] = s; byName[s.id] = s;
      var front = s.n.split(' // ')[0].toLowerCase(); byName[front] = s; });
    chunk.forEach(function(x){
      var s = x.id ? byName[x.id] : byName[x.n.toLowerCase()];
      if(s){ var k = x.id || x.n.toLowerCase(); out[k] = s; cachePut('card4:' + k, s); }
    });
  }
  return { cards:out, missing:missing };
}
var combosP = null;
function loadCombos(){
  if(!combosP) combosP = fetch('combos.json').then(function(r){ if(!r.ok) throw new Error('combo list ' + r.status); return r.json(); });
  return combosP;
}

/* ============ card reading ============ */
function low(c){ return (c.o || '').toLowerCase().split(c.n.toLowerCase()).join('~'); }
function isLand(c){ return /\bLand\b/.test(c.type) && c.type.indexOf('//') < 0; }
function isBasic(c){ return /\bBasic\b/.test(c.type) && isLand(c); }
function anyNumber(c){ return /a deck can have any number of cards named/i.test(c.o); }
// A card's jobs, read off its rules text. Reminder text (cycling's "Draw a card"), a planeswalker's
// ultimate (loyalty cost 6 or more) and emblems are left out: they are not what the card does in a
// normal game. Loot and rummage of equal numbers are card selection, not card draw.
function jobText(c){
  return low(c).replace(/\([^)]*\)/g, '')
    .replace(/(?:^|\n)[\u2212-](?:[6-9]|\d\d+): [^\n]*/g, '\n')
    .replace(/you get an emblem with "[^"]*"\.?/g, '')
    .replace(/as though it were mana of any (one )?(color|type)/g, '')
    .replace(/draws? (a|one|two|three|four|x) cards?, then discards? \1 cards?|discards? (a|one|two|three) cards?[^.]*?\. if you do, draws? \2 cards?/g, ' ');
}
function rolesOf(c){
  var o = jobText(c), r = {};
  if(isLand(c)){ r.land = 1; return r; }
  var spell = /Instant|Sorcery/.test(c.type);
  if(!spell && (/add \{|add one mana|add (two|three|x) mana|adds? an additional \{|mana of any (one )?(color|type)/.test(o))) r.ramp = 1;
  if(/search your library for (up to (one|two|three) )?(a |an |two |three )?(basic )?(land|forest|plains|island|swamp|mountain|snow land)/.test(o)) r.ramp = 1;
  if(/put (a|an|up to (one|two|three)|two) (basic )?lands? cards? [^.]*onto the battlefield|you may play (an )?additional lands?/.test(o)) r.ramp = 1;
  if(!spell && /create (a|two|three|x) treasure/.test(o)) r.ramp = 1;
  if(/draws? (a|two|three|four|five|seven|x|that many|\w+) cards?|draw cards equal/.test(o) && !/each player draws a card/.test(o)) r.draw = 1;
  if(/exile the top [^.]*(you may (play|cast))|look at the top [^.]* put [^.]* into your hand/.test(o)) r.draw = 1;
  if(/search your library (and\/or graveyard |or graveyard )?for (a|an|up to \w+) (\w+ )?(\w+ )?card/.test(o) && !/(land|basic|forest|plains|island|swamp|mountain) card/.test(o)) r.tutor = 1;
  if(/(destroy|exile) (all|each) |all creatures get -|deals? (\d+|x) damage to each (other )?creature|return all (nonland |other )?(permanents|creatures)|each player sacrifices (all|\w+) (nonland )?(creatures?|permanents?)/.test(o)) r.wipe = 1;
  if(/(destroy|exile) (up to (one|two|three|x) )?(another )?target (?!(\w+ )?cards? (from|in) |player's graveyard|opponent's graveyard)|deals? (\d+|x|that much) damage to (any target|target creature|target (creature|player) or planeswalker|any other target)|counter target|return (up to one )?target (creature|nonland permanent|permanent|artifact|enchantment)[^.]* to (its|their) owner'?s? hand|target creature (an opponent controls )?gets -\d|fights? (target|another|up to)|target (player|opponent) sacrifices/.test(o)) r.removal = 1;

  if(!CL.status){ try{ var r = await fetch('/api/claude/status'); CL.status = r.ok ? await r.json() : { available:false }; }catch(e){ CL.status = { available:false }; } }
  return !!(CL.status.available && CL.status.signed_in);
}
function deckByJob(){
  var L = [];
  JOBS.forEach(function(role){
    var list = S.deck.filter(function(d){ return d.role === role; });
    if(!list.length) return;
    var counts = {}, order = [];
    list.forEach(function(d){ if(!counts[d.n]){ counts[d.n] = 0; order.push(d); } counts[d.n]++; });
    L.push(ROLE_NAMES[role] + ' (' + list.length + '): ' + order.map(function(d){ return (counts[d.n] > 1 ? counts[d.n] + ' ' : '') + d.n + (d.gc ? ' (Game Changer)' : ''); }).join(', '));
  });
  return L;
}
function tableLines(){
  var B = BRACKETS[S.bracket], lim = gcLimit(), L = [];
  var th = themeLabel();
  L.push('Commander: ' + S.cmd.n + (S.partner ? ' + ' + S.partner.n : '') + '. Colour identity: ' + (S.ci.join('') || 'colourless') + '.');
  L.push('Bracket ' + S.bracket + ' (' + B.name + '): ' + B.desc + ' Game Changer limit: ' + (lim === Infinity ? 'none' : lim) + '.');
  L = L.concat(budgetLines());
  L.push('Strategy: ' + th + '.' + (S.wins.length ? ' Likes to win by: ' + S.wins.map(function(w){ return WINS.filter(function(x){ return x[0] === w; })[0][1].toLowerCase(); }).join(', ') + '.' : ''));
  if(lines(S.refuseText).length) L.push('Never add: ' + lines(S.refuseText).join(', ') + '.');
  if(rejectLine()) L.push(rejectLine());
  if(S.meta.length || S.metaText) L.push('About the table: ' + S.meta.concat(S.metaText ? [S.metaText] : []).join('; ') + '.');
  return L;
}
// Said to Claude in every prompt: money is no object, the bracket (as his table bends it) is.
function budgetLines(){
  var L = ['Budget is no object. Price never matters: pick the strongest card for the job, expensive staples included. The Game Changer limit and bracket rules still apply.'];
  var hl = houseLines();
  if(hl.length) L.push('House rules at his table, these override the bracket: ' + hl.join('; ') + '.');
  if(gcMode() === 'mine') L.push('He chose his own Game Changers: ' + ((S.gcPick || []).join(', ') || 'none') + '. Never suggest any other Game Changer.');
  return L;
}
function roundPrompt(job){
  var open = openSlots(job), n = Math.min(12, Math.max(6, open * 2)), passed = S.draft.passed[job] || [];
  var L = ['You are helping Tom build a Magic: The Gathering Commander deck one job at a time. He plays at a kitchen table with friends.', ''];
  L = L.concat(tableLines());
  L.push('Game Changers in the deck now: ' + draftGcs() + '.');
  L.push('', 'Picked so far, ' + S.deck.length + ' of ' + deckSlots() + ':');
  L = L.concat(S.deck.length ? deckByJob() : ['(nothing yet)']);
  L.push('', 'This round\'s job: ' + ROLE_NAMES[job] + '. ' + JOB_DEF[job] + ' ' + open + ' slot' + (open > 1 ? 's' : '') + ' open.');
  if(passed.length) L.push('He already passed on these for this job, never suggest them: ' + passed.join(', ') + '.');
  L.push('', 'Suggest ' + n + ' cards for this job, best first. Judge each one by how it works with the commander and the cards picked so far, not by the job alone.');
  L.push('Rules: legal in Commander, inside the colour identity, not already picked, not on the never-add list, released already, within the Game Changer limit and the bracket rules.' + (job === 'lands' ? ' Nonbasic lands only.' : ' No lands.'));
  L.push('why is one sentence saying how the card works with the rest of this deck. Plain English, no em dashes.');
  L.push('', 'Answer with JSON only, no other words, in exactly this shape:', '{"cards": [{"name": "Card A", "why": "..."}]}');
  return L.join('\n');
}
async function askRound(job){
  CLR.busy[job] = 1; CLR.err[job] = '';
  var box = S.step === 4 && main.querySelector('.clround');
  if(box && S.draft.round && S.draft.round.job === job) box.outerHTML = claudeRoundHtml(job);
  try{
    var mine = CUR, r = await fetch('/api/claude/ask', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ prompt:roundPrompt(job) }) });
    var j = await r.json();
    if(CUR !== mine) return;
    if(j.error) throw new Error(j.error);
    await readRound(job, j.text);
  }catch(e){ CLR.err[job] = e.message; }

}
// Claude's names are checked like any other card before they are dealt.
async function readRound(job, text){
  var a = (text || '').indexOf('{'), b = (text || '').lastIndexOf('}'), j;
  if(a < 0 || b < a) throw new Error('That answer has no cards in it. Paste Claude\'s whole answer.');
  try{ j = JSON.parse(text.slice(a, b + 1)); }catch(e){ throw new Error('Claude\'s answer could not be read. Ask it again for JSON only.'); }
  var want = (Array.isArray(j.cards) ? j.cards : []).filter(function(x){ return x && x.name; }).slice(0, 16);
  var todo = want.filter(function(x){ return !poolCard(String(x.name)); }).map(function(x){ return { n:String(x.name) }; });
  var got = todo.length ? await sfCollection(todo) : { cards:{} };
  var inDeck = {}; S.deck.forEach(function(d){ inDeck[d.n] = 1; });
  var ok = [], dropped = [], gcs = draftGcs(), named = {};
  want.forEach(function(x){
    var nm = String(x.name), c = poolCard(nm) || got.cards[nm.toLowerCase()];
    if(!c){ dropped.push(nm + ' (not found)'); return; }
    c = inPool(Object.assign({}, c));
    if(named[c.n]) return;
    named[c.n] = 1;
    var why = '';
    if(inDeck[c.n]) why = 'already picked';
    else if(unreleased(c)) why = 'not out yet';
    else if(!allowed(c)) why = c.legal !== 'legal' ? 'not legal' : !withinCI(c) ? 'outside the colours' : 'breaks a rule you set';
    else if((job === 'lands') !== isLand(c)) why = job === 'lands' ? 'not a land' : 'a land';
    else if(isGC(c) && gcs >= gcLimit()) why = 'Game Changer over the limit';
    if(why){ dropped.push(c.n + ' (' + why + ')'); return; }
    ok.push({ n:c.n, why:String(x.why || ''), c:c });
  });
  S.draft.cl[job] = { cards:ok, dropped:dropped, at:Date.now() };
  // Claude's cards join the round on the table if it is still this job's.
  var R = S.draft.round;
  if(R && R.job === job){
    var have = {}; R.cards.forEach(function(x){ have[x.n] = 1; });
    var add = claudeUnused(job).filter(function(x){ return !have[x.n]; }).slice(0, Math.max(2, Math.ceil(R.cards.length / 2)));
    add.forEach(function(x){ R.cards.unshift({ n:x.n, src:'claude', why:x.why }); });
  }
  save();
}
function keepRound(){
  var D = S.draft, R = D.round; if(!R) return;
  var job = R.job, passed = D.passed[job] || (D.passed[job] = []), kept = 0;
  R.cards.forEach(function(x){
    var c = poolCard(x.n);

    if(c && inDeckAlready(c)) return;
    if(R.ticked.indexOf(x.n) >= 0 && c && openSlots(job) > 0){
      var e = entry(c, job);
      e.why = x.src === 'claude' && x.why ? 'Claude: ' + x.why : ROLE_NAMES[job] + '. ' + edhLine(c) + ' ' + fitLine(c);
      S.deck.push(e); kept++;

}
function fillJob(job){
  var open = openSlots(job); if(!open) return 0;
  var before = S.deck.length;
  if(job === 'lands'){
    var used = {}; S.deck.forEach(function(d){ used[d.n] = 1; });
    var ranked = S.pool.filter(function(c){ return allowed(c); }).sort(function(a, b){ return score(b) - score(a); });
    fillLands(S.deck, used, ranked, (jobHave().lands || 0) + open);
  } else {
    var gcs = draftGcs();
    rankedFor(job).forEach(function(c){
      if(openSlots(job) <= 0 || inDeckAlready(c)) return;
      if(isGC(c)){ if(gcs >= gcLimit()) return; gcs++; }
      var e = entry(c, job); e.why = ROLE_NAMES[job] + '. ' + edhLine(c) + ' ' + fitLine(c); S.deck.push(e);
    });
  }
  return S.deck.length - before;
}

function zoomCard(src){

function deckCards(){ return S.deck.map(cardOf).filter(Boolean); }
async function validate(combos){

  var total = S.deck.length + cmdNames.length;

  syncGc();

  (illegal.length ? r.fails : r.passes).push({ k:'legal', t:illegal.length ? 'Not legal in Commander: ' + illegal.join(', ') + '.' : 'Every card is legal in Commander (Scryfall).' });
  (outside.length ? r.fails : r.passes).push({ k:'ci', t:outside.length ? 'Outside the colour identity: ' + outside.join(', ') + '.' : 'Every card is inside ' + (S.ci.join('') || 'colourless') + '.' });

  var lim = gcLimit();
  (gcs.length > lim ? r.fails : r.passes).push({ k:'gc', t:'Game Changers: ' + gcs.length + ' (limit ' + (lim === Infinity ? 'none' : lim) + ' at bracket ' + S.bracket + ')' + (gcs.length ? ': ' + gcs.join(', ') : '') + '.' });

  r.combos = []; r.near = [];

    var names = {}; cmdNames.concat(S.deck.map(function(d){ return d.n; })).forEach(function(n){ names[n] = 1; names[n.split(' // ')[0]] = 1; });
    var idx = combos.names;
    combos.v.forEach(function(v){
      var miss = [];
      for(var i = 0; i < v[0].length; i++){ if(!names[idx[v[0][i]]]){ miss.push(idx[v[0][i]]); if(miss.length > 1) return; } }
      var cards = v[0].map(function(i){ return idx[i]; });
      var o = { cards:cards, tag:v[1], mvNeeded:v[2], inf:!!v[3], res:v[4], id:v[5], req:v[6], pop:v[7] || 0 };

    roleFix:JSON.parse(JSON.stringify(S.roleFix || {})) };

// Every entry remembers the deck it belongs to (its id and the very S it was taken from), so an

// Undo passes its own entry (undoTop), so it never reverses a later change.
function undoChange(want){

  if(!u || (want && want !== u)){
    if(want) toast('That change can no longer be undone here: another change came after it. Undo that one first, or change it back by hand.', { kind:'bad' });
    return false;
  }

    toast(ANALYSE.busy ? 'Wait for Analyse every deck to finish, then undo.' : 'That change belongs to another deck, so it was not undone.', { kind:'bad' });
    return false;
  }
  SWUNDO.pop();

  S.side = null; save(); afterEdit(); return true;
}
// An Undo for a toast: bound to the change just made, not to whatever is newest when pressed.
function undoTop(after){ var u = SWUNDO[SWUNDO.length - 1] || null; return function(){ if(!u) return false; var r = undoChange(u); if(r && after) after(); return r; }; }

// THE one way to change the 99 (round 3, parts B and E). outName and inCard: a swap. inCard null:
// a cut. outName null: an add. True, or why not. o (optional):
//   to:   where the card that leaves goes. Default: the side deck (a card that leaves the 99 is kept,
//         never lost). null only for Tom's own Cut. 'side' or 'maybe' for his "Move to" buttons.
//   over: an add may go past 100 (the Build list's "add a card", which then asks for a cut).
//   from: where the incoming card was tapped ('side', 'maybe' or ''). Default: the side deck when
//         the card is there (one physical card: it leaves the side deck, and on a swap the card
//         going out takes its place, so the side deck keeps its count). Considering always keeps
//         its card; the Deck tab marks it "In the deck".
// Basic lands never go to the side deck on their own (surplus basics just leave; the toast says so).
// Undo (undoChange) puts the deck, the side deck and Considering back exactly.
var LASTCHG = null;
function applyChange(outName, inCard, why, o){
  // What the swap does to the deckbuilding guidelines, read before the deck changes; the toast says it.
  var gd = guideDeltaText(outName, inCard, false);
  var r = changeDeck(outName, inCard, why, true, o);
  if(r === true){ if(LASTCHG) LASTCHG.guide = gd; afterEdit(); }
  return r;
}
// "Card draw 7 → 8 (aim 12)" for each guideline number a swap moves. html: coloured for the swap menu.
function guideDeltaText(outName, inCard, html){
  if(!window.ENGINE || !ENGINE.guideDelta || !S.cmd) return '';
  var list = []; try{ list = ENGINE.guideDelta(outName || null, inCard || null) || []; }catch(e){ return ''; }
  return list.map(function(x){
    var t = esc(x.label) + ' <b class="bs-num">' + x.from + ' &rarr; ' + x.to + '</b>' + (x.aim ? ' (aim ' + esc(x.aim) + ')' : '');
    return html ? '<span class="' + (x.better ? 'bs-pos' : 'bs-neg') + '">' + t + '</span>' : t;

}
// The role a card coming in takes: his own pick, else a land is a land, else the job of the card it
// replaces when it can do that job, else its own main job (so a ramp card that replaces a synergy
// card counts as ramp, and the job counts say so). The swap menu's previews use this too.
function roleForIn(c, outD){
  var role = roleFixOf(c.n);
  if(role) return role;
  if(isLand(c)) return 'lands';
  var R = c.roles || rolesOf(c);
  if(outD && outD.role !== 'lands' && outD.role !== 'synergy' && R[ROLE_KEY[outD.role]]) return outD.role;
  return primaryRole(c.roles ? c : Object.assign({}, c, { roles:R }));
}
var BOARD_TO = { side:'your side deck', maybe:'Considering' };

  if(x.out && x.inn){
    t = 'Swapped ' + o + ' out for ' + i + '.';

    else if(x.to === 'maybe') t += ' ' + o + ' is now in Considering.';

function changeDeck(outName, inCard, why, undo, o){

    for(k = S.deck.length - 1; k >= 0 && i < 0; k--) if(sameName(S.deck[k].n, outName) || sameName(outName, S.deck[k].n)) i = k;
    if(i < 0) return outName + ' is not in the deck.';
  }
  var e = null, outD = i >= 0 ? S.deck[i] : null;
  if(inCard){
    var c = typeof inCard === 'string' ? (poolCard(inCard) || { n:inCard }) : inCard;
    if(isBasicName(c.n)) e = { n:c.n, role:'lands', mv:0, why:'Basic land.', basic:true, prod:basicProd(c.n) };
    else {
      if(!c.type && !c.o) return 'There is no card data for ' + c.n + ' yet.';
      c = Object.assign({}, c); if(!c.stats) c.stats = {}; if(!c.roles) c.roles = rolesOf(c);
      c = inPool(c); if(!c.roles) c.roles = rolesOf(c); if(!c.stats) c.stats = {};
      if(sameName(c.n, S.cmd.n) || (S.partner && sameName(c.n, S.partner.n))) return c.n + ' is your commander.';
      if(unreleased(c)) return c.n + ' is not out yet.';
      if(c.legal !== 'legal') return c.n + ' is not legal in Commander.';
      if(!withinCI(c)) return c.n + ' is outside the deck\'s colours.';
      if(!anyNumber(c) && S.deck.some(function(d, j){ return j !== i && (sameName(d.n, c.n) || sameName(c.n, d.n)); })) return c.n + ' is already in the deck.';
      var gcs = S.deck.filter(function(d){ return d.gc; }).length - (outD && outD.gc ? 1 : 0);
      // o.trust: the card is already in his real deck (My deck now), so his own limits do not refuse it.
      if(!o.trust && isGC(c) && gcs >= gcLimit()) return c.n + ' is a Game Changer and the deck is at its limit of ' + gcLimit() + '.';
      if(!o.trust && !allowed(c)) return c.n + ' breaks a rule set for this deck (a refused card, mass land destruction at this bracket, or your own Game Changer picks).';

// Cards in `before` (a copy of S.deck) that are not in the deck now, by count. Basic lands left out.
function droppedCards(before, after){
  var m = {};
  before.forEach(function(d){ if(!d.basic && !isBasicName(d.n)) m[d.n] = (m[d.n] || 0) + 1; });
  (after || S.deck).forEach(function(d){ if(m[d.n]) m[d.n]--; });
  var out = [];
  Object.keys(m).forEach(function(n){ for(var k = 0; k < m[n]; k++) out.push(n); });

}
// A builder step that rewrites the list (rebuild, start again, Fix what failed, Claude's swaps):

  Object.keys(cameIn).forEach(function(n){ for(var k = 0; k < cameIn[n]; k++) if(!boardTake('side', n)) break; });

    (came.length && came.length <= 4 ? ' In came ' + came.map(b).join(', ') + '.' : came.length ? ' ' + came.length + ' cards came in.' : '');

/* ---------- the side deck and maybeboard he keeps here (S.boards) ---------- */
function boardList(b){ S.boards = S.boards || { side:[], maybe:[] }; return S.boards[b] || (S.boards[b] = []); }

var BOARD_WORD = { side:'side deck', maybe:'Considering' };

/* ---------- the Moxfield side: what changed, and text to paste ---------- */
function moxKey(n){ return String(n || '').toLowerCase().split(' // ')[0].trim(); }
function nowLists(){

    main:(S.deck || []).map(function(d){ return { n:d.n, q:1 }; }), side:B.side || [], maybe:B.maybe || [] };
}
function countMap(list){ var m = {}; (list || []).forEach(function(x){ var k = moxKey(x.n); if(!m[k]) m[k] = { n:x.n, q:0 }; m[k].q += x.q || 1; }); return m; }

/* ---------- the Moxfield feed (contract 1) ---------- */
var FEED = { p:null, data:null, src:'', at:0, err:'', busy:false, tried:false };
function feed(force){
  if(FEED.p && !force) return FEED.p;
  FEED.busy = true; drawMoxChip();
  var p = (async function(){
    var j = null, src = '';
    if(LOCAL){
      // The desktop server reads Moxfield live (about 7 s the first time, then kept 60 s).
      // A refresh asks it to skip that 60 s copy. Stuck for 25 s: use the nightly file instead.
      var ac = window.AbortController ? new AbortController() : null, tm = ac ? setTimeout(function(){ ac.abort(); }, 25000) : 0;
      try{ var r = await fetch('/api/moxfield/decks?user=' + encodeURIComponent(MOXUSER) +(force ? '&fresh=1' : ''), { cache:'no-store', signal:ac ? ac.signal : undefined });
        if(r.ok && /json/.test(r.headers.get('content-type') || '')){ j = await r.json(); src = 'live'; } }catch(e){ j = null; }
      clearTimeout(tm);
      // The feed is exactly Moxfield's deck search for him. A deck read by its id cannot tell deleted
      // from unlisted (Moxfield still serves a deleted deck), so a linked deck missing from the search
      // keeps its copy here with the "Not on Moxfield now" badge; it is never read back in by id.
    }
    if(!j || !Array.isArray(j.decks)){
      var r2 = await fetch(moxFeedFile(), { cache:'no-cache' });
      if(r2.status === 404) throw new Error('There is no deck list for Moxfield user ' + MOXUSER + ' yet. Lists are made every night for the names on the nightly list');
      if(!r2.ok) throw new Error('the deck list answered ' + r2.status);
      j = await r2.json(); src = 'file';
    }
    if(!j || !Array.isArray(j.decks)) throw new Error('the deck list could not be read');
    return { j:j, src:src };
  })();
  FEED.p = p.then(function(x){
    FEED.data = x.j; FEED.src = x.src; FEED.at = Date.now(); FEED.err = ''; FEED.busy = false; FEED.tried = true; drawMoxChip();
    return x.j;
  }, function(e){ FEED.err = e.message; FEED.busy = false; FEED.tried = true; FEED.p = null; drawMoxChip(); throw e; });
  return FEED.p;
}
function feedDeck(id){ return FEED.data && FEED.data.decks.filter(function(d){ return d.id === id; })[0] || null; }
function rowForMox(id){ return shelf().filter(function(r){ return r.mox && r.mox.id === id; })[0] || null; }

      if(!raw) raw = await sf('/cards/named?exact=' + encodeURIComponent(x.n)) || await sf('/cards/named?fuzzy=' + encodeURIComponent(x.n));

      if(old.bracket) S.bracket = old.bracket;

      if(old.name && old.mox && old.name !== old.mox.name) S.name = old.name;   // he renamed it here
      if(old.sum) S.sum = old.sum;
    }
    S.src = X.source || 'moxfield'; S.page = 'deck';
    if(X.from && X.from.url) S.from = { site:X.from.site || '', url:X.from.url, id:X.from.id || '', author:X.from.author || '' };
    var list = function(a){ return (a || []).map(function(x){ return { n:x.n, q:x.q || 1 }; }); };
    if(X.moxId) S.mox = { id:X.moxId, name:X.name || '', url:X.url || ('https://moxfield.com/decks/' + X.moxId), updated:X.updated || '',

// Look every new name up on Scryfall (one call per 75 names), then check who can be a commander.

    try{
      var res = await sfCollection(names.map(function(n){ return { n:n }; })), miss = [];
      names.forEach(function(n){ var c = res.cards[impKey(n)]; if(c){ IMP_CARDS[impKey(n)] = c; IMP_CARDS[impKey(c.n)] = c; } else miss.push(n); });

  if(w[0].length > 5) tries.push(w[0].slice(0, Math.ceil(w[0].length / 2)));
  tries.push(w[0].slice(0, 4));
  for(var i = 0; i < tries.length; i++){
    try{ var a = await sf('/cards/autocomplete?q=' + encodeURIComponent(tries[i])); ((a && a.data) || []).forEach(function(x){ if(pool.indexOf(x) < 0) pool.push(x); }); }catch(e){}

  var t = kind === 'archidekt' ? '<b>Archidekt does not let other sites read its decks.</b> Paste the list instead: on Archidekt, open the deck, use its Export to copy the list as text, then paste it under Paste a list.'
    : kind === 'other' ? '<b>Brewing Station reads Moxfield links only.</b> For a deck on ' + esc(host) + ', copy its list as text (most sites have an Export or Download button) and paste it under Paste a list.'
    : '<b>The web version only knows your public Moxfield decks, from last night\'s copy.</b> For any other deck, including an unlisted one of yours, paste the list: on Moxfield, open the deck, press More, then Export, then Copy for MTGO, and paste it under Paste a list. The Brewing Station app on your PC can read these links.';
  return '<div class="bs-callout bs-warn">' + ico('info') + '<div class="sh-err"><p>' + t + '</p>' + go + '</div></div>';
}
function impLinkHtml(){
  var K = IMPS.link;
  if(K.busy) return '<div class="bs-loading"><span class="bs-spin"></span>Reading the deck from Moxfield</div>';
  if(K.err) return '<div class="bs-callout bs-bad">' + ico('warn') + '<div class="sh-err"><p>' + esc(K.err) + '</p><button class="bs-btn bs-sm" type="button" data-impgopaste>Paste a list instead</button></div></div>';
  if(K.html) return K.html;
  var d = K.deck; if(!d) return '';
  var sum = function(l){ return (l || []).reduce(function(s, c){ return s + (c.q || 1); }, 0); };
  var cmd = (d.commanders || []).map(function(c){ return c.n; }), c0 = (d.commanders || [])[0], nM = sum(d.main);
  var art = c0 && c0.sid ? 'https://cards.scryfall.io/art_crop/front/' + c0.sid.charAt(0) + '/' + c0.sid.charAt(1) + '/' + c0.sid + '.jpg' : '';
  var dup = shelf().filter(function(r){ return r.from && r.from === d.url; })[0];
  return '<div class="sh-imp-cmd">' + (art ? '<img class="sh-cand-img" src="' + esc(art) + '" alt="">' : '') + '<div><b>' + esc(d.name) + '</b><small>' +
      (d.author ? 'By ' + esc(d.author) + ' on Moxfield' : 'On Moxfield') + (d.updated ? ', changed ' + esc(dateStr(d.updated)) : '') + '</small></div></div>' +
    impCountsHtml({ cmd:cmd, main:nM, side:sum(d.side), maybe:sum(d.maybe), comp:d.companions && d.companions[0] ? d.companions[0].n : '' }) +
    (cmd.length ? impTotalHtml(cmd.length + nM) : '<div class="bs-callout bs-bad">' + ico('warn') + '<p><b>This deck has no commander on Moxfield,</b> so it cannot come in from the link. Paste its list instead and pick the commander.</p></div>') +
    '<p class="bs-soft">It comes in as your own copy. Changes you make here do not go back to it.</p>' +
    (dup ? '<div class="bs-callout">' + ico('info') + '<div class="sh-err"><p>You imported this deck before, as <b>' + esc(deckTitle(dup)) + '</b>. Importing it again adds a second copy.</p><button class="bs-btn bs-sm" type="button" data-impopen="' + esc(dup.id) + '">Open ' + esc(deckTitle(dup)) + '</button></div></div>' : '');
}
// Read a deck link: his own Moxfield decks come from the feed (linked); on the PC anyone's public
// Moxfield deck comes from the desktop server; the web copy cannot read those, so it says what to do.
async function impReadLink(){
  var me = IMPS, K = me.link, v = ($('impUrl') || {}).value || '', L = parseDeckLink(v), seq = ++K.seq;
  K.deck = null; K.err = ''; K.html = ''; K.busy = false;
  if(!L){ K.err = v.trim() ? 'That is not a deck link. Copy the deck\'s address from the address bar, like moxfield.com/decks/abc123.' : 'Paste a deck link first.'; impDraw(); return; }
  if(L.site !== 'moxfield'){ K.html = impAdvice(L.site, L.host); impDraw(); return; }
  K.busy = true; impDraw();
  var fd = null;
  try{ await feed(); fd = feedDeck(L.id); }catch(e){}
  if(seq !== K.seq || me.closed) return;
  if(fd){
    K.busy = false; var row = rowForMox(fd.id);
    me.h.close();
    toast('<b>' + esc(fd.name) + '</b> is one of your Moxfield decks. ' + (row ? 'Opening it.' : 'Bringing it in, linked to Moxfield.'));
    openFromMox(fd.id, 'deck');
    return;
  }
  var d = null, err = '';
  if(LOCAL){
    try{
      var r = await fetch('/api/moxfield/deck?id=' + encodeURIComponent(L.id), { cache:'no-store' });
      if(/json/.test(r.headers.get('content-type') || '')){ var j = await r.json(); if(r.ok && j && Array.isArray(j.main)) d = j; else err = (j && j.error) || ('Moxfield answered ' + r.status + '.'); }
    }catch(e){}   // no desktop server here (the plain web copy): the advice below
  }
  if(seq !== K.seq || me.closed) return;
  K.busy = false;
  // One of his own decks that Moxfield's public list does not show (unlisted): it comes in linked,
  // like the others, so its changes can go back to Moxfield.
  if(d && d.author && FEED.data && String(d.author).toLowerCase() === String(FEED.data.user || MOXUSER).toLowerCase() && (d.commanders || []).length){
    if(!feedDeck(d.id)){ d.unlisted = true; FEED.data.decks.push(d); }
    me.h.close();
    toast('<b>' + esc(d.name) + '</b> is one of your Moxfield decks. ' + (rowForMox(d.id) ? 'Opening it.' : 'Bringing it in, linked to Moxfield.'));
    openFromMox(d.id, 'deck');
    return;
  }
  if(d) K.deck = d; else if(err) K.err = err; else K.html = impAdvice('moxfield');
  impDraw();
}
function impDraw(){
  var me = IMPS; if(!me || me.closed || !me.body) return;
  var ok = false;
  if(me.tab === 'paste'){
    var M = impModel(), box = $('impPrev'), a = document.activeElement, fk = a && a.hasAttribute && a.hasAttribute('data-fixin') ? a.getAttribute('data-fixin') : null, cf = a && a.id === 'impCmdIn';
    box.innerHTML = impPrevHtml(M);
    var own = impOwnDeck(M.picks);
    me.mox.hidden = !own;
    if(own){ me.mox.setAttribute('data-id', own.id); me.mox.textContent = (rowForMox(own.id) ? 'Open ' : 'Bring in ') + own.name + (rowForMox(own.id) ? '' : ' (stays linked)'); }
    me.go.textContent = own ? 'Import as a separate deck' : 'Import deck';
    me.go.className = 'bs-btn' + (own ? '' : ' bs-primary');
    // A redraw must not take the cursor away from a name he is typing.
    var back = fk != null ? Array.prototype.filter.call(box.querySelectorAll('[data-fixin]'), function(x){ return x.getAttribute('data-fixin') === fk; })[0] : cf ? $('impCmdIn') : null;
    if(back){ back.focus({ preventScroll:true }); try{ back.setSelectionRange(back.value.length, back.value.length); }catch(e){} }
    ok = M.ready;
  } else {
    $('impLinkOut').innerHTML = impLinkHtml();
    ok = !!(me.link.deck && (me.link.deck.commanders || []).length);
  }
  if(me.tab !== 'paste'){ me.mox.hidden = true; me.go.textContent = 'Import deck'; me.go.className = 'bs-btn bs-primary'; }
  me.go.disabled = !ok || me.running;
  impFoot();
}
function impFoot(){
  var me = IMPS;
  me.cancel.textContent = me.running ? 'Close' : 'Cancel';
  me.run.className = 'sh-imp-run' + (me.runErr && !me.running ? ' bs-bad' : '');
  me.run.innerHTML = me.running ? '<span class="bs-loading"><span class="bs-spin"></span>' + esc(me.step || 'Starting') + '</span>' : me.runErr ? esc(me.runErr) : '';
  if(me.running) me.go.disabled = true;
}
function impGo(){
  var me = IMPS, X; if(!me || me.running) return;
  if(me.tab === 'paste'){
    var M = impModel(); if(!M.ready) return;
    var list = function(l){ return l.map(function(x){ return { n:x.n, q:x.q }; }); };
    X = { name:($('impName').value || '').trim() || me.P.name || '', source:'paste', bracket:null,
      cmd:M.picks.map(function(n){ var c = impCard(n); return { n:c.n, sid:c.id }; }), companion:M.comp,
      main:list(M.main).concat(M.lost), side:list(M.side), maybe:list(M.maybe) };   // lost: kept so the Deck tab lists them as left out
  } else {
    var d = me.link.deck; if(!d || !(d.commanders || []).length) return;
    X = feedX(d); X.source = 'link'; X.from = { site:'moxfield', url:d.url, id:d.id, author:d.author || '' };
  }
  impRun(X);
}
async function impRun(X){
  var me = IMPS, h = me.h, title = X.name || shortName(X.cmd[0].n);
  if(IMPORT.busy){ me.runErr = 'Wait for ' + (IMPORT.name || 'the other deck') + ' to finish coming in, then press Import deck again.'; impFoot(); return; }
  me.running = true; me.step = 'Starting'; me.runErr = ''; impFoot();
  try{
    var id = await importList(X, function(t){ me.step = t; if(!me.closed) impFoot(); });
    me.running = false;
    var n = S.deck.length + (S.partner ? 2 : 1), stay = APP.view === 'decks';
    if(!h.closed) h.close();
    if(stay) navDeck(id, 'deck');
    toast('<b>' + esc(title) + '</b> is in: ' + n + ' card' + (n === 1 ? '' : 's') + '.' + (stay ? '' : ' Open it from Decks.'));
  }catch(e){
    me.running = false;
    if(h.closed){ if(!e.stale) toast('Could not import <b>' + esc(title) + '</b>: ' + esc(e.message) + '.', { kind:'bad', ms:9000 }); return; }
    me.runErr = e.stale ? 'Stopped before it finished. Press Import deck to try again.' : 'Could not import it: ' + e.message + '.';
    impDraw();
  }
}

/* ---------- the Deck page: Moxfield's layout, with the side deck and maybeboard ---------- */
function basicCardOf(n){ return BASIC_CARDS[n] || poolCard(n) || { n:n, prod:basicProd(n), type:'Basic Land', o:'', cost:'', mv:0, ci:[] }; }
function deckItems(){
  var by = {}, order = [];
  S.deck.forEach(function(d){
    if(!by[d.n]){ by[d.n] = { n:d.n, q:0, d:d, c:d.basic ? basicCardOf(d.n) : cardOf(d), board:'main', basic:!!d.basic }; order.push(d.n); }
    by[d.n].q++;
  });
  return order.map(function(k){ return by[k]; });
}
function itemBadges(it){
  var c = it.c, b = '';
  if(!c || it.basic) return '';
  // A Considering (or side deck) card that is also in the 99 stays on its board, marked (part E).
  if(it.board !== 'main' && it.board !== 'cmd' && S.deck.some(function(d){ return sameName(d.n, it.n) || sameName(it.n, d.n); })) b += '<span class="bs-badge bs-good">In the deck</span>';
  if(it.board === 'main' && it.d && it.d.gc) b += '<span class="bs-badge bs-bad">Game Changer</span>';
  if(it.board === 'main' && (S.comboNames || {})[it.n]) b += '<span class="bs-badge bs-info">Combo</span>';
  if(c.legal && c.legal !== 'legal' && !unreleased(c)) b += '<span class="bs-badge bs-bad">Not legal</span>';
  else if(unreleased(c)) b += '<span class="bs-badge bs-warn">Not out yet</span>';
  else if(c.ci && !withinCI(c)) b += '<span class="bs-badge bs-bad">Off colour</span>';
  return b;
}
function crowHtml(it){
  var c = it.c || {}, n = it.n;
  var lead = it.thumb ? '<img class="bs-crow-thumb" src="' + esc(it.thumb) + '" alt="">' : '<span class="bs-crow-mv">' + (c.mv != null ? c.mv : '') + '</span>';
  var mid = '<span class="bs-crow-main"><span class="bs-crow-n">' + (it.q > 1 ? '<span class="bs-crow-q">' + it.q + '</span>' : '') + esc(n) + '</span>' + (it.sub ? '<span class="bs-crow-s">' + esc(it.sub) + '</span>' : '') + '</span>';
  if(it.basic && it.board === 'main'){
    return '<div class="bs-crow bs-tap" role="button" tabindex="0" data-card="' + esc(n) + '" data-board="main">' + lead + mid + '<span class="bs-crow-end"><span class="sh-bas">' +
      '<button class="bs-ibtn bs-sm" type="button" data-bas="' + esc(n) + '" data-d="-1" aria-label="One fewer ' + esc(n) + '">' + ico('minus', 'bs-i16') + '</button>' +
      '<button class="bs-ibtn bs-sm" type="button" data-bas="' + esc(n) + '" data-d="1" aria-label="One more ' + esc(n) + '">' + ico('plus', 'bs-i16') + '</button></span></span></div>';
  }
  return '<button class="bs-crow" type="button" data-card="' + esc(n) + '" data-board="' + it.board + '">' + lead + mid + '<span class="bs-crow-end">' + itemBadges(it) + '</span></button>';
}
function ctileHtml(it){
  var c = it.c || {}, bad = itemBadges(it);
  return '<div class="bs-ctile"><button class="bs-ctile-pic" type="button" tabindex="-1" data-card="' + esc(it.n) + '" data-board="' + it.board + '" aria-label="' + esc(it.n) + '">' +
    (c.img ? '<img src="' + esc(c.img) + '" alt="' + esc(it.n) + '" loading="lazy">' : '<span class="bs-ctile-noimg">' + esc(it.n) + '</span>') +

function jobSub(it){ var fx = roleFixOf(it.n); return (ROLE_NAMES[it.d.role] || it.d.role) + (fx ? ' (your pick)' : ''); }
function deckGroups(lv){
  var items = deckItems(), groups = [];
  var cmds = [S.cmd].concat(S.partner ? [S.partner] : []).map(function(c){
    var pc = poolCard(c.n) || c;
    return { n:c.n, q:1, c:pc, board:'cmd', thumb:lv.p ? '' : (c.img || '').replace('/normal/', '/art_crop/'), sub:typeLine(c) };
  });
  groups.push({ t:S.partner ? 'Commanders' : 'Commander', items:cmds });
  if(lv.g === 'job'){
    ['synergy', 'ramp', 'tutor', 'draw', 'removal', 'wipes', 'protection', 'wincon', 'lands'].forEach(function(g){
      var l = items.filter(function(it){ return it.d.role === g; }).sort(function(a, b){ return (a.c ? a.c.mv : 0) - (b.c ? b.c.mv : 0) || a.n.localeCompare(b.n); });
      l.forEach(function(it){ it.sub = it.basic ? 'Basic land' : typeShort(it.c) + (roleFixOf(it.n) ? ', your pick' : ''); });
      if(l.length) groups.push({ t:ROLE_NAMES[g], items:l });
    });
  } else {
    var byT = {};
    items.forEach(function(it){ var t = typeGroup(it.d); (byT[t] = byT[t] || []).push(it); it.sub = it.basic ? 'Basic land' : jobSub(it); });
    TYPE_GROUPS.forEach(function(t){
      var l = (byT[t] || []).sort(function(a, b){ return a.basic - b.basic || a.n.localeCompare(b.n); });
      if(l.length) groups.push({ t:GROUP_PLURAL[t] || t, items:l });
    });
  }
  [['side', 'Side deck'], ['maybe', 'Considering']].forEach(function(b){
    var l = (S.boards && S.boards[b[0]] || []).map(function(x){
      var c = isBasicName(x.n) ? basicCardOf(x.n) : poolCard(x.n);
      return { n:x.n, q:x.q, c:c, board:b[0], sub:c ? (isBasicName(x.n) ? 'Basic land' : (ROLE_NAMES[csRoleOf(c)] || 'Synergy') + ', ' + typeShort(c)) : 'No card data yet' };
    });
    if(l.length) groups.push({ t:b[1], items:l, board:b[0] });
  });
  return groups;
}
function drawDeckPage(){

    return;
  }
  if(!S.deck.length){
    main.innerHTML = '<div class="bs-empty">' + ico('deck') + '<h3 class="bs-empty-title">No cards yet</h3><p>' + esc(shortName(S.cmd.n)) + ' is waiting for its 99. Plan and pick them on the Build tab.</p><div class="bs-acts"><a class="bs-btn bs-primary" href="#d=' + CUR + '&amp;p=build">Go to Build</a></div></div>';
    return;
  }
  if(!S.pool){
    main.innerHTML = loadingHtml('Loading the card data for this deck');
    ensurePool(poolStepUI).then(function(){ if(tok === RENDER_N) drawDeckPage(); }, function(e){
      if(tok !== RENDER_N || e.stale) return;

  var cnt = total === 100 ? '<span class="bs-count">100 cards</span>' : '<span class="bs-badge bs-warn">' + total + ' cards, ' + (total < 100 ? (100 - total) + ' short' : (total - 100) + ' too many') + '</span>';

    (S.mox ? 'Check the spelling on Moxfield, then bring it in again.' : 'Import the list again with the names fixed.') + '</p></div>';

  if(total !== 100 && snapN >= 0 && snapN + (S.partner ? 2 : 1) === total && !moxDiff().count) h += '<div class="bs-callout bs-warn">' + ico('warn') + '<p><b>Moxfield\'s Main Deck had ' + snapN + ' cards when this copy came in,</b> so the deck has ' + total + '. ' +
    (total > 100 ? 'Cut ' + (total - 100) + ' here or on Moxfield.' : 'Add ' + (100 - total) + ' here or on Moxfield.') + ' If you were still changing it on Moxfield, bring in the newer version once it shows.</p></div>';
  h += '<section><div class="bs-section-head"><h2 class="bs-h2">The deck</h2>' + cnt + '<div class="bs-acts">' +
    '<div class="bs-seg" role="group" aria-label="Show as"><button type="button" data-lv="p:0"' + (!lv.p ? ' class="on" aria-pressed="true"' : ' aria-pressed="false"') + '>List</button><button type="button" data-lv="p:1"' + (lv.p ? ' class="on" aria-pressed="true"' : ' aria-pressed="false"') + '>Pictures</button></div>' +
    '<div class="bs-seg" role="group" aria-label="Group by"><button type="button" data-lv="g:type"' + (lv.g === 'type' ? ' class="on" aria-pressed="true"' : ' aria-pressed="false"') + '>By type</button><button type="button" data-lv="g:job"' + (lv.g === 'job' ? ' class="on" aria-pressed="true"' : ' aria-pressed="false"') + '>By job</button></div>' +
    '</div></div>';
  var cnt2 = function(g){ return g.items.reduce(function(s, it){ return s + it.q; }, 0); };
  function drawGroups(gs){
    if(!gs.length) return '';
    if(lv.p) return '<div class="sh-pics">' + gs.map(function(g){ return '<section><div class="bs-group">' + esc(g.t) + ' <span class="bs-count">' + cnt2(g) + '</span></div><div class="bs-cgrid" style="--card-min:140px">' + g.items.map(ctileHtml).join('') + '</div></section>'; }).join('') + '</div>';

  h += '</div><aside class="bs-side bs-sticky" id="deckSide"></aside></div>';

  drawDeckSide();

// Pictures for the basic lands (they are not in the pool): looked up once, from the cache after that.
function loadBasicPics(){
  var need = {}; S.deck.forEach(function(d){ if(d.basic && !BASIC_CARDS[d.n]) need[d.n] = 1; });
  var names = Object.keys(need); if(!names.length) return;
  var tok = RENDER_N;
  sfCollection(names.map(function(n){ return { n:n }; })).then(function(r){
    names.forEach(function(n){ var c = r.cards[n.toLowerCase()]; if(c) BASIC_CARDS[n] = c; });
    if(tok === RENDER_N && APP.view === 'deck' && S.page === 'deck') drawDeckPage();
  }, function(){});
}
function onDeckClick(e){
  var t = e.target;
  var bas = t.closest('[data-bas]'); if(bas){ basicStep(bas.getAttribute('data-bas'), +bas.getAttribute('data-d')); return; }
  var lvb = t.closest('[data-lv]'); if(lvb){ var kv = lvb.getAttribute('data-lv').split(':'); setListView(kv[0], kv[1]); drawDeckPage(); return; }
  var cd = t.closest('[data-card]'); if(cd){ openCardSheet(cd.getAttribute('data-card'), { board:cd.getAttribute('data-board') || '' }); return; }
  var cp = t.closest('[data-copy-board]'); if(cp){ var b = cp.getAttribute('data-copy-board'), Bh = S.boards || {};
    var heads = ['Commander', 'Deck'].concat(S.companion ? ['Companion'] : [], (Bh.side || []).length ? ['Sideboard'] : [], (Bh.maybe || []).length ? ['Maybeboard (Considering)'] : []);
    copy(moxPaste(b), { all:'Copied the whole deck with ' + heads.slice(0, -1).join(', ') + ' and ' + heads[heads.length - 1] + ' headings, for a new Moxfield deck or another site.',
    deck:'Copied the 99 for the Main Deck tab, no commander line.', side:'Copied the side deck for the Sideboard tab.', maybe:'Copied Considering for the Considering tab.' }[b] || 'Copied.'); return; }
  if(t.closest('#moxNewer')){ refreshOpenDeck(); return; }
  if(t.closest('[data-now]')){ openNowSheet(); return; }
}

  if(r.view === 'deck') stopAnalyse();
  if(r.view === 'deck' && r.id !== CUR){
    if(!loadId(r.id)){ r = { view:'decks' }; toast('That deck is not on this device.'); }
    else switchDeck(r.id);
  }
  if(r.view === 'deck'){
    var p = r.page && pageOk(r.page) ? r.page : pageOk(S.page) ? S.page : (isImported() ? 'deck' : 'build');
    if(!S.cmd) p = 'build';
    if(S.page !== p){ S.page = p; save({ quiet:true }); }
  }
  APP.view = r.view; lsSet('forge.view', APP.view);
  var want = wantHash();
  if(want !== h) history.replaceState(history.state, '', want);
  LAST_HASH = location.hash;
  render();
  if(before !== APP.view + '|' + CUR + '|' + S.page) window.scrollTo(0, 0);
}
function navDeck(id, page){
  whenSettled(function(){
    var h = '#d=' + id + (page ? '&p=' + page : '');
    if(location.hash !== h) location.hash = h; else { LAST_HASH = null; route(); }
  });
}
window.addEventListener('popstate', function(){
  if(IGNORE_POP > 0){ IGNORE_POP--; if(!IGNORE_POP){ var w = POP_WAIT; POP_WAIT = []; w.forEach(function(f){ try{ f(); }catch(e){ if(window.console) console.error(e); } }); } return; }
  var top = SHEETS[SHEETS.length - 1];
  if(top && top.pushed){ top.popped = true; top.close(); return; }
  route();
});
window.addEventListener('hashchange', route);
window.addEventListener('resize', function(){ setHeadH(); });
/* ============ links open in Chrome ============ */
// In the Windows app, outside sites (Moxfield, EDHREC, Spellbook) open in Chrome, where he is
// signed in, instead of inside this window. The app itself stays where its saved decks live.
document.addEventListener('click', function(e){
  if(!LOCAL || e.defaultPrevented) return;
  var a = e.target.closest && e.target.closest('a[href]'); if(!a) return;
  var u = new URL(a.href, location.href);
  if(u.origin === location.origin || !/^https?:$/.test(u.protocol)) return;
  e.preventDefault();
  fetch('/api/open', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ url:u.href }) })
    .then(function(r){ return r.json(); })
    .then(function(j){ if(j.error) throw new Error(j.error); msg('Opened in Chrome.'); })
    .catch(function(){ window.open(u.href, '_blank', 'noopener'); });
});

/* ============ card names open the card sheet ============ */
// Capture phase, so a name inside a row that has its own click (a Build list row opens the swap
// sheet) opens the card, not the row. A control inside a card element (the +/- on a basic land
// row) keeps its own job.
document.addEventListener('click', function(e){
  var t = e.target; if(!t || !t.closest) return;
  var el = t.closest('[data-card],[data-pg-card]'); if(!el || el.closest('#head,.bs-menu')) return;
  var ctl = t.closest('button,a,input,select,textarea,label,[role=button]');
  if(ctl && ctl !== el && el.contains(ctl)) return;
  e.preventDefault(); e.stopPropagation();
  openCardFrom(el);
}, true);
// Names inside sentences are spans with role=button: Enter or Space opens them like a button.
document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter' && e.key !== ' ') return;
  var t = e.target; if(!t || !t.matches || !t.matches('.bs-cardlink[role=button]')) return;
  e.preventDefault(); t.click();
});

/* ============ start ============ */
// engine.js and pages.js load after this script, so the first draw waits for them.
function boot(){
  var v = lsGet('forge.view');
  APP.view = v === 'compare' || v === 'deck' ? v : 'decks';
  if(!parseHash(location.hash)){
    var h = APP.view === 'deck' && S.cmd ? '#d=' + CUR + '&p=' + (pageOk(S.page) ? S.page : 'deck') : APP.view === 'compare' && PG('compare') ? '#compare' : '#decks';
    history.replaceState(null, '', h);
  }
  startCardLinks();
  LAST_HASH = null; route();
  // Opened straight onto a deck: still read Moxfield, for the "newer on Moxfield" notes.
  if(!FEED.p && !FEED.tried) feed().then(redrawForFeed, redrawForFeed);
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
