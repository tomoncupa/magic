<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card Scanner</title>
<meta name="description" content="Scan your Magic cards with the phone camera into one collection, priced in pesos, ready for Moxfield.">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080B10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scanner">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Block, Motherbase's default theme: flat plates, hairlines do the separating,
   6px corners, Chakra Petch for headings, labels and numbers. */
:root{
  --bg:#080B10; --bg2:#0E141D; --bg3:#131B26; --bg4:#1B2634;
  --line:#1E2A38; --line2:#2B3A4D;
  --ink:#DBE7F0; --ink2:#B8C9D8; --ink3:#7F93A8;
  --brass:#F0B323; --brass-fg:#1A1206; --brass-soft:rgba(240,179,35,.10);
  --danger:#FF6B81; --good:#6EE7A8; --warn:#FFB347; --info:#7EE8FA;
  --s1:4px; --s2:6px; --s3:8px; --s4:12px; --s5:16px; --s6:22px;
  --t1:11px; --t2:13px; --t3:15px; --t4:19px; --t5:25px;
  --tap:44px; --r:6px; --cap:.08em;
  --disp:'Chakra Petch',system-ui,sans-serif;
  --ui:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.45;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;touch-action:manipulation;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}

.top{position:sticky;top:0;z-index:5;background:var(--bg2);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top,0px)) 16px 0}
.tabs{display:flex;gap:2px;max-width:760px;margin:var(--s2) auto 0}
.tabbtn{flex:1;min-height:var(--tap);font-family:var(--disp);font-weight:600;font-size:var(--t2);letter-spacing:var(--cap);text-transform:uppercase;color:var(--ink3);border-bottom:2px solid transparent;text-align:center}
.tabbtn.on{color:var(--brass);border-bottom-color:var(--brass)}
.toprow{display:flex;align-items:center;gap:var(--s3);max-width:760px;margin:0 auto}
.back{flex:none;width:var(--tap);height:var(--tap);margin-left:-12px;display:grid;place-items:center;font-family:var(--disp);font-size:28px;line-height:1;color:var(--ink2);text-decoration:none;border-radius:var(--r)}
.brand{font-family:var(--disp);font-weight:700;font-size:19px;color:var(--brass);line-height:1;letter-spacing:var(--cap);text-transform:uppercase}
.brand small{display:block;font-weight:500;font-size:10px;letter-spacing:.14em;color:var(--ink3);margin-top:4px}
.spacer{flex:1}

main{max-width:760px;margin:0 auto;padding:var(--s5) 16px calc(90px + env(safe-area-inset-bottom,0px))}
h3{font-family:var(--disp);font-size:var(--t1);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin:var(--s5) 0 var(--s2)}
p{margin:0 0 var(--s3)}
.note{color:var(--ink2);font-size:var(--t2)}
.small{font-size:var(--t1);color:var(--ink3)}
.warn{color:var(--warn)} .good{color:var(--good)}
.warnbar{padding:var(--s3) var(--s4);border:1px solid rgba(255,179,71,.45);border-radius:var(--r);color:var(--warn);font-size:var(--t2);margin-bottom:var(--s4)}

.btn{min-height:var(--tap);padding:0 var(--s5);border-radius:var(--r);background:var(--bg3);border:1px solid var(--line);color:var(--ink2);
  font-family:var(--disp);font-weight:600;letter-spacing:var(--cap);text-transform:uppercase;font-size:var(--t2);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn:hover{border-color:var(--line2);color:var(--ink)}
.btn.primary{border-color:var(--brass);color:var(--brass)}
.btn.fill{background:var(--brass);color:var(--brass-fg);border-color:var(--brass)}
.btn.bad{border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.4;cursor:default}
.btn.big{width:100%;min-height:52px;font-size:var(--t3)}

.search{position:relative;margin-top:var(--s3)}
.search input{width:100%;background:var(--bg3);border:1px solid var(--line2);border-radius:var(--r);padding:10px 12px;min-height:48px;font-size:17px}
.search input:focus{outline:none;border-color:var(--brass)}
.results{margin-top:var(--s2);border:1px solid var(--line2);border-radius:var(--r);background:var(--bg2);overflow:hidden}
.results:empty{display:none}
.res{display:grid;grid-template-columns:1fr auto auto;gap:var(--s3);align-items:center;width:100%;min-height:50px;padding:6px 12px;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.res:hover,.res.first{background:var(--bg3)}
.res .nm{font-weight:500;min-width:0}
.res .have{font-family:var(--disp);font-size:var(--t1);color:var(--brass);letter-spacing:var(--cap);text-transform:uppercase}
.res .plus{font-family:var(--disp);font-weight:700;font-size:20px;color:var(--brass);width:28px;text-align:center}
.nores{padding:12px;color:var(--ink3);font-size:var(--t2)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);margin-top:var(--s4)}
.stat{padding:var(--s3);background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);text-align:center;min-width:0}
.stat .v{font-family:var(--disp);font-size:22px;font-weight:700;color:var(--brass);line-height:1.1;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat .l{font-family:var(--disp);font-size:10px;letter-spacing:var(--cap);text-transform:uppercase;color:var(--ink3)}

.listhead{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s5)}
.listhead h3{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg2)}
.seg button{min-height:var(--tap);padding:0 12px;font-family:var(--disp);font-size:var(--t1);font-weight:600;letter-spacing:var(--cap);text-transform:uppercase;color:var(--ink3)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--brass-soft);color:var(--brass)}
.seg.wide{display:flex}
.seg.wide button{flex:1}

.crow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:var(--s3);align-items:center;width:100%;min-height:66px;padding:7px 0;border-bottom:1px solid var(--line);text-align:left;content-visibility:auto;contain-intrinsic-size:auto 66px}
.crow .th{width:40px;aspect-ratio:488/680;border-radius:3px;background:var(--bg3);display:block;object-fit:cover}
.crow .mid{min-width:0}
.crow .nm{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .sub{font-size:var(--t1);color:var(--ink3);display:flex;gap:4px 6px;align-items:center;flex-wrap:wrap;margin-top:2px;font-family:var(--disp);letter-spacing:.02em}
.crow .right{text-align:right;font-family:var(--disp);font-variant-numeric:tabular-nums}
.crow .px{font-weight:600;color:var(--ink);display:block}
.crow .q{font-size:var(--t2);color:var(--brass);font-weight:600}
.tag{font-family:var(--disp);font-size:10px;font-weight:600;letter-spacing:var(--cap);text-transform:uppercase;padding:0 5px;border-radius:3px;border:1px solid rgba(126,232,250,.4);color:var(--info);line-height:16px}
.tag.warn{border-color:rgba(255,179,71,.45);color:var(--warn)}
.empty{padding:var(--s6) var(--s5);text-align:center;color:var(--ink2);border:1px dashed var(--line2);border-radius:var(--r);margin-top:var(--s3)}
.foot{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s5)}
#pricenote{margin-top:var(--s3)}

/* Deck check */
.deckcard{padding:var(--s4) var(--s5);background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);margin-bottom:var(--s4)}
.deckcard .dn{font-family:var(--disp);font-weight:700;font-size:var(--t4);line-height:1.2;margin:2px 0}
.drow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:var(--s3);align-items:center;min-height:var(--tap);padding:4px 0;border-bottom:1px solid var(--line)}
.drow .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .q{font-family:var(--disp);font-weight:600;color:var(--brass)}
.drow .btn{padding:0 10px;font-size:var(--t1)}
details.more summary{min-height:var(--tap);display:flex;align-items:center;cursor:pointer;color:var(--ink2);font-size:var(--t2)}
.logrow{padding:var(--s3) 0;border-bottom:1px solid var(--line);font-size:var(--t2);color:var(--ink2)}
.logrow b{font-family:var(--disp);font-weight:600;color:var(--ink)}
.stats.two{grid-template-columns:repeat(3,1fr)}
.drow .acts{display:flex;gap:6px}
.drow .btn{min-width:var(--tap)}
.drow .nm small{display:block;font-size:var(--t1);font-weight:400;color:var(--info);overflow:hidden;text-overflow:ellipsis}
button.logrow{display:block;width:100%;min-height:var(--tap);text-align:left}
a.btn{text-decoration:none}
.lbl{font-family:var(--disp);font-size:var(--t1);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.lbl.gold{color:var(--brass)}
.mid{min-width:0}
.go{font-family:var(--disp);font-size:26px;line-height:1;color:var(--ink3)}
.tag.gold{border-color:rgba(240,179,35,.5);color:var(--brass)}
.one{margin-top:var(--s4)} .one .btn{width:100%}
/* The deck picker: one tile per deck, commander art on the left. */
.art{display:flex;gap:2px;width:84px;height:62px;border-radius:4px;overflow:hidden;background:var(--bg3)}
.art img{flex:1 1 0;min-width:0;height:100%;object-fit:cover;display:block}
.dtile{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:var(--s4);align-items:center;width:100%;min-height:78px;padding:var(--s3);margin-bottom:var(--s3);background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);text-align:left}
.dtile.on{border-color:var(--brass)}
.dtile .dn{display:block;font-family:var(--disp);font-weight:700;font-size:var(--t3);line-height:1.25;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtile .sub{display:block;font-size:var(--t1);line-height:1.5;color:var(--ink3)}
.dtile .sub.good{color:var(--good)} .dtile .sub.warn{color:var(--warn)}
.dtile .tag{display:inline-block;margin-top:4px}
.resume{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3);align-items:center;width:100%;min-height:56px;padding:var(--s3) var(--s4);margin-bottom:var(--s3);background:var(--brass-soft);border:1px solid var(--brass);border-radius:var(--r);text-align:left}
.resume b{display:block;font-family:var(--disp);font-weight:700;font-size:var(--t2);letter-spacing:var(--cap);text-transform:uppercase;color:var(--brass)}
.resume .small{display:block;color:var(--ink2)}
.resume .go{color:var(--brass)}
.backrow{margin:calc(-1 * var(--s3)) 0 var(--s2) -10px}
.backbtn{min-height:var(--tap);max-width:100%;padding:0 10px;display:inline-flex;align-items:center;gap:8px;border-radius:var(--r);font-family:var(--disp);font-weight:600;font-size:var(--t2);letter-spacing:var(--cap);text-transform:uppercase;color:var(--ink2)}
.backbtn b{font-size:26px;line-height:1;font-weight:500;margin-top:-3px}
.backbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dhead{display:grid;grid-template-columns:84px minmax(0,1fr);gap:var(--s4);align-items:center;padding:var(--s3);margin-bottom:var(--s4);background:var(--bg2);border:1px solid var(--line);border-radius:var(--r)}
.dhead .dn{font-family:var(--disp);font-weight:700;font-size:var(--t4);line-height:1.2;margin:1px 0}
/* Deck or side deck: two big choices. */
.bpick{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s4);align-items:center;width:100%;min-height:72px;padding:var(--s4) var(--s5);margin-bottom:var(--s3);background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);text-align:left}
.bpick .bn{display:block;font-family:var(--disp);font-weight:700;font-size:var(--t4);letter-spacing:var(--cap);text-transform:uppercase;color:var(--ink)}
.bpick .sub{display:block;font-size:var(--t2);color:var(--ink2);margin-top:2px}
.bpick .st{font-family:var(--disp);font-size:var(--t1);font-weight:600;letter-spacing:var(--cap);text-transform:uppercase;color:var(--ink3);text-align:right;line-height:1.4}
.bpick .st.good{color:var(--good)} .bpick .st.warn{color:var(--warn)}
/* Update Moxfield and what is in the box. */
.chg{display:grid;grid-template-columns:72px minmax(0,1fr);gap:var(--s3);align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.chg .k{font-family:var(--disp);font-weight:700;font-size:var(--t1);letter-spacing:var(--cap);text-transform:uppercase}
.chg.add .k{color:var(--good)} .chg.rem .k{color:var(--danger)}
.brow{display:grid;grid-template-columns:26px minmax(0,1fr);gap:var(--s3);padding:5px 0;border-bottom:1px solid var(--line);font-size:var(--t2)}
.brow .q{font-family:var(--disp);font-weight:600;color:var(--brass);text-align:right;font-variant-numeric:tabular-nums}
.brow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bsub{font-family:var(--disp);font-size:10px;letter-spacing:var(--cap);text-transform:uppercase;color:var(--ink3);margin:var(--s3) 0 2px}
details.more textarea.exp{margin-bottom:var(--s3)}
.chg small{color:var(--info);font-size:var(--t1)}
/* A seg that must fit 375px lets a long label wrap to two lines. */
.seg.wide button{white-space:normal;line-height:1.2;padding:4px 8px;text-align:center}
/* The recorded state: what is in the box, pile by pile. */
.state{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:0 var(--s4)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3);align-items:center;min-height:58px;padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .bn{display:block;font-family:var(--disp);font-weight:700;font-size:var(--t2);letter-spacing:var(--cap);text-transform:uppercase;color:var(--ink)}
.srow .sub{display:block;font-size:var(--t2);color:var(--ink2)}
.srow .sub.none{color:var(--ink3)}
.srow .n{font-family:var(--disp);font-weight:700;font-size:var(--t4);color:var(--brass);text-align:right;line-height:1.05;font-variant-numeric:tabular-nums}
.srow .n small{display:block;font-size:10px;font-weight:600;letter-spacing:var(--cap);text-transform:uppercase;color:var(--ink3)}
.notice{padding:var(--s3) var(--s4);margin-top:var(--s3);background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--info);border-radius:var(--r);font-size:var(--t2);color:var(--ink2)}
.notice b{color:var(--ink);font-weight:600}
.notice.warn{border-left-color:var(--warn)}
.notice .btn{width:100%;margin-top:var(--s3)}
/* A scanned pile: one row per card with its count and minus and plus. */
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3);align-items:center;min-height:52px;padding:4px 0;border-bottom:1px solid var(--line)}
.prow .nm{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .nm small{display:block;font-size:var(--t1);font-weight:400;color:var(--info);white-space:normal}
.prow .nm small.warn{color:var(--warn)}
.prow .stepper span{min-width:38px;font-size:var(--t3);color:var(--brass)}
.art.none{display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:26px;color:var(--ink3)}
.stats.pair{grid-template-columns:repeat(2,1fr)}
.btn.wide{width:100%}
.gap{margin-top:var(--s3)}

/* Sheets: a bottom sheet on a phone, a centred card on a wide screen,
   same as Motherbase's shared dialogs. */
.veil{position:fixed;inset:0;z-index:80;background:rgba(4,7,11,.72);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;margin:0 auto;width:100%;max-width:560px;max-height:92vh;max-height:92svh;display:flex;flex-direction:column;
  background:var(--bg2);border-top:1px solid var(--line2);border-radius:var(--r) var(--r) 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.sheet{top:50%;bottom:auto;left:50%;right:auto;transform:translate(-50%,-50%);width:min(560px,94vw);border:1px solid var(--line2);border-radius:var(--r)}}
.sheet-head{display:flex;align-items:center;gap:var(--s3);padding:var(--s4) var(--s5) var(--s3)}
.sheet-head h3{margin:0;flex:1;min-width:0}
.x{position:relative;width:32px;height:32px;border-radius:50%;background:var(--bg3);color:var(--ink2);font-size:14px;display:grid;place-items:center}
.x::after{content:'';position:absolute;left:50%;top:50%;width:var(--tap);height:var(--tap);transform:translate(-50%,-50%)}
.sheet-body{padding:0 var(--s5);overflow:auto;flex:1;min-height:0}
.sheet-foot{display:flex;gap:var(--s3);padding:var(--s4) var(--s5) var(--s5);border-top:1px solid var(--line);margin-top:var(--s4);flex-wrap:wrap}
.sheet-foot .btn{flex:1}
.cardview{display:grid;grid-template-columns:132px minmax(0,1fr);gap:var(--s4);align-items:start}
.cardview img{width:132px;border-radius:7px;background:var(--bg3);aspect-ratio:488/680;display:block}
.cardview .nm{font-family:var(--disp);font-weight:700;font-size:var(--t4);line-height:1.15}
.cardview .ty{font-size:var(--t2);color:var(--ink3);margin:4px 0 8px}
.price{font-family:var(--disp);font-weight:700;font-size:var(--t4);color:var(--brass)}
.price small{font-family:var(--ui);font-weight:400;font-size:var(--t1);color:var(--ink3)}
.how{font-size:var(--t2);color:var(--ink2);margin-top:6px}
.how.warn{color:var(--warn)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stepper button{width:var(--tap);height:var(--tap);font-family:var(--disp);font-size:20px;color:var(--ink2);background:var(--bg3);display:grid;place-items:center;text-align:center}
.stepper span{min-width:48px;text-align:center;font-family:var(--disp);font-weight:700;font-size:17px}
.prints{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:var(--s3);padding-bottom:var(--s3)}
.pt{display:flex;flex-direction:column;gap:3px;padding:4px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg3);text-align:center;min-width:0}
.pt img{width:100%;aspect-ratio:488/680;border-radius:4px;background:var(--bg4);display:block}
.pt .c{font-family:var(--disp);font-size:var(--t1);font-weight:600;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt .p{font-family:var(--disp);font-size:var(--t1);color:var(--ink3)}
.pt.on{border-color:var(--brass);background:var(--brass-soft)}
.pt.on .c{color:var(--brass)}
.setrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:var(--s3);align-items:center;width:100%;min-height:var(--tap);padding:4px 0;border-bottom:1px solid var(--line);text-align:left}
.setrow img{width:22px;height:22px;filter:invert(.85)}
.setrow .code{font-family:var(--disp);font-size:var(--t1);color:var(--ink3);text-transform:uppercase}
.setrow.on{color:var(--brass)}
textarea.exp{width:100%;min-height:150px;max-height:40vh;background:var(--bg3);border:1px solid var(--line2);border-radius:var(--r);padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--ink2);resize:vertical}

/* The scanner: the camera fills the screen, the card goes in a card-shaped
   frame, and its name goes in the gold bar at the top of the frame. */
.scanner{position:fixed;inset:0;z-index:70;background:#000;overflow:hidden}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scantop{position:absolute;top:0;left:0;right:0;display:flex;gap:var(--s3);justify-content:center;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0;z-index:2}

<body>
<header class="top">
  <div class="toprow">

    <div class="spacer"></div>
  </div>
  <nav class="tabs">
    <button class="tabbtn" data-act="tab" data-v="deck">Deck check</button>

  </nav>
</header>

<main>
  <div id="warn" class="warnbar" hidden></div>

  <section id="colview" hidden>

  <div class="search">
    <input id="q" type="search" placeholder="Or type a card name" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="Card name">

<div id="toast" class="toast" hidden role="status" aria-live="polite"><span id="toastmsg"></span><button class="btn" data-act="undo">Undo</button></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const DAY = 864e5;
const API = 'https://api.scryfall.com';
const RAR = {C:'Common', U:'Uncommon', R:'Rare', M:'Mythic', S:'Special', B:'Bonus'};
const front = n => n.split(' // ')[0];
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/æ/g, 'ae').replace(/['’]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const letters = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/æ/g, 'ae').replace(/[^a-z]/g, '');

/* ---------- storage ----------
   IndexedDB rather than localStorage: every page on tomoncupa.github.io shares
   one localStorage (Motherbase included), and a collection runs to thousands. */
const DB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('ktm-scan', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const read = async k => {
    const db = await open();
    return await new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
  };
  return {
    // undefined when nothing is stored or the read failed (caches: either way, fetch again).
    async get(k) { try { return await read(k); } catch (e) { return undefined; } },
    // Throws when the read failed, so the saved state is never mistaken for "nothing stored".
    read,
    ping: () => open(),
    async set(k, v) {
      try {
        const db = await open();
        await new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); });
        return true;
      } catch (e) { return false; }
    },
  };
})();

// items: one row per printing and finish, {k, id, name, set, setName, cn, rar,
// fin, fins, qty, sent, img, big, usd:{nonfoil,foil,etched}, pAt, at, how, sure}.
// sent is how many of the copies have already gone to Moxfield.
// check: the deck scan in progress, {src:'mox'|'table', id, part:'main'|'side',
// name, stamp, tally:{front name: copies}, at}. held: scans of other decks or
// parts put aside, by 'src|id|part'. deckSel: the last deck picked, {src, id, part}.
// deckLog: every finished check, newest first. A Moxfield one also keeps
// list (the box as scanned, full names, c:1 on the commander) and tally.
// A scan of the current state has mode:'state' in check and deckSel.
// states: each deck's recorded state by deck key, see recordPile.
// deckMode: which scan the deck screen shows, 'state' or 'check'.
const fresh = () => ({v: 1, items: [], picks: {}, set: null, foil: false, sort: 'new', fx: null, sentAt: 0, tab: 'deck', check: null, held: {}, deckSel: null, deckLog: [], states: {}, deckMode: 'state'});
let S = fresh(), saveT = null, saveOK = true, readFailed = false;
function save() { clearTimeout(saveT); saveT = setTimeout(flush, 250); }
async function flush() {
  clearTimeout(saveT); saveT = null;
  // The saved state could not be read at start: writing now would put an empty state over it.
  if (readFailed) { if (saveOK) { saveOK = false; renderWarn(); } return; }
  const ok = await DB.set('state', S);
  if (ok !== saveOK) { saveOK = ok; renderWarn(); }
}
document.addEventListener('visibilitychange', () => { if (document.hidden && saveT) flush(); });

/* ---------- Scryfall ----------
   One request at a time, a tenth of a second apart, as Scryfall asks. */
let apiChain = Promise.resolve(), apiLast = 0;
function api(path, body) {
  const run = async () => {
    const wait = apiLast + 110 - Date.now();
    if (wait > 0) await sleep(wait);
    apiLast = Date.now();
    const url = path.startsWith('http') ? path : API + path;
    const opts = body ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)} : {};
    let r = await fetch(url, opts);
    if (r.status === 429) { await sleep(1500); apiLast = Date.now(); r = await fetch(url, opts); }
    if (r.status === 404) return null;
    if (!r.ok) throw new Error('Scryfall ' + r.status);
    return r.json();
  };
  const p = apiChain.then(run, run);
  apiChain = p.catch(() => {});
  return p;
}
const num = v => v == null || v === '' ? null : +v;
const SPECIAL_FX = /showcase|extendedart|inverted|etched|shatteredglass|fullart|borderless/;
function slim(c) {
  const faces = c.card_faces || [];
  const pics = size => c.image_uris ? [c.image_uris[size]] : faces.map(f => f.image_uris && f.image_uris[size]).filter(Boolean);
  const fx = (c.frame_effects || []).slice().sort();
  return {
    id: c.id, name: c.name, set: c.set, setName: c.set_name, cn: c.collector_number,
    rar: (c.rarity || '?')[0].toUpperCase(), fin: c.finishes && c.finishes.length ? c.finishes : ['nonfoil'],
    usd: {nonfoil: num(c.prices && c.prices.usd), foil: num(c.prices && c.prices.usd_foil), etched: num(c.prices && c.prices.usd_etched)},
    img: pics('small'), big: pics('normal'), tl: c.type_line || (faces[0] && faces[0].type_line) || '',
    // Printings that look the same can only be told apart by the set symbol.
    look: [c.illustration_id || (faces[0] && faces[0].illustration_id) || c.id, c.frame, c.border_color, c.full_art ? 1 : 0, fx.join(','), c.textless ? 1 : 0].join('|'),
    reg: !c.promo && !c.full_art && /^(black|white)$/.test(c.border_color) && !fx.some(x => SPECIAL_FX.test(x)) &&
      /^(expansion|core|masters|draft_innovation|commander)$/.test(c.set_type || ''),
  };
}
const isBasic = p => /\bBasic\b.*\bLand\b/.test(p.tl);

// Every paper printing of one card, newest first.
const PR = new Map();
function getPrints(name) {
  if (PR.has(name)) return PR.get(name);
  const p = (async () => {
    const q = (s) => `/cards/search?q=${encodeURIComponent(s)}&unique=prints&order=released&dir=desc`;
    let j = name.includes('"') ? null : await api(q(`!"${name}" game:paper`));
    if (!j) {
      const c = await api(`/cards/named?exact=${encodeURIComponent(name)}`);
      if (!c) return [];
      j = await api(q(`oracleid:${c.oracle_id} game:paper`));
      if (!j) return [slim(c)];
    }
    const out = j.data.map(slim);
    let next = j.has_more ? j.next_page : null;
    for (let i = 0; next && i < 3; i++) {
      const k = await api(next);
      if (!k) break;
      out.push(...k.data.map(slim));
      next = k.has_more ? k.next_page : null;
    }
    return out;
  })();
  PR.set(name, p);
  p.catch(() => PR.delete(name));
  return p;
}

let SETS = null;
async function getSets() {
  if (SETS) return SETS;
  const j = await api('/sets');
  SETS = j.data.filter(s => !s.digital && s.card_count > 0 && !/^(token|memorabilia|minigame|alchemy|treasure_chest|vanguard)$/.test(s.set_type))
    .map(s => ({code: s.code, name: s.name, rel: s.released_at || '', icon: s.icon_svg_uri}))
    .sort((a, b) => b.rel.localeCompare(a.rel));
  return SETS;
}
// The names printed in one set, so a set pile is matched against a few
// hundred names instead of every card ever made.
const SETN = new Map();
let SETNAMES = null;
function setNames(code) {
  if (SETN.has(code)) return SETN.get(code);
  const p = (async () => {
    const names = new Set();
    let url = `/cards/search?q=${encodeURIComponent(`e:${code} game:paper`)}&unique=cards`;
    for (let i = 0; url && i < 10; i++) {
      const j = await api(url);
      if (!j) break;
      j.data.forEach(c => names.add(c.name));
      url = j.has_more ? j.next_page : null;
    }
    return names;
  })();
  SETN.set(code, p);
  p.catch(() => SETN.delete(code));
  return p;
}
async function loadSetNames() {
  SETNAMES = null;
  if (!S.set) return;
  const code = S.set.code;
  try {
    const n = await setNames(code);
    if (!S.set || S.set.code !== code) return;
    if (IDX) n.forEach(x => IDX.add(x));
    SETNAMES = n;
  } catch (e) {}
}

/* ---------- pesos ----------
   Scryfall's prices are the US market (TCGplayer). They are turned into pesos
   at today's rate, fetched twice a day at most. */
async function getRate() {
  if (S.fx && Date.now() - S.fx.at < DAY / 2) return;
  const sources = [
    ['https://open.er-api.com/v6/latest/USD', j => j.rates && j.rates.PHP],
    ['https://api.frankfurter.app/latest?from=USD&to=PHP', j => j.rates && j.rates.PHP],
  ];
  for (const [url, pick] of sources) {
    try {
      const r = await fetch(url);
      if (!r.ok) continue;
      const v = +pick(await r.json());
      if (v > 20 && v < 200) { S.fx = {rate: v, at: Date.now()}; save(); render(); return; }
    } catch (e) {}
  }
}
function money(usd) {
  if (usd == null || isNaN(usd)) return '—';
  const r = S.fx && S.fx.rate;
  if (!r) return '$' + usd.toFixed(2);
  const php = usd * r;
  if (!php) return '₱0';
  if (php < 10) return '₱' + php.toFixed(php < 1 ? 2 : 1);
  return '₱' + Math.round(php).toLocaleString('en-US');
}
const unit = it => it.usd ? it.usd[it.fin] : null;
const value = it => (unit(it) || 0) * it.qty;
const dateShort = t => new Date(t).toLocaleDateString('en-GB', {day: 'numeric', month: 'short'});

/* ---------- names ----------
   Scryfall's list of every card name (about 35,000), kept on the phone for a
   week. Each name is also filed under its three-letter pieces, so a misread
   finds its few likely names without comparing against all of them. */
let NAMES = null, NORM = null, IDX = null;
async function ensureNames() {
  if (NAMES) return NAMES;
  const c = await DB.get('names');
  if (c && c.list && Date.now() - c.at < 7 * DAY) NAMES = c.list;
  else {
    try {
      const j = await api('/catalog/card-names');
      NAMES = j.data.filter(n => !/^A-/.test(n));
      DB.set('names', {at: Date.now(), list: NAMES});
    } catch (e) {
      if (c && c.list) NAMES = c.list; else throw e;
    }
  }
  return NAMES;
}
function buildIndex(names) {
  const faces = [], tri = new Map(), known = new Set(), keys = new Set();
  const add = n => {
    if (known.has(n)) return;
    known.add(n);
    (n.includes(' // ') ? n.split(' // ') : [n]).forEach((part, f) => {
      const k = letters(part);
      // A face spelled like a card already filed ("Sol Ring // Sol Ring") could
      // never be told apart by its name, so the plain card keeps the name.
      if (k.length < 3 || keys.has(k)) return;
      keys.add(k);
      const i = faces.length, seen = new Set();
      for (let j = 0; j + 3 <= k.length; j++) {
        const g = k.substr(j, 3);
        if (seen.has(g)) continue;
        seen.add(g);
        let a = tri.get(g);
        if (!a) tri.set(g, a = []);
        a.push(i);
      }
      faces.push({k, n, f, t: seen.size});
    });
  };
  names.filter(n => !n.includes(' // ')).forEach(add);
  names.filter(n => n.includes(' // ')).forEach(add);
  return {faces, tri, add, cnt: null};
}
async function ensureIndex() {
  if (!IDX) IDX = buildIndex(await ensureNames());
  return IDX;
}

// Letters Tesseract mixes up cost less than a plain wrong letter.
const SUB = {};
for (const [a, b, c] of [['i','l',.4],['i','j',.5],['l','t',.6],['c','e',.6],['u','v',.6],['w','v',.5],['n','h',.6],['m','n',.6],['r','n',.7],['a','o',.7],['e','o',.7]]) SUB[a + b] = SUB[b + a] = c;
let DPA = new Float32Array(128), DPB = new Float32Array(128);
// How many edits it takes to find name f somewhere inside the read t.
function editsInside(f, t) {
  const m = f.length, n = t.length;
  if (DPA.length <= n) { DPA = new Float32Array(n + 64); DPB = new Float32Array(n + 64); }
  let prev = DPA, cur = DPB;
  for (let j = 0; j <= n; j++) prev[j] = 0;
  for (let i = 1; i <= m; i++) {
    cur[0] = i;
    const fc = f[i - 1];
    for (let j = 1; j <= n; j++) {
      const tc = t[j - 1];
      let v = prev[j - 1] + (fc === tc ? 0 : (SUB[fc + tc] || 1));
      if (prev[j] + 1 < v) v = prev[j] + 1;
      if (cur[j - 1] + 1 < v) v = cur[j - 1] + 1;
      cur[j] = v;
    }
    const s = prev; prev = cur; cur = s;
  }
  let best = m;
  for (let j = 0; j <= n; j++) if (prev[j] < best) best = prev[j];
  return best;
}
// The best name for one line of read text, with how far ahead of the runner-up it is.
function matchLine(line, only) {
  if (/^\s*[-—–]/.test(line)) return null;   // flavour text credits a speaker after a dash
  const t = letters(line);
  if (t.length < 3) return null;
  const {faces, tri} = IDX;
  if (!IDX.cnt || IDX.cnt.length < faces.length) IDX.cnt = new Uint16Array(faces.length + 256);
  const cnt = IDX.cnt, touched = [], seen = new Set();
  for (let j = 0; j + 3 <= t.length; j++) {
    const g = t.substr(j, 3);
    if (seen.has(g)) continue;
    seen.add(g);
    const a = tri.get(g);
    if (a) for (const i of a) if (cnt[i]++ === 0) touched.push(i);
  }
  const cands = [];
  for (const i of touched) {
    const e = faces[i], c = cnt[i];
    cnt[i] = 0;
    if (only && !only.has(e.n)) continue;
    if (e.k.length > t.length + 3 || e.k.length < t.length * 0.4) continue;
    if (c < Math.max(1, Math.ceil(e.t * 0.3))) continue;
    cands.push([c / e.t, i]);
  }
  cands.sort((a, b) => b[0] - a[0]);
  let a = null, b = null;
  for (let x = 0; x < cands.length && x < 120; x++) {
    const e = faces[cands[x][1]];
    const sim = 1 - editsInside(e.k, t) / e.k.length;
    const score = sim - 0.3 * (1 - Math.min(1, e.k.length / t.length));
    const r = {n: e.n, f: e.f, k: e.k, score, sim};
    if (!a || score > a.score) { if (a && a.n !== e.n) b = a; a = r; }
    else if (e.n !== a.n && (!b || score > b.score)) b = r;
  }
  if (!a) return null;
  a.margin = a.score - (b ? b.score : 0);
  a.read = line.trim();
  return a;
}
// first: a short list to try before every card ever made (the set being
// scanned, or the deck being checked). loose: a rougher read is enough when it
// lands on that short list, because it only has to beat a hundred names.
// The answer carries min, the score it needs to count.
function bestOf(text, first, loose) {
  const lines = text.split('\n').filter(l => letters(l).length >= 3);
  const run = only => {
    let best = null;
    for (const l of lines) { const m = matchLine(l, only); if (m && (!best || m.score > best.score)) best = m; }
    return best;
  };
  if (first) {
    const m = run(first), min = loose ? 0.7 : 0.82;
    if (m && m.score >= min && m.margin >= 0.07) { m.min = min; return m; }
  }
  const m = run(null);
  if (m) m.min = 0.82;
  return m;
}

/* ---------- reading the name ----------
   Tesseract reads the text on the phone; nothing is sent anywhere. The reader
   (about 4 MB) loads the first time and is kept for offline use after that. */
const TESS = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
let ocr = null, ocrLoading = null, ocrLog = null;
function loadOCR() {
  if (ocr) return Promise.resolve(ocr);
  if (!ocrLoading) {
    ocrLoading = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = TESS; s.onload = res; s.onerror = () => rej(new Error('no reader'));
      document.head.append(s);
    }).then(() => Tesseract.createWorker('eng', 1, {logger: m => ocrLog && ocrLog(m)}))
      .then(w => (ocr = w))
      .catch(e => { ocrLoading = null; throw e; });
  }
  return ocrLoading;
}
// Where the frame on screen sits in the camera's own pixels. The video is
// drawn with object-fit: cover, so part of the picture is off screen.
function guideInVideo(v) {
  const g = $('#guide').getBoundingClientRect(), r = v.getBoundingClientRect();

// reads: as shot (Llanowar Elves), grey with the contrast stretched (white on
// blue, Insectile Aberration), and that turned light for dark.

  const cv = grab(v, G.x, G.y, G.w, G.h, Math.round(G.w * k), Math.round(G.h * k));

/* ---------- which printing ----------
   The camera's picture of the card is compared with Scryfall's picture of each

   card is looked for at a few sizes and offsets inside the frame. */

/* ---------- deck check ----------

   has that was not scanned was taken out; whatever was scanned that the list
   lacks was put in. A Moxfield check ends with the edits to make on Moxfield
   and the whole board ready for its bulk edit, and is kept in the log so the
   box's current contents can be shown and copied. The table's deck is handed

/* Scan current state: one pile, no list to match. Every card read is counted;
   the review fixes counts and misreads before it is saved. */
function pileRows(d, tally, rec) {
  const md = d.md, side = d.part === 'side';
  const K = xs => new Set((xs || []).map(c => keyN(c.n)));
  const mMain = md ? K((md.commanders || []).concat(md.main || [])) : null, mSide = md ? K(md.side) : null;
  const pool = side && rec && rec.pool ? qMap(rec.pool) : null;
  const rows = [];
  for (const [n, q] of Object.entries(tally || {})) {
    const k = keyN(n), p = pool && pool.get(k);
    let flag = '', warn = false;
    if (pool && (!p || p.q < q)) { flag = p ? `${q - p.q} more than this deck had: new to it` : 'New to this deck'; warn = true; }
    else if (md && !mMain.has(k) && !mSide.has(k)) flag = 'Not in this deck on Moxfield';
    else if (md && side && !mSide.has(k)) flag = 'Moxfield has it in the main deck';
    else if (md && !side && !mMain.has(k)) flag = 'Moxfield has it in the side deck';
    rows.push({n, q, flag, warn});
  }
  return rows.sort(byN);
}
const prow = r => `<div class="prow"><span class="nm">${esc(front(r.n))}${r.flag ? `<small${r.warn ? ' class="warn"' : ''}>${r.flag}</small>` : ''}</span>

async function pileHTML() {

  const mdN = d.md ? (side ? sumQ(d.md.side) : sumQ(d.md.commanders) + sumQ(d.md.main)) : null, last = rec && rec[d.part] ? sumQ(rec[d.part].cards) : null;

    <div class="stat"><div class="v">${rows.length}</div><div class="l">Different</div></div>${third ? `<div class="stat"><div class="v">${third[0]}</div><div class="l">${third[1]}</div></div>` : ''}</div>`;
  if (!n) h += `<p class="note" style="margin-top:var(--s3)">Scan every card in the ${pw} pile${side ? '' : ', commander included'}. Every card the camera reads is counted. Fix misreads with the minus button before saving.</p>`;
  else {
    const flagged = rows.filter(r => r.flag), rest = rows.filter(r => !r.flag), title = flagged.length ? 'The rest' : 'Scanned';

async function savePile() {

/* ---------- deck check: finishing ---------- */
async function finishCheck() {
  if (!DECK || DECK.src !== 'mox' || !S.check) return;
  // A card the Moxfield deck does not name may be double-faced: the full name
  // comes from Scryfall's list, waited for briefly at most.
  if (!NAMES && Object.keys(S.check.tally).some(n => !DECK.full.has(keyN(n)))) await Promise.race([ensureNames().catch(() => {}), sleep(2500)]);
  if (!DECK || !S.check) return;
  const d = DECK, x = deckDiff(), cmdK = new Set(d.cards.filter(c => c.c).map(c => keyN(c.n))), list = [];
  for (const h of x.have.values()) {
    const n = fullName(h.n, d);
    if (d.part === 'main' && cmdK.has(keyN(h.n))) { list.push({n, q: 1, c: 1}); if (h.q > 1) list.push({n, q: h.q - 1}); }
    else list.push({n, q: h.q});
  }
  list.sort(byN);
  const e = {src: 'mox', id: d.id, part: d.part, deck: d.name, url: d.url, stamp: d.stamp, at: Date.now(),
    out: x.out.map(r => ({n: r.full || r.n, q: r.q})), put: x.put.map(r => ({n: fullName(r.n, d), q: r.q})),
    list, tally: Object.assign({}, S.check.tally)};
  S.deckLog = [e].concat(S.deckLog || []).slice(0, 60);
  // The box as scanned is also the deck's recorded state for that pile.
  recordPile({key: 'mox:' + d.id, name: d.name, src: 'mox', id: d.id, md: d.md}, d.part, list, 'checked', e.tally, e.at);
  S.check = null;
  save();
  DONE = e;
  swapTo('done');
}
async function tableFromState() {
  const info = await deckInfo(S.deckSel);
  const t = info && info.rec && info.rec.main ? await tableDeck().catch(() => null) : null;
  if (!t) return;
  const changes = tableChanges(t, toTally(info.rec.main.cards));
  if (!changes.length) return;
  await flush();
  location.href = '../table.html#scanned=' + b64url(JSON.stringify({name: t.name, stamp: t.stamp, changes}));
}
async function applyDeck() {
  const d = deckDiff();
  // Removals carry the table's own spelling of the name, which it matches exactly.
  const changes = d.out.map(x => ({n: x.full || x.n, q: -x.q})).concat(d.put.map(x => ({n: x.n, q: x.q})));
  if (!changes.length) return;
  const slimQ = xs => xs.map(x => ({n: x.n, q: x.q}));
  S.deckLog = [{src: 'table', part: 'main', deck: DECK.name, at: Date.now(), out: slimQ(d.out), put: slimQ(d.put)}].concat(S.deckLog || []).slice(0, 60);
  const payload = {name: DECK.name, stamp: DECK.stamp, changes};
  S.check = null;
  await flush();
  location.href = '../table.html#scanned=' + b64url(JSON.stringify(payload));
}
async function tableFromCheck(e) {
  const t = await tableDeck();
  if (!t) return;
  const changes = tableChanges(t, e.tally);
  if (!changes.length) return;
  await flush();
  location.href = '../table.html#scanned=' + b64url(JSON.stringify({name: t.name, stamp: t.stamp, changes}));

/* ---------- deck check: typing a name ----------
   For a card the camera will not read. The deck's own names come first. */
function deckNameHits(q) {
  const nq = norm(q);
  if (!nq || !DECK) return [];
  const toks = nq.split(' '), seen = new Set(), hits = [];
  for (const c of DECK.cards.concat(DECK.other || [])) {
    const k = keyN(c.n);
    if (seen.has(k)) continue;
    seen.add(k);
    const a = norm(c.n), f = norm(front(c.n)), w = a.split(' ');
    let rank = -1;
    if (f.startsWith(nq) || a.startsWith(nq)) rank = 0;
    else if (toks.every(t => w.some(x => x.startsWith(t)))) rank = 1;
    else if (nq.length >= 4 && a.includes(nq)) rank = 2;
    if (rank >= 0) hits.push([rank, c.n]);
  }
  hits.sort((a, b) => a[0] - b[0] || a[1].length - b[1].length || a[1].localeCompare(b[1]));
  return hits.map(x => x[1]);
}
async function onDeckType() {

  if (!inp || !box || !DECK) return;
  const q = inp.value;
  if (!q.trim()) { box.innerHTML = ''; dHits = []; return; }
  const local = deckNameHits(q);
  const draw = more => {
    dHits = local.concat(more.filter(n => !local.some(l => keyN(l) === keyN(n)))).slice(0, 7);
    box.innerHTML = dHits.map((n, i) => {
      const st = DECK.mode === 'state', inList = st ? DECK.known.has(keyN(n)) : DECK.cards.some(d => keyN(d.n) === keyN(n) && qOf(d) > 0), c = tallyOf(n);
      return `<button class="res${i ? '' : ' first'}" data-act="dadd" data-n="${esc(front(n))}"><span class="nm">${esc(front(n))}</span><span class="have">${inList ? (st ? 'In this deck' : 'In the list') : ''}${c ? (inList ? ' · ' : '') + c + ' counted' : ''}</span><span class="plus">+</span></button>`;
    }).join('') || '<div class="nores">No card by that name.</div>';
  };
  if (NORM) return draw(searchNames(q));
  if (local.length) draw([]); else box.innerHTML = '<div class="nores">Getting the list of card names…</div>';
  try { await ensureNorm(); } catch (e) { if (!local.length) box.innerHTML = '<div class="nores">Could not get the card names. It needs a connection the first time.</div>'; return; }

}

const queue = [];

function enqueue(job) { queue.push(job); if (!busy) runQueue(); }
async function runQueue() {
  busy = true;
  while (queue.length) {
    const j = queue.shift();
    let it = null;
    try {
      const r = await resolvePrint(j.name, j.face, j.cap);
      if (r) it = addItem(r.p, pickFinish(r.p, j.foil), r.how, r.sure);
      else toast(`Scryfall has no paper printing of ${front(j.name)}.`);
    } catch (e) {
      it = addPending(j.name, j.foil ? 'foil' : 'nonfoil');
    }
    if (it) {
      if (j.via === 'scan') { if (scan) { scan.hist.push(it.k); showLast(it); } }
      else toast(`${front(it.name)} added.`, () => takeOne(it.k));
    }
    render();
  }
  busy = false;
}

/* ---------- scanner ---------- */
let beepCtx = null;
function beep(silent) {
  try {
    beepCtx = beepCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (beepCtx.state === 'suspended') beepCtx.resume();
    const o = beepCtx.createOscillator(), g = beepCtx.createGain();
    o.frequency.value = 1320; g.gain.value = silent ? 0 : 0.08;
    o.connect(g); g.connect(beepCtx.destination); o.start(); o.stop(beepCtx.currentTime + 0.08);
  } catch (e) {}
}
function scanMsg(h) { $('#scanmsg').innerHTML = h; }
function renderChips() {
  $('#setchip').innerHTML = `Set <b>${esc(S.set ? S.set.code.toUpperCase() : 'Any')}</b>`;
  $('#setchip').classList.toggle('on', !!S.set);
  $('#foilchip').innerHTML = `Foil <b>${S.foil ? 'On' : 'Off'}</b>`;
  $('#foilchip').classList.toggle('on', S.foil);
}
let scan = null;
// mode 'deck' counts names for the deck check; 'col' adds to the collection.
let SCANOPENER = null;
async function startScan(mode) {
  closeSheet();
  beep(true);   // unlocks sound on iPhone while the tap still counts
  // The camera covers the page: it is a dialog, the page behind is out of reach, focus is on Done.
  SCANOPENER = document.activeElement;
  const sc = $('#scanner'); sc.setAttribute('role', 'dialog'); sc.setAttribute('aria-modal', 'true'); sc.setAttribute('aria-label', 'Camera');
  document.querySelectorAll('header.top, main').forEach(x => { x.inert = true; });
  $('#scanner').hidden = false;
  const done = sc.querySelector('[data-act=scanstop]'); if (done) try { done.focus({preventScroll: true}); } catch (e) {}
  document.body.style.overflow = 'hidden';
  $('#scanundo').hidden = true;
  $('#last').hidden = true;
  renderChips();
  $('.scantop').hidden = mode === 'deck';
  scan = {on: true, mode: mode || 'col', block: null, blockFeat: null, cand: null, hits: 0, pass: 0, n: 0, pauseUntil: 0, stream: null, hist: []};
  const me = scan;
  scanMsg('Starting the camera…');
  try {
    // As many pixels as the phone will give: the name needs them.
    me.stream = await navigator.mediaDevices.getUserMedia({audio: false, video: {facingMode: {ideal: 'environment'}, width: {ideal: 3840}, height: {ideal: 2160}}});
  } catch (e) {
    scanMsg('The camera is blocked. Allow it for this site (Settings › Apps › Safari › Camera), or type the name instead.');
    return;
  }
  if (!me.on) return me.stream.getTracks().forEach(t => t.stop());
  const v = $('#cam');
  v.srcObject = me.stream;
  await Promise.race([v.play().catch(() => {}), sleep(1500)]);
  scanMsg('Getting the list of every card name…');
  try { await ensureIndex(); } catch (e) { scanMsg('Could not get the card names. It needs a connection the first time.'); return; }
  if (me.mode === 'deck') DECKONLY = deckOnly();
  else if (S.set && !SETNAMES) loadSetNames();
  ocrLog = m => { if (me.on && /load/.test(m.status || '') && m.progress != null) scanMsg(`Loading the name reader, first time only… ${Math.round(m.progress * 100)}%`); };
  scanMsg('Loading the name reader…');
  try { await loadOCR(); } catch (e) { scanMsg('Could not load the name reader. It needs a connection the first time.'); return; }
  await ocr.setParameters({tessedit_pageseg_mode: '11'});
  if (!me.on) return;
  scanMsg('Hold a card in the frame with its <b>name in the gold bar</b>.');
  while (me.on) {
    if (Date.now() < me.pauseUntil || v.readyState < 2 || !v.videoWidth || document.querySelector('.sheet')) { await sleep(120); continue; }
    // The card just counted stays counted until the picture in the frame
    // changes: another card, or none. A blank read never frees it, because a
    // card still in the frame can read blank for a moment.
    if (me.block) {
      if (corr(guideFeat(v), me.blockFeat) >= 0.55) { await sleep(150); continue; }
      me.block = null;
    }
    let text = '';
    try { const cv = cropCard(v, me.pass); text = topLines((await ocr.recognize(cv)).data, cv.height); } catch (e) { await sleep(300); continue; }
    if (!me.on) break;
    const m = letters(text).length >= 4 ? bestOf(text, me.mode === 'deck' ? DECKONLY : SETNAMES, me.mode === 'deck') : null;
    if (!m || m.score < m.min || m.margin < 0.07) { me.cand = null; me.hits = 0; me.pass = (me.pass + 1) % 3; continue; }
    if (me.cand === m.n) me.hits++; else { me.cand = m.n; me.hits = 1; }
    const strong = m.score >= 0.95 && m.margin >= 0.15 && m.k.length >= 8;
    if (me.hits < 2 && !strong) continue;
    const cap = me.mode === 'deck' ? null : captureCard(v);
    me.block = m.n; me.blockFeat = guideFeat(v); me.cand = null; me.hits = 0; me.n++;
    me.pauseUntil = Date.now() + 700;
    beep();
    const g = $('#guide'); g.classList.add('hit'); setTimeout(() => g.classList.remove('hit'), 500);
    if (me.mode === 'deck') { const n = front(m.n); countDeck(n, 1); me.hist.push(n); showLastDeck(n); continue; }
    scanMsg(`<b>${esc(front(m.n))}</b> · finding the printing…`);
    enqueue({name: m.n, face: m.f, cap, foil: S.foil, via: 'scan'});
  }
}

/* ---------- typing a name ---------- */
async function ensureNorm() {
  if (!NORM) { await ensureNames(); NORM = NAMES.map(n => ({n, a: norm(n), f: norm(front(n)), w: norm(n).split(' ')})); }
  return NORM;
}
function searchNames(q) {
  const nq = norm(q);
  if (!nq || !NORM) return [];
  const toks = nq.split(' '), hits = [];
  for (const e of NORM) {
    let rank = -1;
    if (e.f.startsWith(nq) || e.a.startsWith(nq)) rank = 0;
    else if (toks.every(t => e.w.some(w => w.startsWith(t)))) rank = 1;
    else if (nq.length >= 4 && e.a.includes(nq)) rank = 2;
    if (rank >= 0) hits.push([rank, e.n]);
  }
  hits.sort((a, b) => a[0] - b[0] || a[1].length - b[1].length || a[1].localeCompare(b[1]));
  return hits.slice(0, 7).map(h => h[1]);
}
let lastHits = [];
async function onType() {
  const q = $('#q').value;
  if (!q.trim()) { $('#results').innerHTML = ''; lastHits = []; return; }
  if (!NORM) {
    $('#results').innerHTML = '<div class="nores">Getting the list of card names…</div>';
    try { await ensureNorm(); } catch (e) { $('#results').innerHTML = '<div class="nores">Could not get the card names. It needs a connection the first time.</div>'; return; }
    if ($('#q').value !== q) return;
  }
  lastHits = searchNames(q);
  $('#results').innerHTML = lastHits.length
    ? lastHits.map((n, i) => {
        const have = S.items.filter(x => x.name === n).reduce((s, x) => s + x.qty, 0);
        return `<button class="res${i ? '' : ' first'}" data-act="addname" data-n="${esc(n)}"><span class="nm">${esc(n)}</span><span class="have">${have ? 'have ' + have : ''}</span><span class="plus">+</span></button>`;
      }).join('')
    : '<div class="nores">No card by that name.</div>';
}
function addByName(n) {
  $('#q').value = ''; $('#results').innerHTML = ''; lastHits = [];
  enqueue({name: n, face: 0, cap: null, foil: false, via: 'typed'});
}

/* ---------- sheets ---------- */
// A sheet adds a history entry, so a phone's Back closes it (even on the first screen) instead of
// leaving the scanner. Closing it another way steps back over that entry; anything that navigates
// meanwhile waits for that step (SHEETPOP, POPQ). Focus goes into the sheet, Tab stays inside it,
// and closing puts focus back on the button that opened it.
let SHEETPUSHED = false, SHEETPOP = 0, POPQ = [], SHEETOPENER = null;
function openSheet(title, body, foot) {
  const replacing = !!document.querySelector('.sheet');
  if (replacing) closeSheet(true, true); else SHEETOPENER = document.activeElement;
  const veil = document.createElement('div'); veil.className = 'veil'; veil.dataset.act = 'close';
  const sh = document.createElement('div'); sh.className = 'sheet'; sh.setAttribute('role', 'dialog'); sh.setAttribute('aria-modal', 'true');
  sh.setAttribute('aria-labelledby', 'sheettitle'); sh.tabIndex = -1;
  sh.innerHTML = `<div class="sheet-head"><h3 id="sheettitle">${esc(title)}</h3><button class="x" data-act="close" aria-label="Close">✕</button></div>
    <div class="sheet-body" id="sbody">${body}</div><div class="sheet-foot" id="sfoot"${foot ? '' : ' hidden'}>${foot || ''}</div>`;
  document.body.append(veil, sh);
  if ($('#scanner').hidden) document.body.style.overflow = 'hidden';
  try { sh.focus({preventScroll: true}); } catch (e) {}
  if (!replacing && !SHEETPUSHED) { const push = () => { if (!document.querySelector('.sheet')) return; try { history.pushState(Object.assign({}, history.state || {}, {sheet: 1}), ''); SHEETPUSHED = true; } catch (e) {} }; if (SHEETPOP) POPQ.push(push); else push(); }
}
// fromPop: Back already removed its entry. keep: another sheet takes its place (entry and opener stay).
function closeSheet(fromPop, keep) {
  sheetK = null;
  const had = !!document.querySelector('.sheet');
  document.querySelectorAll('.veil,.sheet').forEach(n => n.remove());
  if ($('#scanner').hidden) document.body.style.overflow = '';
  if (keep || !had) return;
  if (SHEETPUSHED && !fromPop) { SHEETPUSHED = false; SHEETPOP++; history.back(); }
  const op = SHEETOPENER; SHEETOPENER = null;
  if (op && op.focus && document.contains(op)) try { op.focus({preventScroll: true}); } catch (e) {}
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  const sh = document.querySelector('.sheet'); if (!sh || !$('#scanner').hidden) return;
  const f = [...sh.querySelectorAll('a[href],button,input,select,textarea,summary,[tabindex]:not([tabindex="-1"])')].filter(x => !x.disabled && x.tabIndex >= 0 && x.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (!sh.contains(document.activeElement) || document.activeElement === sh) { e.preventDefault(); (e.shiftKey ? last : first).focus(); }
  else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
let sheetK = null;
function openItem(k) {

        <div class="price">${money(u)} <small>each${u != null ? ` · $${u.toFixed(2)} US` : ''}</small></div>
        <div class="how${it.sure ? '' : ' warn'}">${esc(HOW[it.how] || '')}</div>

/* ---------- Moxfield ----------
   Moxfield's collection import takes pasted text or its own CSV. Only copies
   not sent before go by default, in case an import adds to what is there. */
let expMode = 'new';
const MOX_HEAD = ['Count', 'Tradelist Count', 'Name', 'Edition', 'Condition', 'Language', 'Foil', 'Tags', 'Last Modified', 'Collector Number', 'Alter', 'Proxy', 'Purchase Price'];
function expRows(mode) {
  return S.items.filter(x => x.id).map(x => ({x, n: mode === 'all' ? x.qty : Math.max(0, x.qty - (x.sent || 0))})).filter(r => r.n > 0)
    .sort((a, b) => a.x.name.localeCompare(b.x.name));
}
const moxName = n => n;   // Moxfield reads full "A // B" names
function expText(rows) {
  return rows.map(({x, n}) => `${n} ${moxName(x.name)} (${x.set.toUpperCase()}) ${x.cn}${x.fin === 'foil' ? ' *F*' : x.fin === 'etched' ? ' *E*' : ''}`).join('\n');
}
function expCSV(rows) {
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const now = new Date().toISOString().replace('T', ' ').replace('Z', '').slice(0, 19) + '.000000';
  return [MOX_HEAD.map(q).join(','), ...rows.map(({x, n}) =>
    [n, 0, moxName(x.name), x.set, 'Near Mint', 'English', x.fin === 'nonfoil' ? '' : x.fin, '', now, x.cn, 'False', 'False', ''].map(q).join(','))].join('\r\n');
}
function openExport() {
  const newN = expRows('new').reduce((s, r) => s + r.n, 0), allN = expRows('all').reduce((s, r) => s + r.n, 0);
  if (!newN) expMode = 'all';
  const rows = expRows(expMode), pend = S.items.filter(x => x.pending).length;
  openSheet('Send to Moxfield', `
    ${S.sentAt ? `<div class="seg wide"><button data-act="expmode" data-v="new" class="${expMode === 'new' ? 'on' : ''}"${newN ? '' : ' disabled'}>New since last time · ${newN}</button><button data-act="expmode" data-v="all" class="${expMode === 'all' ? 'on' : ''}">Everything · ${allN}</button></div>` : ''}
    <p class="note" style="margin-top:var(--s3)">In Moxfield, open <b>Collection</b>, then <b>Import</b>. Paste this, or pick the saved file.${pend ? ` ${pend} card${pend === 1 ? ' is' : 's are'} left out until their printing is looked up.` : ''}</p>
    <textarea class="exp" id="exptext" readonly>${esc(expText(rows))}</textarea>
    <p class="small" id="expdone"></p>`,
    `<button class="btn primary" data-act="copy"${rows.length ? '' : ' disabled'}>Copy</button><button class="btn" data-act="savefile"${rows.length ? '' : ' disabled'}>Save file</button><button class="btn fill" data-act="sent" id="sentbtn" hidden>It’s in Moxfield</button>`);
}
function exported() {
  $('#sentbtn').hidden = false;
  $('#expdone').textContent = 'Once Moxfield has them, tap It’s in Moxfield so they are not sent twice.';
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {}
  let ta = $('#exptext'), tmp = null;
  if (!ta || ta.value !== t) {
    tmp = ta = document.createElement('textarea');
    ta.value = t; ta.readOnly = true; ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.append(ta);
  }
  let ok = false;
  ta.focus(); ta.select();
  try { ta.setSelectionRange(0, t.length); } catch (e) {}
  try { ok = document.execCommand('copy'); } catch (e) {}
  if (tmp) tmp.remove();
  return ok;
}
async function saveFile(name, text) {
  const file = new File([text], name, {type: 'text/csv'});
  if (matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({files: [file]})) {
    try { await navigator.share({files: [file]}); return true; } catch (e) { if (e.name === 'AbortError') return false; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  return true;
}

/* ---------- toast ---------- */
let undoFn = null, toastT = null;
function toast(msg, undo) {
  undoFn = undo || null;
  $('#toastmsg').textContent = msg;
  $('#toast').querySelector('button').hidden = !undo;
  $('#toast').hidden = false;
  clearTimeout(toastT);
  toastT = setTimeout(() => { $('#toast').hidden = true; undoFn = null; }, 6000);
}

/* ---------- taps ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'scan') startScan('col');
  else if (act === 'scanstop') stopScan();
  else if (act === 'tab') {
    // Tapping Deck check while on it goes back to the deck list.
    if (b.dataset.v === 'deck' && S.tab === 'deck' && NAV.length > 1) { history.go(1 - NAV.length); return; }
    S.tab = b.dataset.v; save(); render();
  }
  else if (act === 'dpick') {
    const src = b.dataset.src === 'mox' || b.dataset.src === 'own' ? b.dataset.src : 'table', id = src === 'table' ? null : b.dataset.id, was = S.deckSel;
    S.deckSel = {src, id, part: was && was.src === src && was.id === id ? was.part : 'main'};
    resetDeck(); save();
    go('board');
  }
  else if (act === 'dpart') { S.deckSel = {src: S.deckSel.src, id: S.deckSel.id, part: b.dataset.v === 'side' ? 'side' : 'main'}; resetDeck(); save(); go('check'); }
  else if (act === 'dmode') { S.deckMode = b.dataset.v === 'check' ? 'check' : 'state'; save(); renderDeck(); }
  else if (act === 'sscan') {
    if (!S.deckSel) return;
    S.deckSel = {src: S.deckSel.src, id: S.deckSel.id, part: b.dataset.v === 'side' ? 'side' : 'main', mode: 'state'};
    resetDeck(); save();
    go('pile');
  }
  else if (act === 'dresume') {
    const p = scansInProgress().find(x => x.key === b.dataset.k);
    if (!p) return;
    const c = p.c;
    S.deckSel = Object.assign({src: c.src || 'table', id: c.id || null, part: c.part || 'main'}, c.mode ? {mode: c.mode} : {});
    resetDeck(); save();
    go('board', true);
    go(c.mode === 'state' ? 'pile' : 'check');
  }
  else if (act === 'dback') goBack();
  else if (act === 'dview' || act === 'dupd') {
    if (b.dataset.src && b.dataset.id) S.deckSel = {src: b.dataset.src, id: b.dataset.id, part: 'main'};
    save(); go('view');
  }
  else if (act === 'pminus' || act === 'pplus') {
    const n = b.dataset.n, before = tallyOf(n);
    countDeck(n, act === 'pplus' ? 1 : -1);
    renderDeck();
    if (act === 'pminus' && before === 1) toast(`${front(n)} taken off.`, () => { countDeck(n, 1); renderDeck(); });
  }
  else if (act === 'psave') savePile();
  else if (act === 'scopy') {
    const w = b.dataset.which, t = VIEWTXT ? VIEWTXT[w] : '';
    if (!t) return;
    const ok = await copyText(t);
    if (ok && w !== 'all') { const inf = await deckInfo(S.deckSel); if (inf && inf.rec) { inf.rec.copiedAt = Date.now(); save(); } }
    toast(!ok ? 'Could not copy. Open See the text and copy it by hand.' : w === 'main' ? 'Copied. Paste it over the text in the Main Deck tab.' : w === 'side' ? 'Copied. Paste it over the text in the Sideboard tab.' : w === 'changes' ? 'Changes copied.' : 'Copied the whole deck, with headings.');
  }
  else if (act === 'sreopen') {
    const info = await deckInfo(S.deckSel), rec = info && info.rec, u = rec && rec.undo;
    if (!u) return;
    if (S.check && Object.keys(S.check.tally).length) S.held[selKey(S.check)] = S.check;
    restoreUndo(rec);
    S.check = {mode: 'state', src: u.src, id: u.id, part: u.part, name: info.name, stamp: null, tally: Object.assign({}, u.tally), at: u.at};
    S.deckSel = {src: u.src, id: u.id, part: u.part, mode: 'state'};
    resetDeck(); save();
    swapTo('pile');
  }
  else if (act === 'stable') tableFromState();
  else if (act === 'addok') {
    // He says nothing left the box when the new cards came in: the notice goes, with Undo.
    const inf = await deckInfo(S.deckSel), rec = inf && inf.rec;
    if (!rec || !rec.added) return;
    const was = rec.added; rec.added = null; save(); renderDeck();
    toast('Noted: nothing left the box.', () => { rec.added = was; save(); renderDeck(); });
  }
  else if (act === 'ownnew') {
    openSheet('A deck not on Moxfield', `<p class="note">Give it a name, then scan its main deck and side deck. Afterwards you can copy it to make a new deck on Moxfield.</p>
      <div class="search" style="margin:0 0 var(--s3)"><input id="ownname" type="text" placeholder="Deck name" maxlength="60" autocomplete="off" enterkeyhint="done" aria-label="Deck name"></div>
      <p class="small warn" id="ownmsg"></p>`, '<button class="btn fill" data-act="ownmake">Add deck</button>');
  }
  else if (act === 'ownmake') {
    const inp = $('#ownname'), name = inp ? inp.value.trim().replace(/\s+/g, ' ') : '';
    if (!name) { if ($('#ownmsg')) $('#ownmsg').textContent = 'Type a name first.'; if (inp) inp.focus(); return; }
    const id = 'o' + Date.now().toString(36), key = 'own:' + id;
    S.states[key] = {deckKey: key, name, src: 'own', main: null, side: null, pool: null, added: null, at: Date.now()};
    S.deckSel = {src: 'own', id, part: 'main'};
    resetDeck(); save(); closeSheet();
    go('board');
  }
  else if (act === 'ownrm') {
    const sel = S.deckSel;
    if (!sel || sel.src !== 'own') return;
    const key = 'own:' + sel.id, rec = S.states[key];
    if (!rec) return;
    const mine = k => k.indexOf('|own|' + sel.id + '|') >= 0, held = {};
    for (const k of Object.keys(S.held || {})) if (mine('|' + k)) { held[k] = S.held[k]; delete S.held[k]; }
    const chk = S.check && mine('|' + selKey(S.check)) ? S.check : null;
    if (chk) S.check = null;
    delete S.states[key];
    S.deckSel = null; resetDeck(); save();
    goBack();
    toast(`${rec.name} removed.`, () => { S.states[key] = rec; Object.assign(S.held, held); if (chk && !S.check) S.check = chk; save(); renderDeck(); });
  }
  else if (act === 'dlog') {
    const e = (S.deckLog || []).find(x => String(x.at) === b.dataset.at && x.id === b.dataset.id);
    if (e) { DONE = e; go('done'); }
  }
  else if (act === 'deckscan') {
    if (!DECK) return;
    if (!checkFits()) S.check = newCheck();
    save(); startScan('deck');
  }
  else if (act === 'dhave') { countDeck(b.dataset.n, +b.dataset.q || 1); renderDeck(); }
  else if (act === 'dmis') { countDeck(b.dataset.n, -1); renderDeck(); }
  else if (act === 'dadd') addDeckName(b.dataset.n);
  else if (act === 'dnone') { if (DECK) { S.check = newCheck(); save(); renderDeck(); } }
  else if (act === 'dfinish') finishCheck();
  else if (act === 'dcopy') {
    const w = b.dataset.which;
    const t = !DONE ? '' : w === 'changes' ? changeText(DONE, DONESKIP) : pasteBoard(DONE);
    if (!t) return;
    const ok = await copyText(t);
    toast(ok ? (w === 'changes' ? 'Changes copied.' : `Copied. Paste it over the text in the ${DONE.part === 'side' ? 'Sideboard' : 'Main Deck'} tab.`) : 'Could not copy. Open See the text and copy it by hand.');
  }
  else if (act === 'dtable') { if (DONE) tableFromCheck(DONE); }
  else if (act === 'dreopen') {
    const e = DONE;
    if (!e) return;
    if (S.check && selKey(S.check) !== selKey(e) && Object.keys(S.check.tally).length) S.held[selKey(S.check)] = S.check;
    S.check = {src: 'mox', id: e.id, part: e.part, name: e.deck, stamp: e.stamp, tally: Object.assign({}, e.tally), at: e.at};
    S.deckLog = (S.deckLog || []).filter(x => x !== e);
    // What this check recorded goes back too, so the fixed scan is not counted twice.
    const rec = S.states && S.states['mox:' + e.id];
    if (rec && rec.undo && rec.undo.at === e.at) restoreUndo(rec);
    S.deckSel = {src: 'mox', id: e.id, part: e.part};
    DONE = null; resetDeck(); save();
    swapTo('check');
  }
  else if (act === 'deckapply') applyDeck();
  else if (act === 'deckreset') {
    const was = S.check;
    S.check = null; resetDeck(); save(); renderDeck();
    if (was && Object.keys(was.tally).length) toast('Scan cleared.', () => { S.check = was; resetDeck(); save(); renderDeck(); });
  }
  else if (act === 'scanundo' && scan && scan.mode === 'deck') {
    if (!scan.hist.length) return;
    const n = scan.hist.pop();
    countDeck(n, -1);   // the card stays blocked until it leaves the frame, so a misread is not read again
    $('#last').hidden = true;
    $('#scanundo').hidden = !scan.hist.length;
    scanMsg(`Took out <b>${esc(n)}</b>.`);
  }
  else if (act === 'plus' && b.dataset.n) {
    if (!scan) return;
    countDeck(b.dataset.n, 1); scan.hist.push(b.dataset.n); showLastDeck(b.dataset.n);
  }
  else if (act === 'scanundo') {
    if (!scan || !scan.hist.length) return;
    const k = scan.hist.pop(), it = S.items.find(x => x.k === k);
    takeOne(k);
    $('#last').hidden = true;
    $('#scanundo').hidden = !scan.hist.length;
    scanMsg(it ? `Took out <b>${esc(front(it.name))}</b>.` : 'Taken out.');
  }
  else if (act === 'plus') {
    const it = S.items.find(x => x.k === b.dataset.k);
    if (!it) return;
    it.qty++; it.at = Date.now(); save();
    if (scan) { scan.hist.push(it.k); showLast(it); }
    render();
  }
  else if (act === 'foil') { S.foil = !S.foil; save(); renderChips(); }
  else if (act === 'sets') openSets();
  else if (act === 'setpick') {
    const code = b.dataset.v;
    S.set = code ? {code, name: ((SETS || []).find(s => s.code === code) || {}).name || code} : null;
    save(); closeSheet(); renderChips();
    loadSetNames();
    if (scan) scanMsg(S.set ? `Scanning cards from <b>${esc(S.set.name)}</b>.` : 'Scanning cards from any set.');
  }
  else if (act === 'close') closeSheet();
  else if (act === 'item') openItem(b.dataset.k);
  else if (act === 'qty') {
    const it = S.items.find(x => x.k === sheetK);
    if (!it) return;
    const n = it.qty + (+b.dataset.v);
    if (n <= 0) { removeItem(it); return; }
    it.qty = n; it.sent = Math.min(it.sent, n); save(); render(); openItem(it.k);
  }
  else if (act === 'fin') {
    const it = S.items.find(x => x.k === sheetK);
    if (it) openItem(setFinish(it, b.dataset.v).k);
  }
  else if (act === 'remove') {
    const it = S.items.find(x => x.k === sheetK);
    if (it) removeItem(it);
  }
  else if (act === 'prints') openPrints();
  else if (act === 'pick') {
    const it = S.items.find(x => x.k === sheetK), p = (openPrints.list || []).find(x => x.id === b.dataset.id);
    if (!it || !p) return;
    const n = changePrint(it, p);
    if (scan && scan.hist.length && scan.hist[scan.hist.length - 1] === it.k) { scan.hist[scan.hist.length - 1] = n.k; showLast(n); }
    openItem(n.k);
  }
  else if (act === 'addname') addByName(b.dataset.n);
  else if (act === 'sort') { S.sort = b.dataset.v; save(); renderList(); }
  else if (act === 'prices') refreshPrices(false);
  else if (act === 'export') openExport();
  else if (act === 'expmode') { expMode = b.dataset.v; openExport(); }
  else if (act === 'copy') {
    const ok = await copyText($('#exptext').value);
    toast(ok ? 'Copied. Paste it into Moxfield.' : 'Could not copy. Select the text and copy it by hand.');
    exported();
  }
  else if (act === 'savefile') {
    const d = new Date(), stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    if (await saveFile(`collection-${stamp}.csv`, expCSV(expRows(expMode)))) exported();
  }
  else if (act === 'sent') {
    const rows = expRows(expMode);
    const before = S.items.map(x => [x, x.sent, S.sentAt]);
    rows.forEach(({x}) => { x.sent = x.qty; });
    const was = S.sentAt;
    S.sentAt = Date.now(); expMode = 'new';
    save(); closeSheet(); render();
    toast(`${rows.reduce((s, r) => s + r.n, 0)} cards marked as in Moxfield.`, () => { before.forEach(([x, s]) => { x.sent = s; }); S.sentAt = was; save(); render(); });
  }
  else if (act === 'undo') {
    const f = undoFn;
    $('#toast').hidden = true; undoFn = null;
    if (f) f();
  }
});
function removeItem(it) {
  const i = S.items.indexOf(it);
  if (i < 0) return;
  S.items.splice(i, 1);
  save(); closeSheet(); render();
  toast(`${front(it.name)} removed.`, () => { S.items.splice(Math.min(i, S.items.length), 0, it); save(); render(); });
}
$('#q').addEventListener('input', onType);
$('#q').addEventListener('focus', () => { ensureNorm().catch(() => {}); });
$('#q').addEventListener('keydown', e => {
  if (e.key === 'Enter' && lastHits.length) { e.preventDefault(); addByName(lastHits[0]); }
  if (e.key === 'Escape') { $('#q').value = ''; onType(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (document.querySelector('.sheet')) closeSheet();
  else if (scan) stopScan();
});
window.addEventListener('online', fixPending);

/* ---------- start ---------- */
(async () => {
  let saved;
  // A read that fails while the database opens is not "nothing stored": no save until a reload.
  // (When the database cannot open at all, writes fail too and the usual warning shows.)
  try { saved = await DB.read('state'); } catch (e) { saved = undefined; try { await DB.ping(); readFailed = true; } catch (x) { readFailed = false; } }
  if (readFailed) { saveOK = false; renderWarn(); }
  if (saved && saved.v === 1) S = Object.assign(fresh(), saved);
  if (!S.states) S.states = {};
  migrateChecks();
  // A fresh visit opens on the deck list; a reload comes back to the same step.
  navTo(history.state);
  try { history.replaceState(navState(DV), ''); } catch (e) {}
  render();
  getRate();
  fixPending();
  const oldest = S.items.filter(x => x.pAt).reduce((m, x) => Math.min(m, x.pAt), Infinity);
  if (oldest < Date.now() - 3 * DAY) refreshPrices(true);
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
})();
</script>
